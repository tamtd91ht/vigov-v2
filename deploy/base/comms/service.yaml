apiVersion: v1
kind: Service
metadata:
  name: comms
spec:
  selector: { app.kubernetes.io/name: comms }
  ports:
    - { name: rest, port: 8080, targetPort: rest }
    # Tên DNS trong cụm: comms.<namespace>.svc.cluster.local:9090
    # Đích của bộ chạy tự động hoá ở `petitions` và `documents` (`DeliverStaffNotifications`,
    # ADR 0058). Không có dòng này thì mọi lượt giao chuông cán bộ bị từ chối, pod vẫn xanh.
    - { name: grpc, port: 9090, targetPort: grpc }

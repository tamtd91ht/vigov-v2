<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <!--
      No `user-scalable=no` and no `maximum-scale`: pinch-zoom stays available. Disabling zoom
      is the single most common way a mobile page becomes unusable for an ageing eye, and it is
      never worth the layout it protects.
      `viewport-fit=cover` is what makes env(safe-area-inset-*) resolve in styles.css.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3150" />
    <!--
      Icon sinh từ `tools/logo.py`, không phải tệp ai đó kéo vào kho: màu `#1e3150` ở đây,
      trong `app-config.json` và trong `--navy` của styles.css phải là MỘT giá trị, và một
      trình sinh là chỗ duy nhất nói được điều đó thành lời.
      Đường dẫn TƯƠNG ĐỐI — Mini App chạy từ một đường dẫn do nền tảng chọn, `/icon-192.png`
      sẽ trỏ vào hư không trên máy thật trong khi `vite preview` vẫn đúng.
    -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./icon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
    <meta
      name="description"
      content="Giới thiệu VihatSoftware — Outsourcing Software Development Company."
    />
    <title>VihatSoftware</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

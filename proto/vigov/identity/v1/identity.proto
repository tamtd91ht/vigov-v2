syntax = "proto3";

package vigov.identity.v1;

import "google/protobuf/timestamp.proto";

// Identity owns two clearly separated populations.
//
// Staff are per-commune, accountable, and governed by RBAC.
// Citizens are PLATFORM-WIDE with a many-to-many relationship to communes, because a person
// registered in one commune may live, work, or report an issue in another.
// See kb/10-decisions/0002-citizen-identity-platform-level.md.
//
// IT ALSO OWNS TWO THINGS THAT ARE NOT POPULATIONS, and they are halves of one answer:
//
//   THE COMMUNE'S WORKING CALENDAR — its ordinary week, its public holidays, its swap working
//   days (service-identity/migrations/0006_lich_lam_viec.sql). It answers WHEN the authority is
//   open. It sits here because ADR 0024 places ownership with the CADENCE OF CHANGE rather than
//   with the reader: a commune's office hours change with its administration, alongside
//   `bo_phan`, `vai_tro` and `thon_to_dan_pho`, which already live here — not with a petition.
//
//   THE COMMUNE'S PROCESSING DEADLINES in working hours, the `sla` table
//   (service-identity/migrations/0008_sla.sql, ADR 0029, decided 2026-09-20). It answers HOW
//   LONG. It is read by `documents` (`van-ban-den`, `don-thu`) and by `petitions` (`phan-anh`,
//   `nhiem-vu`), belongs to neither, and changes with the same administrative policy the
//   calendar does.
//
// THREE RPCs LEAVE THIS SERVICE FROM THAT PAIR, AND THE SPLIT IS DELIBERATE — see ResolveDeadlines
// for the argument. AdvanceWorkingHours is the calendar alone, for a caller that already holds
// the number of hours; ResolveDeadlines is both halves, for a caller fixing a commitment;
// ResolveDueSoonCutoff (added 2026-09-28) is both halves again, for a caller FILTERING a list by
// `gio_sap_den_han`. All three answer INSTANTS, none hands out the calendar or an `sla` number of
// hours, and all three walk the same one implementation of the count. Until 2026-09-28 this
// paragraph said "no third path exists"; a fourth is a sentence somebody has to write here first.
//
// THAT SENTENCE, WRITTEN 2026-09-29: ResolveEscalationInstants is the fourth. It is both halves
// again — `gio_bao_lanh_dao` / `gio_bao_chu_tich` counted forward from a deadline a record already
// missed — for the automation runner's `escalation` job (user decision 2026-09-29: the jobs run
// in the service owning the data, their per-commune settings live here next to `sla`). It too
// answers INSTANTS and walks the same forward count; the reason it is not a field on any of the
// three is on its own comment.
//
// AND ResolveUnassignedHoldInstants IS THE FIFTH, same date, same shape: `unassigned_hold_hours`
// (migration 0016) counted forward from the instant a unit began holding work with nobody assigned,
// for the `sla_reminders` job. Why it is its own RPC and not a field on the fourth: its comment.
//
// AND MeasureWorkingHours IS THE SIXTH (user decision 2026-10-02), and the first that answers a
// LENGTH rather than an instant: the working time between two instants the caller already holds —
// the measuring half of AdvanceWorkingHours, through the same one walk. It reads no `sla` row, so
// ADR 0029 §Bổ sung ("no `sla` hours leave this service") is not touched by it; why a length may
// leave when an `sla` number may not is on its own comment.
//
// AND IT OWNS ONE MORE THING SINCE THE SAME DATE: the per-commune SETTINGS OF THE AUTOMATION JOBS
// (docs/ui-ux/14-cau-hinh.md §9, "Tự động hoá") and their run state. ClaimDueAutomationRuns and
// RecordAutomationRunOutcome are the whole of what crosses this boundary for them; the schedule
// itself never does, so there is one implementation of "is this job due".
//
// CONTRACT RULE — the commune travels in gRPC METADATA, never in a message body.
//
//   metadata key: "x-tenant-id"  (lowercase — gRPC lowercases every key)
//
//   * A body is data the CALLER declares, and a caller naming its own commune is a caller
//     granting itself access (rule 1, forbidden #2). The key is set by the client
//     interceptor out of context.Context, never passed as a business argument.
//   * A receiver that finds no "x-tenant-id" REFUSES the call with INVALID_ARGUMENT. It
//     never falls back to a default commune and never infers one from the payload — a
//     default on the isolation path collapses isolation silently, with tests still green.
//   * The key sits inside the "x-tenant" prefix that core/httpx.StripTenantHeaders already
//     deletes from client-supplied requests, so a client that tries to inject it at the
//     public edge loses it before any handler runs. Picking a key outside that prefix would
//     have created a header nothing strips.
//
// NOT the same thing: the `tenant_id` FIELD on Staff below is an attribute of the stored
// record — which commune that row belongs to. It is an answer the server returns, never an
// input, and it is never read to decide what the caller may see.
//
// ONE RPC HERE CANNOT OBEY THE RULE ABOVE, AND IT IS NOT YET EXCUSED FROM IT.
// ResolveCitizenSession is the call that ESTABLISHES the commune of a citizen request: the Mini
// App has no domain (ADR 0005), so the citizen edge has no Host to resolve and derives the
// commune FROM the session (ADR 0022). Requiring "x-tenant-id" on it is the loop ADR 0012 §A
// describes for ResolveHost — knowing the commune in order to find the commune. It therefore
// needs a place on core/grpcx.methodsWithoutTenant, and ADR 0012 decision 1 makes ADDING A
// SECOND NAME TO THAT LIST A STOP CONDITION: the user decides it, not whoever is writing code.
// Until that question is asked and answered the name is NOT on the list, the client interceptor
// refuses the call with INVALID_ARGUMENT, and core/grpcx/grpcx_test.go pins the absence so the
// answer cannot be given by accident. The contract is written and the implementation exists; the
// one line that makes them reachable is deliberately not written.
//
// Field numbers are never reused; a removed field becomes `reserved`. New fields are always
// optional with a safe default.

service IdentityService {
  // ResolveStaffPrincipal turns the session credential a staff member's browser holds into the
  // principal every service's guards need: who is acting, and what they may do, in the commune
  // the call already names.
  //
  // WHY IT EXISTS. `XacThuc` (service-identity/internal/http/middleware.go:71) is the only
  // thing in this system that builds a principal, and it sits inside identity's `internal/`,
  // which rule 2 forbidden #1 forbids any other service from importing. Without this RPC a
  // guarded route in service-documents, -finance, -comms or -petitions answers 401 to EVERY
  // caller, including a member of staff holding a perfectly valid session. That is not a
  // hypothesis: six catalogue routes shipped in that state and were measured doing it on
  // 2026-09-20.
  //
  // # It runs on every staff request, and there is no cache
  //
  // ONE CALL PER REQUEST, PER SERVICE. A page of the admin web that fires four XHRs pays four
  // of these. Say the cost out loud rather than discover it: one LAN round trip, plus — inside
  // identity — the session-registry read, the account read and the grant read that `XacThuc`
  // already performs today on every one of ITS requests.
  //
  // THE OBVIOUS SAVING IS NOT AVAILABLE, and the argument is already written down for the
  // citizen path in service-identity/internal/store/phien_cong_dan.go: ADR 0010 fixes the data
  // infrastructure at PostgreSQL only, so there is no shared cache; identity runs several
  // replicas, so any cache is PER PROCESS; and a revocation served by one replica has no
  // channel on which to reach the copy held by another. A TTL cache here — in identity or in
  // the four callers — would therefore keep a revoked session, a locked account or a withdrawn
  // role working for the length of that TTL, on every process that did not serve the
  // revocation. Rule 5, invariant 4 exists precisely so that cannot happen, and a cache with no
  // invalidation trades it away silently: nothing turns red, and the property is not one any
  // test would discover.
  //
  // So the flow is STRONGLY CONSISTENT by construction, declared as such in
  // kb/30-indexes/transaction-boundaries.json (`xac_thuc_can_bo_lien_service`) — which is where
  // to argue with this decision, not in a caller's hot path.
  //
  // # Not batched, and that is not a lapse from ADR 0012 decision 2
  //
  // Batching is the default for lookup RPCs because their caller is a LIST SCREEN decorating
  // rows, and a singular form makes one round trip per row. That reasoning has no purchase
  // here: the caller is ONE HTTP request holding ONE credential, and there is no list from
  // which a second credential could arrive. A batched form would be a shape no caller can fill.
  //
  // # The commune, and the comparison rule 1 invariant 8 asks for
  //
  // THIS RPC IS NOT EXEMPT FROM CARRYING A COMMUNE, and it must never become exempt: it is
  // always called from a service edge that has ALREADY resolved the commune from Host, so
  // "x-tenant-id" costs the caller nothing and is present by the time the call is made.
  //
  // That metadata value IS the Host-derived commune, which makes this RPC the place where rule
  // 1, invariant 8 is enforced ONCE for all four services: the server decodes the credential,
  // compares the commune inside it with the commune in metadata, and on a mismatch answers with
  // no principal AND raises the security alert that skills/session-and-token §2 requires. Four
  // services each remembering to make that comparison is four places for one of them to forget,
  // and the one that forgets serves one commune's staff inside another commune's data.
  //
  // WHAT THE COMPARISON IS WORTH, STATED HONESTLY: "x-tenant-id" remains a CLAIM by the caller
  // (ADR 0025 — the one shared caller key proves a call came from inside the deployment, never
  // WHICH service made it). What the comparison does buy is absolute: the answer can never be
  // wider than the credential presented, because a credential issued for commune A yields
  // nothing at all when the call names commune B, and nothing in this service mints credentials
  // on a caller's say-so.
  //
  // # What it deliberately does NOT reproduce from XacThuc
  //
  //   * XacThuc answers 401 IMMEDIATELY on a commune mismatch, even on a Public route, and
  //     clears the cookie. Here a mismatch is simply "no principal", so a Public route in the
  //     calling service still serves and the stale cookie is not cleared. The part that
  //     mattered — the ALERT — is preserved and is now raised in one place instead of four. The
  //     part given up is unreachable in practice by the client this protects against: a browser
  //     does not send a cookie across hosts, which is why XacThuc's own comment calls that case
  //     a deliberate probe rather than a user mistake.
  //   * The session id, the registry's expiry, and the two display fields XacThuc copies onto
  //     PhienHienTai do not cross this boundary. See StaffPrincipal for each omission's reason.
  //
  // # Failure has exactly one answer
  //
  // Unknown credential, malformed credential, expired token, revoked session, locked account,
  // soft-deleted account, wrong commune: ALL of them return an OK response with no principal.
  // There is no reason code and no enum, and there is deliberately no way to add one without
  // this paragraph being edited. A response that varies with the reason tells whoever is
  // probing how close they are — the same discipline that makes an absent id in
  // BatchGetStaffResponse indistinguishable between "does not exist", "deleted" and "another
  // commune", and the same one rule 4 forbidden #2 imposes on 404 versus 403.
  //
  // THE STATUS CODES ARE PART OF THE CONTRACT, and confusing any two of them is expensive:
  //
  //   OK + no principal   the credential is not usable. The caller builds no principal and lets
  //                       its guards answer — 401 on a guarded route, served on a Public one,
  //                       exactly as if no credential had been presented.
  //   INVALID_ARGUMENT    `session_token` was empty. A caller with no credential MUST NOT call
  //                       at all, so this is a wiring fault and is answered loudly rather than
  //                       as "no principal": the quiet answer would cost a round trip on every
  //                       anonymous request, forever, with nothing to report it.
  //   UNAUTHENTICATED     NEVER produced by this RPC. That code belongs to the caller-key
  //                       interceptor (core/grpcx.UnaryServerCallerAuth, ADR 0025) and means
  //                       the DEPLOYMENT is misconfigured — every call failing, not one user's
  //                       session being stale. Reusing it here would make an operator unable to
  //                       tell a fleet-wide outage from an ordinary expired login.
  //   UNAVAILABLE etc.    the call did not happen. IT IS NOT "no principal": a caller that
  //                       treats an outage as anonymity turns "identity is down" into
  //                       "everybody is signed out", and staff are then told to sign in again
  //                       through the service that is down. Answer 503.
  rpc ResolveStaffPrincipal(ResolveStaffPrincipalRequest) returns (ResolveStaffPrincipalResponse);

  // ResolveCitizenSession turns the bearer token a Mini App holds into the opaque identifiers the
  // citizen edge needs: which session, which citizen, WHICH COMMUNE, and — for a bridge session —
  // which Zalo account (CitizenSessionPrincipal.zalo_account_id, 08/10/2026).
  //
  // WHY IT EXISTS. `core/httpx.CitizenEdge` needs a `core/httpx.CitizenSessions`, and the only
  // implementation is `*store.PhienCongDanStore` inside service-identity's `internal/`
  // (service-identity/internal/store/phien_cong_dan.go:180, `TraCuu`), which rule 2, forbidden #1
  // forbids any other service from importing. Without this RPC service-petitions — the service
  // that owns the ONE object a citizen creates and then watches (rule 10) — cannot mount a
  // citizen edge at all, and said so in its own source rather than shipping a second, weaker
  // session reader (service-petitions/internal/http/routes.go, the `TUYẾN CÔNG DÂN GỬI` note).
  //
  // # IT RESOLVES A SESSION. IT GRANTS NOTHING.
  //
  // This is the sentence that has to survive every later edit. A citizen identity is a phone
  // number plus an OTP, which rule 4 calls deliberately weak: phone numbers change hands, SIMs
  // get taken over, OTPs get read over a shoulder. So there is no permission set in the response
  // and there must never be one — not a `permission_keys`, not a role, not a capability flag.
  // Whatever a citizen may see is decided by rule 4's isolation (their own records, in one
  // commune) at the point of the query, never by anything this RPC hands back.
  //
  // THE ASYMMETRY WITH ResolveStaffPrincipal IS THE WHOLE DESIGN, not an unfinished half:
  // that RPC answers "who is acting AND what may they do", this one answers only "whose session
  // is this, and in which commune". Merging the two messages, or growing this one toward the
  // other, would put the weaker trust level behind the shape that carries authority.
  //
  // # The commune is the ANSWER, and the caller may not choose it
  //
  // ADR 0022: the citizen channel resolves the commune FROM THE SESSION, never from Host and
  // never from anything the client sent. `tenant_id` is therefore in the RESPONSE body — the
  // subject being answered, exactly the distinction ADR 0012 §B draws for ResolveHost — and
  // there is no commune field in the REQUEST. A caller cannot ask "is this session valid IN
  // COMMUNE X", because that question is a client naming its own commune (rule 1, forbidden #2)
  // wearing the clothes of a stricter check.
  //
  // AN EMPTY `tenant_id` IN THE RESPONSE IS A REAL ANSWER, NOT A MISSING VALUE. ADR 0005
  // separates discovery from session: a citizen signs in first, and the screen that offers the
  // choice of commune is called WITH that session. The caller must map it to
  // `httpx.CitizenSession.TenantID == ""`, where `httpx.XaTuPhien` answers 401 on every business
  // route. A caller that substitutes any default there is rule 1, forbidden #1.
  //
  // # THIS RPC CANNOT CARRY "x-tenant-id", AND IS NOT YET EXCUSED FROM CARRYING IT
  //
  // See the paragraph at the top of this file. It is the citizen channel's ResolveHost, so it
  // belongs on core/grpcx.methodsWithoutTenant — and putting a second name on that list is a
  // STOP CONDITION under ADR 0012, decision 1, which is the user's to answer. Until it is
  // answered, calls made through core/identityclient are refused locally by the client
  // interceptor. That is the contract working, not a bug to route around: DO NOT make the caller
  // invent a commune to satisfy the interceptor.
  //
  // # NO PERSONAL DATA CROSSES THIS BOUNDARY, BY CONSTRUCTION
  //
  // Opaque, server-minted identifiers only — four since 08/10/2026 (zalo_account_id, see the
  // message) — and never a field that is not one: the same refusal `core/httpx.CitizenSession`
  // makes, for the same reason. A citizen is identified in the
  // business by phone number (ADR 0020), and a phone number is personal data under Decree
  // 13/2023 (rule 3). This RPC runs on EVERY request of EVERY citizen, which makes it the single
  // most likely line in the system to put an entire commune's phone numbers into a log. Adding
  // `phone_masked` here — even masked — would be adding it to the hottest path in the system for
  // a caller that has no use for it: `CitizenIdentity` already exists for the callers that do.
  //
  // # Failure has exactly one answer
  //
  // Unknown token, malformed token, expired session, revoked session, a session the registry
  // cannot attribute: ALL of them return OK with no session. No reason code, no enum, and no way
  // to add one without editing this paragraph — a response that varies with the reason tells
  // whoever is probing how close they are (rule 4, forbidden #2). `core/httpx.CitizenSessions`
  // makes the identical promise at the edge, in the same words.
  //
  //   OK + no session   the token is not usable. The caller builds no session, so every business
  //                     route answers 401 exactly as if no token had been presented.
  //   INVALID_ARGUMENT  `session_token` was empty. The edge never calls without a bearer token,
  //                     so this is a wiring fault and is answered loudly rather than as "no
  //                     session": the quiet answer would cost a round trip on every anonymous
  //                     request of the citizen channel, forever, with nothing to report it.
  //   UNAUTHENTICATED   NEVER produced by this RPC — it belongs to the caller-key interceptor
  //                     (ADR 0025) and means the DEPLOYMENT is misconfigured.
  //   UNAVAILABLE etc.  the call did not happen. IT IS NOT "no session": a caller that reads an
  //                     outage as anonymity tells every citizen their session ended, through the
  //                     one channel a commune is judged on (rule 10). Answer 503.
  //
  // # It runs on every citizen request, and there is no cache
  //
  // The argument is already written out twice and is unchanged here: ADR 0010 fixes the data
  // infrastructure at PostgreSQL only so there is no shared cache; identity runs several
  // replicas so any cache is PER PROCESS; and a revocation served by one replica has no channel
  // on which to reach a copy held by another. What a TTL would buy back here is measured in
  // milliseconds; what it would sell is the "log this screen out" button of ADR 0019 step 6,
  // pressed at a one-stop counter the citizen has already walked away from. See
  // service-identity/internal/store/phien_cong_dan.go for the full version.
  //
  // # Not batched, for the same reason ResolveStaffPrincipal is not
  //
  // The caller is ONE HTTP request holding ONE bearer token. There is no list from which a
  // second token could arrive, so a batched form would be a shape no caller can fill.
  rpc ResolveCitizenSession(ResolveCitizenSessionRequest) returns (ResolveCitizenSessionResponse);

  // BatchGetStaff resolves staff by id — plural by design, there is no singular form.
  //
  // WHY BATCHED AND NOT GetStaff(id): the caller is always a list screen decorating rows
  // with a handler's name. A singular RPC means one network round trip PER ROW, a cost that
  // grows with the data and is invisible in tests — 20 rows, 20 calls; 3.000 rows, 3.000
  // calls and the page stops loading.
  // See .claude/skills/load-data-once/SKILL.md, REQUIRED #4.
  //
  // ⚠ THE NAME IN THAT PARAGRAPH IS NOT SERVED HERE, AND IT IS NOT AN OVERSIGHT. `message Staff`
  // carries no name and must not grow one: ResolveStaffNames below is the ONE path by which a
  // staff member's name crosses this boundary, and one path is what makes there be one place to
  // widen, one place to refuse a phone number, and one place to say whether the record is still in
  // the directory. THIS RPC ANSWERS A DIFFERENT QUESTION — is this id a staff record of this
  // commune today, and what role does it hold — and its answer is the one a caller may DECIDE
  // from. A screen needing both asks both; the second call is the price of not merging two
  // populations behind one predicate.
  rpc BatchGetStaff(BatchGetStaffRequest) returns (BatchGetStaffResponse);

  // ResolveStaffNames turns the staff ids an ALREADY-STORED RECORD carries into names a person can
  // read — INCLUDING ids whose staff record has since been removed from the commune's directory.
  //
  // WHY IT EXISTS, AND IT IS NOT A CONVENIENCE. `audit_log.actor_id` is TEXT with NO foreign key
  // (service-identity/migrations/0001_init.sql:22), deliberately, so the trail outlives the row it
  // points at. The ENTRY therefore survives a deletion — and the ability to READ it does not,
  // because the only thing in this system that turns that id into a person is this service, and
  // BatchGetStaff answers nothing at all for a soft-deleted id. A 2026 handling sheet opened in
  // 2029 then shows a ULID where a name belongs, at the exact moment an inspection asks *"ai xử lý
  // việc này"*. Rule 6, invariant 2 does not break at the deletion; it breaks SILENTLY, years
  // later, in front of the person who came to check.
  //
  // OPEN QUESTION #10, DECIDED 2026-09-22, NAMES THIS PATH AS PART OF THE DECISION rather than as
  // follow-up work: retiring or transferring a member of staff is a LOCK and they stay in the
  // directory; a duplicated row is a SOFT DELETE. Two operations — and the second one is what used
  // to take a name off every record that person had ever touched.
  //
  // # IT RESOLVES A NAME. IT DECIDES NOTHING.
  //
  // The sentence that has to survive every later edit, and the same discipline ResolveCitizenSession
  // states for itself. What comes back is for DISPLAY: printing who acted, beside a record the
  // caller was already entitled to open. No role, no permission, no department, nothing a caller
  // could route work by.
  //
  // A CALLER MUST NOT DECIDE ANYTHING FROM IT — not "this id is valid staff", not "this person can
  // be assigned", not "this account exists". Deciding from this RPC treats a name that is here
  // PRECISELY BECAUSE the record was removed as evidence that the record is there. The membership
  // question has an RPC of its own, with the predicate that belongs to it: BatchGetStaff. The
  // "can this person be assigned" question has ANOTHER, because BatchGetStaff's predicate answers
  // locked and account-less people as present: ResolveAssignableStaff.
  //
  // # WHY A SECOND RPC AND NOT A FLAG — the decision this contract exists to record
  //
  // Three shapes were on the table, and the two rejected ones are rejected for reasons that
  // outlive today's callers:
  //
  //   A FLAG (`include_deleted`) ON BatchGetStaff — the cheapest line to write, and it fails
  //   twice. FIRST, it does not answer the question on its own: `message Staff` carries no name,
  //   so the flag would have to arrive together with a name ON Staff, and then the ORDINARY path —
  //   the one an assignee dropdown calls — starts carrying personal data it has no use for.
  //   SECOND, a flag makes one response mean two things depending on a request field, and `Staff`
  //   has nowhere to say which it is: a removed record would come back INDISTINGUISHABLE from a
  //   serving one, so a caller that set the flag "to be safe" would offer a deleted row in a
  //   dropdown with nothing turning red. ADR 0029 §119 refused the same shape for the same reason
  //   when ResolveDeadlines could have been a flag on AdvanceWorkingHours, and the property bought
  //   there is bought again here: A REVIEWER CAN TELL THE TWO CALL SITES APART.
  //
  //   A SECOND LIST IN THE RESPONSE (`items` + `removed_items`). It puts the distinction where it
  //   cannot be missed, and it MOVES the failure rather than removing it: a caller that renders the
  //   first list and forgets the second drops exactly the name it opened the call for, and the
  //   archival record renders blank where a person's name belongs. One list, mapped by id, with one
  //   field that says how to label the name, has no branch to forget.
  //
  // WHAT THE SECOND RPC COSTS, STATED: one more method on this service, and a screen needing both
  // a name and a role now makes two calls. That is real, and it is the smaller cost — the two
  // calls ask two different questions about two different populations.
  //
  // # IT IS A LOOKUP BY AN ID THE CALLER ALREADY HOLDS. IT IS NOT, AND MUST NEVER BECOME, A LIST
  //
  // THE QUESTION IS ANSWERED OUT LOUD BECAUSE IT HAS TO BE: "read the names of removed staff" is
  // one careless field away from "enumerate the people a commune deleted", which would be a new
  // leak surface built by the fix for an old one.
  //
  // FOUR PROPERTIES MAKE IT A LOOKUP, and all four are structural rather than a promise:
  //
  //   1. THE REQUEST HAS EXACTLY ONE FIELD AND IT IS A LIST OF IDS. No filter, no cursor, no page
  //      size, no "since", no name prefix, no department. There is no request this server can
  //      answer with an id the caller did not already name.
  //   2. AN EMPTY `ids` ANSWERS EMPTY — never everything. That is the single line a later edit
  //      could turn a lookup into a listing with, so it is in the contract and not left to the
  //      implementation.
  //   3. THE RESPONSE NEVER CARRIES AN ID THAT WAS NOT REQUESTED, and carries no count and no
  //      cursor from which a caller could learn that anything else exists.
  //   4. THE IDS ARE ULIDs AND THE ANSWER IS SCOPED BY "x-tenant-id": 80 random bits cannot be
  //      walked, and an id belonging to another commune is simply absent.
  //
  // WHAT IT DOES GIVE, SAID HONESTLY RATHER THAN DENIED: whoever already holds a commune's records
  // can recover the name of everybody who acted on them, including people whose staff record was
  // removed. THAT IS WHAT AN ARCHIVAL RECORD IS FOR. What it cannot give is a ROSTER — a person who
  // appears on no record the caller holds is unreachable through this path, and reading the record
  // that names an id is itself guarded in the calling service.
  //
  // THE LINE THAT MUST NEVER BE CROSSED: no field may be added to the request that is anything but
  // an id the caller already holds. A predicate here — a date range, a department, "everyone
  // removed since" — converts this RPC into the listing it was designed not to be, in one line,
  // with every existing test still green.
  //
  // # The commune travels in metadata, and this RPC is not a candidate for exemption
  //
  // ONE CALL, ONE COMMUNE. "x-tenant-id" is what makes an id of another commune answer nothing, so
  // an exemption here would not merely be unnecessary — it is the thing that would open the leak.
  // The caller always holds it: a screen reading an archival record runs behind an edge that has
  // already resolved the commune from Host. Putting this method on core/grpcx.methodsWithoutTenant
  // is a STOP CONDITION in its own right (ADR 0012, decision 1), and that list has exactly two
  // names.
  //
  // # IT RETURNS PERSONAL DATA, AND THREE FIELDS ARE THE WHOLE OF IT
  //
  // A member of staff who has left is still a real person, and Decree 13/2023 does not stop
  // applying to a row somebody deleted. StaffName carries why each field is there, and a longer
  // list of what is deliberately not.
  //
  // THE NAME IS NOT MASKED, and that is open question #11, DECIDED 2026-09-22: inside one commune,
  // staff data is not masked from staff. THE DECISION'S OWN LIMIT TRAVELS WITH IT — it covers an
  // INTERNAL SCREEN. An Excel export, or anything leaving the authority, is still masked (rule 3,
  // invariant 4), and that obligation is the CALLER's: this RPC cannot see which surface its answer
  // is heading for.
  //
  // NEVER LOG THIS RESPONSE. The generated String() prints `full_name` in full, and `debug_redact`
  // is a no-op in protobuf-go v1.36.12 — measured on 2026-09-20, not assumed. A `%+v` anywhere on
  // this path puts a commune's staff roster into the log pipeline, from where it cannot be recalled
  // (rule 3, forbidden #1). Log the id; never the message.
  //
  // # Reading this is NOT audited, and that is a decision rather than an omission
  //
  // Rule 6, invariant 7 audits reads of FULL personal data. It is not applied here, for two reasons
  // that would have to stop holding together:
  //
  //   THIS SERVICE CANNOT NAME A "WHO". The request carries ids and a commune, and no principal.
  //   ADR 0025's one shared caller key proves a call came from inside the deployment and never
  //   WHICH service made it, so an entry written here would carry a system actor and an in-cluster
  //   address — an entry answering none of the six questions rule 6, invariant 2 asks. The service
  //   that OPENED THE RECORD holds the principal and the observed address, and that read is where
  //   the entry belongs, inside that service's own transaction. Same shape as AdvanceWorkingHours:
  //   the audited act is the caller's, not this hop.
  //
  //   IT RUNS AT THE RATE OF PAGE LOADS. One call per screen that shows who did something. An
  //   entry per call would add rows faster than the writes they exist to make traceable, and bury
  //   the entries that carry legal weight.
  //
  // THE ANSWER CHANGES THE DAY THIS MESSAGE CARRIES A FIELD THAT IS NOT NEEDED TO PRINT A LINE OF
  // HISTORY — a phone number, an email, a national id. Whoever adds one is opening a full-personal-
  // data read (rule 3, invariant 3) and owes it a permission key and an audit entry.
  //
  // # ONLY STAFF IDS BELONG HERE
  //
  // `audit_log.actor_kind` holds "staff", "citizen" or "system" (core/audit.Actor). ONLY the first
  // is a question this RPC can answer: a citizen is platform-wide and has no `nguoi_dung` row
  // (ADR 0002), and `system` is not a person at all — the caller renders it itself and does not
  // call. Sending either costs an absent item, which the caller then has to tell apart from a real
  // absence. FILTER ON `actor_kind` BEFORE CALLING.
  //
  // ⚠ THIS RPC TAKES THE INTERNAL id AND THE TRAIL NO LONGER HOLDS ONE. The block that stood here
  // recorded two readings of what `audit_log.actor_id` contains and said neither had been decided.
  // ONE OF THEM HAS BEEN, BY THE USER, ON 2026-09-22: THE TRAIL STORES THE BUSINESS CODE `ma`.
  // StaffPrincipal.ma carries it, the five write paths were changed to it, and
  // `.claude/hooks/audit_actor_guard.py` now enforces it. The reasoning that won is the one this
  // comment already recorded as ASSUMED: `nguoi_dung.ma`'s own comment calls it "staff code used in
  // the audit trail" (0001_init.sql:167), and question #15 keeps `ma` short and non-ULID precisely
  // so a person reading the trail a year later can look somebody up from it.
  //
  // SO THIS RPC, AS WRITTEN, CANNOT SERVE THE PURPOSE IT NAMES for any entry written from
  // 2026-09-22 onward: it is asked for an `actor_id` that is now a `ma`, matches `nguoi_dung.id`,
  // and answers an ABSENT ITEM — which the caller renders as a blank on an archival record, the
  // exact defect this RPC exists to close. IT HAS NO IMPLEMENTATION AND NO CONSUMER YET, which is
  // the only reason nothing is broken today.
  //
  // THE FIX IS A CONTRACT DECISION AND IS DELIBERATELY NOT TAKEN HERE — whether `ids` changes
  // meaning, or a second named lookup by `ma` is added beside it, is the contract owner's call and
  // both shapes have consequences for `StaffName.id`'s echo semantics. WHOEVER IMPLEMENTS THIS RPC
  // MUST SETTLE IT FIRST: implementing it as written produces a lookup that compiles, passes its
  // tests against fabricated internal ids, and resolves nothing against real data.
  //
  // # THE STATUS CODES ARE PART OF THE CONTRACT
  //
  //   OK                  zero or more items. FEWER THAN REQUESTED IS ORDINARY, never an error.
  //   INVALID_ARGUMENT    more than 200 ids in one call. Never a silent truncation, for the reason
  //                       BatchGetStaffRequest gives: there is no cursor to carry on from, so a
  //                       clamped batch renders real rows blank with nothing to report it.
  //   NOT_FOUND           NEVER produced. An id that resolves to nothing is an ABSENT ITEM.
  //   UNAUTHENTICATED     NEVER produced by this RPC — it belongs to the caller-key interceptor
  //                       (ADR 0025) and means the DEPLOYMENT is misconfigured.
  //   UNAVAILABLE etc.    the call did not happen, and IT IS NOT "no name". A caller that renders
  //                       an outage as a blank writes an absence onto an administrative record that
  //                       a person then reads as fact. Say the names could not be loaded, or fail
  //                       the page.
  rpc ResolveStaffNames(ResolveStaffNamesRequest) returns (ResolveStaffNamesResponse);

  // ResolveAssignableStaff answers ONE question about staff codes a caller is about to WRITE onto a
  // record as the holder of work: may this person be handed NEW work in this commune, today?
  //
  // WHY IT EXISTS (user decision 2026-09-25): `POST /api/v1/citizen-reports/{ma}/assignment` in
  // service-petitions stores an assignee's business code, and every later holder check compares
  // that code with a signed-in Principal.Ma. The assignee code arrives in the request body — it is
  // CLIENT-SUPPLIED — so the server must verify it before writing, or a crafted body hands a
  // citizen's petition to a code of another commune, a locked former employee, or a directory-only
  // person with no account, and the work then sits with nobody, forever. Tasks and documents will
  // need the same check for the same reason, which is why it is a contract and not a petitions
  // helper.
  //
  // NEITHER EXISTING RPC CAN ANSWER IT, and both were measured rather than assumed:
  //
  //   BatchGetStaff       keyed by the INTERNAL id, and its predicate is the register's (not
  //                       deleted) — a LOCKED or ACCOUNT-LESS person is answered as present
  //                       (service-identity/internal/store/can_bo_lo.go). Deciding assignment from
  //                       it would offer exactly the people this check exists to refuse.
  //   ResolveStaffNames   answers REMOVED records on purpose and forbids deciding anything from it.
  //
  // # THE PREDICATE — the whole of what "assignable" means, and it is the picker's
  //
  // A code is ASSIGNABLE when its `nguoi_dung` row, in the commune named by "x-tenant-id":
  //
  //   deleted_at IS NULL   a soft-deleted row is a duplicate kept for the trail (#10, rule 7 inv 2)
  //   co_tai_khoan         a directory-only person can never sign in, so can never be the
  //                        Principal.Ma a holder check compares with
  //   dang_hoat_dong       a locked account is somebody retired, moved or suspended (#10) — still
  //                        on old records, never a NEW assignee
  //
  // EXACTLY the predicate of GET /api/v1/staff-directory (locChonNguoi in
  // service-identity/internal/store/can_bo_chon_nguoi.go). THE TWO MUST NEVER DIVERGE: a code the
  // picker offers and this RPC refuses is a dropdown whose choice always fails, and a code this RPC
  // accepts and the picker hides is a body-crafted assignment the screen could never produce. Whoever
  // changes one changes both, in the same commit.
  //
  // # UNLIKE ResolveStaffNames, A CALLER MAY DECIDE FROM THIS
  //
  // That is its purpose: a code absent from the answer MUST be refused by the caller (fail closed),
  // and a code present in it may be written as an assignee. The answer is a point-in-time fact —
  // an account locked a millisecond after the call is not seen — and that window is accepted: the
  // lock itself is what stops the person acting, and the holder check runs again against a live
  // principal on every later act. It is NEVER cached across requests for the same reason
  // ResolveStaffPrincipal is not.
  //
  // # IT CARRIES NO PERSONAL DATA
  //
  // The request and the response hold staff business codes only — the same codes the caller sent,
  // or a subset of them. No name, no position, no contact detail, no internal id, no role. It is
  // therefore safe to reason about in a log line by COUNT; the codes themselves still identify a
  // person to anyone holding the directory, so log how many, not which.
  //
  // WHAT IS NOT HERE, ON PURPOSE: a reason per refused code. "Locked" vs "no account" vs "deleted"
  // vs "another commune" vs "does not exist" collapse into ONE answer — absent. Telling "another
  // commune" apart from "does not exist" would leak that a code exists in a commune the caller may
  // not read (rule 1); telling "locked" apart would publish an employment fact about a person to
  // every service that can call this. The caller's message to its user is one sentence: "cán bộ
  // này không nhận được việc".
  //
  // # A LOOKUP BY CODES THE CALLER ALREADY HOLDS — NEVER A LIST
  //
  // The request has exactly one field and it is a list of codes. An empty list answers empty, never
  // "every assignable person" — the picker is GET /api/v1/staff-directory, a staff-facing route
  // with its own permission, and a second path to the roster here would be one without it. The
  // response never carries a code that was not requested.
  //
  // # The commune travels in metadata, and this RPC is not a candidate for exemption
  //
  // "x-tenant-id" is what makes a code of another commune absent. Putting this method on
  // core/grpcx.methodsWithoutTenant would turn "belongs to the caller's commune" into "belongs to
  // some commune", which is the leak — a STOP CONDITION (ADR 0012, decision 1).
  //
  // # Reading this is NOT audited — the ASSIGNMENT is
  //
  // It is a read of codes, no personal data, and this service cannot name the "who" (ADR 0025's
  // one caller key names no service and no principal). The audited act is the caller's write of
  // the assignee, inside the caller's own transaction — the same shape as AdvanceWorkingHours.
  //
  // # THE STATUS CODES ARE PART OF THE CONTRACT
  //
  //   OK                  zero or more codes. FEWER THAN REQUESTED IS ORDINARY — it is the answer
  //                       "not assignable", and it is the whole point.
  //   INVALID_ARGUMENT    more than 50 codes in one call. Never a silent truncation: a clamped batch
  //                       would silently turn real, assignable codes into "not assignable".
  //   NOT_FOUND           NEVER produced. A code that is not assignable is an ABSENT code.
  //   UNAUTHENTICATED     NEVER produced by this RPC — it belongs to the caller-key interceptor
  //                       (ADR 0025) and means the DEPLOYMENT is misconfigured.
  //   UNAVAILABLE etc.    the call did not happen. It is NOT "not assignable" and NOT "assignable":
  //                       the caller must refuse the write with a retryable error (503), never
  //                       fall back to writing the code unchecked.
  //
  // RETRYING IS SAFE: it writes nothing, publishes nothing, and leaves no audit entry.
  rpc ResolveAssignableStaff(ResolveAssignableStaffRequest) returns (ResolveAssignableStaffResponse);

  // ResolveLiveOrgUnits answers ONE question about org-unit ids a caller is about to WRITE onto a
  // record as the unit holding work: is this a live `bo_phan` of the commune named by "x-tenant-id"?
  //
  // WHY IT EXISTS (user decision 2026-09-28). service-petitions stores identity's `bo_phan.id` on a
  // task (`bo_phan_id`, `co_quan_chu_tri_id`) and on a petition assignment, and the id arrives in the
  // request BODY — client-supplied. Until this RPC nothing could verify it: domain.KiemPhanCong only
  // trims and bounds it, and task_assignment.go says so in its header. A crafted body could hand work
  // to a unit of ANOTHER commune, to a unit removed from the org chart, or to an id that names
  // nothing — and the work then sits with no unit, forever, on a list nobody opens. This is the unit
  // half of the check ResolveAssignableStaff makes for people, and it has the same shape on purpose.
  //
  // # THE PREDICATE — the whole of what "live" means
  //
  // An id is LIVE when a `bo_phan` row with that id exists in the commune named by "x-tenant-id" and
  // its `deleted_at IS NULL`. That is EXACTLY the predicate of GET /api/v1/org-units (the org chart
  // the assignment box is filled from, store.truyVanBoPhanKemSoCanBo). THE TWO MUST NEVER DIVERGE: a
  // unit the box offers and this RPC refuses is a choice that always fails, and a unit this RPC
  // accepts and the box hides is an assignment only a crafted body can make. Whoever changes one
  // changes both, in the same commit.
  //
  // `bo_phan` has no "inactive" state today — only soft deletion (migration 0001). A later
  // "tạm ngưng" column is a change to this predicate AND to the org chart's, together.
  //
  // # ONE ANSWER FOR EVERY REFUSAL — absent
  //
  // Unknown, soft-deleted and ANOTHER COMMUNE'S id are indistinguishable in the response. Telling
  // "another commune" apart from "unknown" would leak that the id exists in a commune the caller may
  // not read (rule 1). The caller's sentence to its user is one: "bộ phận này không nhận được việc".
  //
  // # A LOOKUP BY IDS THE CALLER ALREADY HOLDS — NEVER A LIST
  //
  // An empty request answers empty, never "every live unit": the org chart is GET /api/v1/org-units,
  // a staff-facing route, and a second path to it here is not wanted. The response never carries an
  // id that was not requested.
  //
  // # UNLIKE ResolveStaffNames, A CALLER DECIDES FROM THIS
  //
  // Absent MUST be refused by the caller (fail closed); present may be written. A point-in-time
  // answer — a unit removed a millisecond later is not seen — and that window is accepted for the
  // reason ResolveAssignableStaff states. NEVER cached across requests.
  //
  // # No personal data; the commune travels in metadata; not audited
  //
  // Ids in, ids out. "x-tenant-id" is what makes another commune's id absent, so this method is not a
  // candidate for core/grpcx.methodsWithoutTenant (ADR 0012, decision 1). The audited act is the
  // caller's WRITE of the unit, inside the caller's own transaction.
  //
  // # THE STATUS CODES ARE PART OF THE CONTRACT
  //
  //   OK                  zero or more ids. FEWER THAN REQUESTED IS ORDINARY — it is "not live".
  //   INVALID_ARGUMENT    more than 50 ids in one call. Never a silent truncation.
  //   NOT_FOUND           NEVER produced. A unit that is not live is an ABSENT id.
  //   UNAUTHENTICATED     NEVER produced by this RPC — it belongs to the caller-key interceptor.
  //   UNAVAILABLE etc.    the call did not happen. Refuse the write with a retryable error (503);
  //                       never fall back to writing the id unchecked.
  //
  // RETRYING IS SAFE: it writes nothing, publishes nothing, and leaves no audit entry.
  rpc ResolveLiveOrgUnits(ResolveLiveOrgUnitsRequest) returns (ResolveLiveOrgUnitsResponse);

  // ResolveStaffOrgUnits answers which live org unit(s) ONE member of staff sits in, in the commune
  // named by "x-tenant-id" — keyed by the staff BUSINESS CODE.
  //
  // WHY IT EXISTS (user decision 2026-09-28): the task register's "Liên quan đến tôi" tab
  // (`scope=related`) includes tasks held by "bộ phận tôi đang giữ", and the petitions service has no
  // way to learn the signed-in person's unit. It refuses that tab today, citing this contract.
  //
  // # WHY A SEPARATE RPC AND NOT A FIELD ON StaffPrincipal — the decision this RPC records
  //
  // The obvious shape is `StaffPrincipal.org_unit_ids`: one hop fewer. It is REJECTED, for reasons
  // the omission list on StaffPrincipal already states and that still hold:
  //
  //   COST ON THE HOTTEST PATH. ResolveStaffPrincipal runs on EVERY staff request of four services.
  //   A unit on it is a join paid on every one of those requests, to serve ONE filter tab of ONE
  //   screen. Here the hop is paid only by a request that asked for `scope=related`.
  //
  //   A PRINCIPAL IS AUTHORISATION STATE, AND A UNIT ON IT GETS DECIDED FROM. StaffPrincipal is what
  //   every guard works on. A unit there is one edit away from a guard that grants "same unit may
  //   edit" in a calling service — authorisation decided outside the service that owns the grants
  //   (rule 5). This RPC's answer narrows a LIST; it grants nothing, and the caller must never use it
  //   in a guard.
  //
  //   `bo_phan` IS ON THE OMISSION LIST BY NAME. StaffName refuses it because TODAY'S unit is not the
  //   unit a person held when they acted. That argument does not bite here — "Liên quan đến tôi" asks
  //   precisely about TODAY — but it is why the answer lives on a shape named for today's question,
  //   not on a message that travels with every request and could be copied onto a record.
  //
  // WHAT THE REJECTED SHAPE WOULD HAVE BOUGHT, STATED: one fewer hop on `scope=related`. That is the
  // whole of it.
  //
  // # Keyed by the business code, and singular
  //
  // The caller holds authz.Principal.Ma for the signed-in person — the value every holder check
  // compares with — so that is the key, not the internal id. NOT BATCHED, for the reason
  // ResolveStaffPrincipal is not: the caller is one HTTP request asking about one person, and there
  // is no list from which a second code could arrive.
  //
  // IT DOES NOT CHECK THAT THE CODE IS THE CALLER. Identity cannot see the end user across this hop
  // (ADR 0025: the caller key names no service and no principal). The caller passes its OWN
  // principal's code, from the session, never from the request (rule 4, invariant 2 in its staff
  // form). The answer is not sensitive either way: GET /api/v1/staff-directory already shows every
  // account of the commune each person's `department_id`.
  //
  // # THE PREDICATE
  //
  // The `nguoi_dung` row with that `ma` in this commune, `deleted_at IS NULL`, joined to its
  // `bo_phan` row in the SAME commune with `deleted_at IS NULL`. A unit removed from the org chart is
  // not answered: the unit a person "holds" is one that can still hold work, and ResolveLiveOrgUnits
  // refuses a removed unit on every write.
  //
  // # EMPTY IS ONE ANSWER FOR FOUR CASES
  //
  // Unknown code, soft-deleted record, a record with NO unit (`bo_phan_id` is nullable), and a unit
  // that was removed: all answer an empty list. For the caller every one of them means the same
  // thing — the "bộ phận tôi đang giữ" clause matches nothing — and telling them apart would publish
  // facts about a person to every service that can call this.
  //
  // # THE STATUS CODES ARE PART OF THE CONTRACT
  //
  //   OK                  zero or one unit today — see ResolveStaffOrgUnitsResponse.
  //   INVALID_ARGUMENT    `ma` empty. The caller has a staff principal whose code is never empty
  //                       (rule 6, invariant 8), so this is a wiring fault and is answered loudly.
  //   NOT_FOUND           NEVER produced. An unknown code answers empty.
  //   UNAUTHENTICATED     NEVER produced by this RPC — it belongs to the caller-key interceptor.
  //   UNAVAILABLE etc.    the call did not happen. It is NOT "no unit": answering the tab with the
  //                       unit clause dropped hides the very tasks the tab is named for, and a short
  //                       list reports nothing. Answer 503.
  //
  // RETRYING IS SAFE: it writes nothing, publishes nothing, and leaves no audit entry. NEVER cached
  // across requests: a person moved to another unit must see the new unit's work on the next load.
  rpc ResolveStaffOrgUnits(ResolveStaffOrgUnitsRequest) returns (ResolveStaffOrgUnitsResponse);

  // ResolveOrgUnitNames turns the org-unit ids an ALREADY-STORED RECORD carries into the names a
  // person can read — INCLUDING ids whose `bo_phan` row has since been removed from the org chart.
  //
  // WHY IT EXISTS (2026-09-28): service-petitions prints the task register ("Sổ theo dõi",
  // docs/ui-ux/02-nhiem-vu.md §4.3) as .xlsx on the server. Two of its columns — "Cơ quan chủ trì
  // tham mưu" and "Đơn vị thực hiện" — are units, and the task stores identity's `bo_phan.id`
  // (`co_quan_chu_tri_id`, `bo_phan_id`) AS A VALUE. Nothing outside this service can turn that id
  // into a name without opening this schema (rule 2, forbidden #2).
  //
  // # IT MIRRORS ResolveStaffNames, AND FOR THE SAME REASON IT ANSWERS REMOVED UNITS
  //
  // The register is an ARCHIVAL printout. A task filed in 2026 against a unit removed from the org
  // chart in 2027 still holds that unit's id, and the printout must say what the record holds — a
  // blank "Đơn vị thực hiện" on a printed register is an unattributed line on an administrative
  // record. So a soft-deleted unit is ANSWERED, carrying its name and RECORD_STANDING_REMOVED. That
  // single difference is why this is not ResolveLiveOrgUnits with a name added: that RPC is the one
  // a caller DECIDES from, and widening it to removed units would let a write hand work to a unit
  // that no longer exists.
  //
  // # IT RESOLVES A NAME. IT DECIDES NOTHING
  //
  // Never read "this id resolved" as "this unit is live" or "this unit can hold work": it may have
  // resolved PRECISELY BECAUSE the unit was removed. "Live" is ResolveLiveOrgUnits' question.
  //
  // # THE NAME IS TODAY'S NAME OF THAT UNIT — stated, not hidden
  //
  // `bo_phan.ten` can be edited. The record holds the unit's id, not the name it had when the task
  // was filed, so a renamed unit prints under its current name. That is what the data supports: a
  // historical name is a fact the RECORD would have to carry, and no lookup can reconstruct it.
  //
  // # A LOOKUP BY IDS THE CALLER ALREADY HOLDS — NEVER A LIST
  //
  // The four properties ResolveStaffNames states hold here verbatim: one request field and it is a
  // list of ids; an empty list answers empty, never "every unit"; the response never carries an id
  // that was not requested; the answer is cut by "x-tenant-id". An id of another commune is ABSENT,
  // indistinguishable from an id that names nothing (rule 1). Not a candidate for
  // core/grpcx.methodsWithoutTenant (ADR 0012, decision 1).
  //
  // # No personal data; not audited
  //
  // A unit's name is an org-chart fact, not personal data. The read is not audited for the reason
  // ResolveStaffNames gives (ADR 0025's caller key names no "who"); the export the caller builds
  // is the caller's act.
  //
  // # THE STATUS CODES ARE PART OF THE CONTRACT
  //
  //   OK                  zero or more items. FEWER THAN REQUESTED IS ORDINARY, never an error.
  //   INVALID_ARGUMENT    more than 200 ids in one call. Never a silent truncation.
  //   NOT_FOUND           NEVER produced. An id that resolves to nothing is an ABSENT ITEM.
  //   UNAUTHENTICATED     NEVER produced by this RPC — it belongs to the caller-key interceptor.
  //   UNAVAILABLE etc.    the call did not happen, and IT IS NOT "no name". A printout rendering an
  //                       outage as blanks writes an absence onto an archival record. Fail the export.
  //
  // RETRYING IS SAFE: it writes nothing, publishes nothing, and leaves no audit entry.
  rpc ResolveOrgUnitNames(ResolveOrgUnitNamesRequest) returns (ResolveOrgUnitNamesResponse);

  // ResolveTaskBlocLabels turns the task-bloc codes an ALREADY-STORED RECORD carries
  // (`khoi_nhiem_vu.ma`, `khoi-uy-ban`) into the labels a person can read (`Khối Uỷ ban`) —
  // INCLUDING codes whose catalogue row has since been removed.
  //
  // WHY IT EXISTS (2026-09-28): the task register printout (docs/ui-ux/02-nhiem-vu.md §4.3 :121)
  // prints the bloc label under each task's title. `khoi_nhiem_vu` is identity's (ADR 0024, and
  // ADR 0024:130 forbids moving it), and the task holds the code AS A VALUE with no foreign key
  // (service-petitions/migrations/0006_nhiem_vu.sql:215).
  //
  // # SAME SHAPE AND SAME DISCIPLINE AS ResolveOrgUnitNames
  //
  // Removed codes are ANSWERED, flagged RECORD_STANDING_REMOVED, because the printout must show
  // what the record holds. `(tenant_id, ma)` is UNIQUE across removed rows too (migration 0005:335),
  // so one code names at most one row and the label is never ambiguous. A catalogue row that is
  // merely switched off (`dang_dung = false`) is LIVE: standing reads `deleted_at` and nothing else.
  //
  // THE LABEL IS TODAY'S LABEL of that code — `nhan` is editable, and the record holds only the
  // code. Stated for the reason ResolveOrgUnitNames states it.
  //
  // IT RESOLVES A LABEL. IT DECIDES NOTHING: a caller validating a bloc code before WRITING it reads
  // GET /api/v1/task-blocs' predicate, not this one, which answers removed codes on purpose.
  //
  // A lookup by codes the caller already holds, never a list; an empty list answers empty; the
  // response never carries a code that was not requested; another commune's code is ABSENT. No
  // personal data; not audited; not exempt from "x-tenant-id".
  //
  // # THE STATUS CODES ARE PART OF THE CONTRACT
  //
  //   OK                  zero or more items. FEWER THAN REQUESTED IS ORDINARY.
  //   INVALID_ARGUMENT    more than 200 codes in one call. Never a silent truncation.
  //   NOT_FOUND           NEVER produced. An unknown code is an ABSENT ITEM.
  //   UNAUTHENTICATED     NEVER produced by this RPC — it belongs to the caller-key interceptor.
  //   UNAVAILABLE etc.    the call did not happen, and it is NOT "no label". Fail the export.
  //
  // RETRYING IS SAFE: it writes nothing, publishes nothing, and leaves no audit entry.
  rpc ResolveTaskBlocLabels(ResolveTaskBlocLabelsRequest) returns (ResolveTaskBlocLabelsResponse);

  // ResolveLiveOrgUnitCodes turns org-unit BUSINESS CODES (`bo_phan.ma`, the slug
  // `van-phong-dang-uy`) into the id of the LIVE unit carrying that code, in the commune named by
  // "x-tenant-id".
  //
  // WHY IT EXISTS (2026-09-28): the task Excel import. A clerk types a unit's CODE into a
  // spreadsheet — an id is a ULID nobody can type — and the task stores the unit's `bo_phan.id`. The
  // import must translate one into the other, and the translation is this service's: `bo_phan` is
  // identity's table (rule 2, forbidden #2).
  //
  // # THE PREDICATE IS ResolveLiveOrgUnits', AND A CALLER DECIDES FROM THIS
  //
  // A code is answered when a `bo_phan` row of this commune carries it and `deleted_at IS NULL` —
  // EXACTLY the "live" predicate of ResolveLiveOrgUnits and of GET /api/v1/org-units (store constant
  // liveOrgUnit). THE THREE MUST NEVER DIVERGE: an id this RPC returns that ResolveLiveOrgUnits would
  // refuse is an import row that writes a unit an ordinary assignment could not. The returned id may
  // be written as the task's unit without asking ResolveLiveOrgUnits again (same point-in-time
  // window, accepted for the reason ResolveAssignableStaff states). An ABSENT code MUST be refused by
  // the caller — the import row is rejected with one sentence, never written with a blank unit and
  // never matched by name instead.
  //
  // `(tenant_id, ma)` is UNIQUE (migration 0001:86), across removed rows too, so one code maps to at
  // most one unit. A removed unit's code is therefore never re-issued to a new unit and cannot
  // silently re-point an old spreadsheet at a different unit.
  //
  // # ONE ANSWER FOR EVERY REFUSAL — absent
  //
  // Unknown, soft-deleted and another commune's code are indistinguishable (rule 1). THE CODES ARE
  // GUESSABLE SLUGS, unlike a ULID, and that is stated rather than denied: whoever can call this can
  // learn that "van-phong-dang-uy" is a live unit of THIS commune — which GET /api/v1/org-units
  // already shows every signed-in account of it. What the commune cut prevents is learning anything
  // about ANOTHER commune's org chart, and that is the property that matters (rule 1).
  //
  // # A LOOKUP BY CODES THE CALLER ALREADY HOLDS — NEVER A LIST
  //
  // One request field, a list of codes. An empty list answers empty, never "every live unit". The
  // response never carries a code that was not requested. No personal data; not audited (the audited
  // act is the import's write of the task); not exempt from "x-tenant-id".
  //
  // # THE STATUS CODES ARE PART OF THE CONTRACT
  //
  //   OK                  zero or more items. FEWER THAN REQUESTED IS ORDINARY — it is "no live unit
  //                       carries this code".
  //   INVALID_ARGUMENT    more than 200 codes in one call. Never a silent truncation: a clamped batch
  //                       would reject real import rows as "unknown unit". 200, not
  //                       ResolveLiveOrgUnits' 50, because an import is many assignments at once and
  //                       its distinct unit codes are bounded by the org chart, not by one form.
  //   NOT_FOUND           NEVER produced. An unknown code is an ABSENT ITEM.
  //   UNAUTHENTICATED     NEVER produced by this RPC — it belongs to the caller-key interceptor.
  //   UNAVAILABLE etc.    the call did not happen. It is NOT "unknown unit": fail the import with a
  //                       retryable error, never reject rows as unknown and never write them unchecked.
  //
  // RETRYING IS SAFE: it writes nothing, publishes nothing, and leaves no audit entry.
  rpc ResolveLiveOrgUnitCodes(ResolveLiveOrgUnitCodesRequest) returns (ResolveLiveOrgUnitCodesResponse);

  rpc ListCitizenCommunes(ListCitizenCommunesRequest) returns (ListCitizenCommunesResponse);

  // AdvanceWorkingHours moves an instant forward through ONE commune's working calendar and
  // answers with the instant at which that many WORKING hours have elapsed.
  //
  // WHAT IT IS: arithmetic over data this service owns, and nothing more. The caller supplies
  // both of the things ADR 0007 decides — WHERE the count starts and HOW MANY hours it runs —
  // so this RPC never decides what a deadline means. identity supplies the one thing the caller
  // cannot have without opening another service's database (rule 2, forbidden #2): the
  // commune's own week, its holidays and its swap days.
  //
  // WHY IT IS NOT CALLED ComputeDeadline. "Deadline" is the CALLER's word for what it does with
  // the answer, and ADR 0017 names a contract after what the data IS rather than after what the
  // reader calls it. THIS RPC STILL DOES NOT KNOW WHAT A DEADLINE IS: the caller supplies the
  // number of hours, so what comes back is an instant this commune is open until, and whether
  // that instant is a commitment to anybody is not a fact this call holds. (The verb is
  // temporal, not CRUD: this RPC creates no `lich_lam_viec` row and writes nothing at all.)
  //
  // ⚠ THE SECOND HALF OF THAT ARGUMENT WAS TRUE AND IS NOW FALSE, AND IT IS CORRECTED RATHER
  // THAN DELETED. Until 2026-09-20 this paragraph read "an RPC called ComputeDeadline in identity
  // reads as identity owning the SLA, WHICH IT DOES NOT AND MUST NOT". ADR 0029 decided the
  // opposite: the `sla` table is in this service, because it is read by two services and belongs
  // to neither. So the boundary argument no longer holds — what keeps this name right is only the
  // first half, that this RPC reads no `sla` row. The RPC that does is ResolveDeadlines below,
  // and it is a SEPARATE RPC rather than a flag on this one; ADR 0029 §118 calls this one a
  // precedent for the SHAPE and not a place to add fields, and the reason is in ResolveDeadlines'
  // own comment.
  //
  // # It returns the ANSWER, not the CALENDAR — the expensive decision of this contract
  //
  // The rejected shape is `GetWorkingCalendar`: hand the caller the sessions, the holidays and
  // the swap days and let it count. It buys two real things — the counting rule stays in the
  // service that owns the SLA, and one fetch serves many deadlines — and it was rejected for
  // three things it cannot buy:
  //
  //   THE CALLER CANNOT KNOW WHAT TO FETCH. ADR 0007's largest configured value is 168 working
  //   hours, about four working weeks, and how far in real time that runs DEPENDS ON THE
  //   HOLIDAYS INSIDE IT — which is the thing being fetched. So the caller must name a date
  //   range up front, and a caller that names too short a range counts straight through a
  //   holiday it never asked for. No contract can make "I fetched enough" checkable, and the
  //   failure mode is a deadline that is too early, told to a citizen, with nothing red.
  //
  //   THE REFUSALS BECOME ONE COPY PER CONSUMER. An empty calendar, a date in both the holiday
  //   and the swap list, and two overlapping sessions are all faults the DATABASE deliberately
  //   does not enforce — 0006_lich_lam_viec.sql says so, three times, in its own words. Under
  //   `GetWorkingCalendar` every consumer has to implement all three refusals, and a consumer
  //   that implements none of them still compiles, still passes its tests, and still answers.
  //
  //   THREE IMPLEMENTATIONS OF THE HARD PART. ADR 0007 §Hệ quả names the hard cases itself:
  //   holidays, the lunch gap, a receipt outside working hours, a file spanning several weeks.
  //   `petitions` and `documents` both need this today — ADR 0007's SLA table counts `Văn bản
  //   đến` as well as `Phản ánh` — and `finance` is the obvious third. Three counting
  //   functions are three places for one off-by-one, on the one figure in
  //   this system that is a public authority's commitment.
  //
  // WHAT THE REJECTED SHAPE BOUGHT IS NOT ALL LOST. The "many deadlines from one fetch" half is
  // bought back by making THIS request plural (see `working_hours`): one intake computes both
  // the `Tiếp nhận` and the `Xử lý xong` deadline of ADR 0007's table, from one instant, in one
  // hop, against one read of one calendar. The half genuinely given up is that identity now
  // runs the arithmetic — and the first paragraph says exactly what that does and does not
  // include.
  //
  // # One hop per RECEIVED RECORD, and there is no cache
  //
  // COUNT THE HOPS HONESTLY: one per intake — one petition received, one incoming document
  // registered — not one per request and not one per row. Rule 10, invariant 2 is what makes
  // that true: the deadline is computed ONCE, at intake, and stored, so every later read of
  // that record reads a stored TIMESTAMPTZ and calls nothing here. That is a different cost
  // shape from ResolveStaffPrincipal above, which pays a hop on every staff request of four
  // services.
  //
  // SO THERE IS NOTHING HOT TO CACHE, and a cache here would be actively WRONG rather than
  // merely unnecessary. ADR 0007, decision 6 fixes that a configuration change is NOT
  // retroactive: it applies to records received AFTER it. A cached calendar inverts exactly
  // that — a record received after the commune corrected its holidays gets a deadline computed
  // from the calendar as it was before, on whichever process still held the stale copy. It is
  // the failure service-identity/internal/store/phien_cong_dan.go refused a cache over (ADR
  // 0010 leaves no shared cache, identity runs several replicas, and no channel reaches the
  // copy another replica holds) — landing this time not on a session but on a commitment told
  // to a citizen and reported upward.
  //
  // # The commune travels in metadata, and this RPC is not a candidate for exemption
  //
  // ONE CALL, ONE COMMUNE. "x-tenant-id" names whose calendar is read, and there is deliberately
  // no field in the request that could name a second one. The caller always holds it: an intake
  // runs behind an edge that has already resolved the commune from Host. Putting this method in
  // core/grpcx.methodsWithoutTenant would mean reading a commune's configuration without naming
  // a commune — not a shape this RPC can have — and adding any name to that list is a stop
  // condition in its own right (ADR 0012, decision 1).
  //
  // # Configuration faults the database cannot catch, and this RPC refuses rather than guesses
  //
  // Each of these is named in 0006_lich_lam_viec.sql together with the reason the schema does
  // not enforce it. They all arrive here, and they all have exactly one answer:
  // FAILED_PRECONDITION — a state a human must fix, never a result.
  //
  //   NO SESSIONS AT ALL. A commune with no `lich_lam_viec` row has no working hours, so a count
  //   in working hours never arrives. THE REFUSAL IS THE ANSWER. "Mon–Fri 08:00–17:00" is not a
  //   fallback, it is a commitment invented by software and told to a citizen on a false basis
  //   (rule 10, and the fail-closed principle CLAUDE.md opens with). An empty calendar is also
  //   the ordinary state of a commune today: nothing is seeded, and the onboarding step that
  //   would sow the first rows does not exist yet.
  //
  //   A DATE IN BOTH `ngay_nghi_le` AND `ngay_lam_bu` — closed and open on the same date. There
  //   is deliberately NO precedence rule: a silent winner makes one of two rows a person can see
  //   on the configuration screen do nothing, and nobody ever finds out which. Refused when the
  //   count CROSSES that date; a conflict on a date the count never reaches cannot change this
  //   answer and belongs to the write path.
  //
  //   TWO SESSIONS THAT OVERLAP on one weekday, or on one swap day. The database stops two
  //   sessions STARTING at the same minute and no more — the stronger EXCLUDE constraint needs
  //   `btree_gist`, and 0006 would not put the service's startup behind an extension nobody has
  //   confirmed is present. Overlapping sessions double-count their overlap, which makes the
  //   deadline EARLIER than the commune's real hours: the direction that reports an authority
  //   late when it was not. It stays refused here even after the write path rejects it — a read
  //   path that assumes a guarantee nothing enforces answers confidently and wrongly.
  //
  //   AN ANSWER BEYOND THE HORIZON, 366 days after `count_from`. See `reached_at`: this is the
  //   same family of fault, because past the horizon the holidays are not in the table yet.
  //
  // A FIFTH CASE IS REFUSED ON THE SAME PRINCIPLE AND IS NOT SETTLED: a `ngay_lam_bu` row on a
  // date whose weekday ALREADY has `lich_lam_viec` sessions. Two readings exist — the swap day
  // REPLACES that day's hours, or it ADDS to them — and they differ by exactly the overlap.
  // Nothing in ADR 0007 or in 0006 decides between them, so neither may be guessed: refused.
  // Whoever needs a one-off extra session on an ordinary working day asks the user for the rule
  // first; loosening a refusal later is additive, un-inventing a wrong deadline is not.
  //
  // THE STATUS CODES ARE PART OF THE CONTRACT:
  //
  //   OK                  every requested amount answered. There is no partial success — see
  //                       AdvanceWorkingHoursResponse.
  //   INVALID_ARGUMENT    the CALLER is wrong: no `count_from`, an empty `working_hours`, a
  //                       zero, a value over the ceiling, or more entries than allowed.
  //   FAILED_PRECONDITION the COMMUNE'S CONFIGURATION is wrong or missing — the cases above.
  //                       The distinction from INVALID_ARGUMENT is not cosmetic: it is the
  //                       difference between "fix the calling service" and "open the
  //                       configuration screen", and an operator sent to the wrong one of those
  //                       reads a calendar that is fine for an afternoon.
  //   NOT_FOUND           NEVER produced. Nothing here is looked up by id.
  //   UNAUTHENTICATED     NEVER produced by this RPC, for the reason the table on
  //                       ResolveStaffPrincipal gives: that code belongs to the caller-key
  //                       interceptor and means the DEPLOYMENT is misconfigured.
  //   UNAVAILABLE etc.    the call did not happen, and it is NOT "no deadline". A caller that
  //                       treats an outage as an answer stores an administrative record with no
  //                       commitment attached to it. Fail the intake instead.
  //
  // # The one obligation on the caller, and it is the easy one to break
  //
  // CALL IT ONCE, AT INTAKE, AND STORE WHAT IT RETURNS. The answer is a pure function of the
  // arguments AND of the calendar as it stands at the instant of the call — so the same call
  // made next month can legitimately answer differently, because the commune entered a holiday.
  // Calling it again to "re-derive" a deadline that is already stored silently moves a
  // commitment already made to a citizen: rule 10, invariant 2 and ADR 0007, decision 6 both
  // forbid it, and neither is something this contract can enforce.
  //
  // RETRYING A FAILED CALL IS SAFE AND EXPECTED: this RPC writes nothing, publishes nothing, and
  // leaves no audit entry. The audited act is the INTAKE, written by the caller inside its own
  // transaction (rule 6, invariant 3) — this hop is a read of configuration, not a business act.
  //
  // OVERDUE IS STILL DERIVED. This returns the deadline, never a state: rule 10, invariant 3
  // forbids a column or a field that says "late".
  //
  // # What this contract deliberately does NOT answer, and what is therefore blocked
  //
  // ADR 0007 §"Lỗ hổng đặc tả" left five questions open, and 0006_lich_lam_viec.sql shows
  // where each one lands. FOUR OF THEM ARE ROWS — office hours, the lunch gap, Saturday, local
  // holidays — so no shape here depends on their answers, and every answer stays expressible.
  // THE FIFTH WAS NOT A ROW, AND IT IS NOW DECIDED:
  //
  //   `count_from` FALLING OUTSIDE EVERY WORKING SESSION — a report submitted at 22:00, on a
  //   Sunday, during Tết. ADR 0007 DECISION 8 (2026-09-20, user): count from the START OF THE
  //   NEXT WORKING SESSION. The shape above did not change, because one rule serves every caller.
  //
  //   THE SERVER SIDE EXISTS: service-identity/internal/domain/tien_gio_lam_viec.go. Decision 8
  //   is the SHAPE OF THE LOOP there, not a branch — each session contributes only the part at
  //   or after `count_from` — so a 22:00 Friday receipt and a 07:30 Monday receipt come out with
  //   the same instant, and no code has to define "outside" at 11:30 exactly. Do not
  //   re-implement it in a caller: rule 10 forbidden #2 and citizen_commitment_guard block a
  //   deadline built by adding a duration anywhere but identity. If the answer ever turns out to
  //   differ per commune or per kind of record, THAT is the single thing that would add a field
  //   here, and it would be additive.
  //
  // # Times on this boundary are INSTANTS; the calendar is wall clock; they meet in one place
  //
  // `count_from` and `reached_at` are google.protobuf.Timestamp — absolute instants, with no
  // zone and no offset to get wrong. The calendar they are counted against is the opposite kind
  // of thing: `lich_lam_viec.bat_dau` is a `TIME` with no zone, because "07:30" is an
  // instruction to a commune's staff and not a moment in history (0006 argues this at length).
  //
  // THE TWO MEET IN EXACTLY ONE PLACE — inside this server, which combines a wall-clock time
  // with a date IN Asia/Ho_Chi_Minh. That zone is a property of the commune, not of the process:
  // a server running with TZ=UTC must produce the same answer, so the implementation names the
  // zone and never reads the host's. Two consequences follow from the shape and are the reason
  // for it: NO CONSUMER EVER ATTACHES AN OFFSET, and NO WEEKDAY EVER CROSSES THIS BOUNDARY —
  // `thu` is ISO 8601 where it is stored and where it is read (0006 owns that fact), and a
  // weekday conversion is where an off-by-one lives for a year before anybody notices the
  // deadline is a day out.
  rpc AdvanceWorkingHours(AdvanceWorkingHoursRequest) returns (AdvanceWorkingHoursResponse);

  // MeasureWorkingHours answers, for ONE commune and for each span of two instants the caller
  // holds, how much WORKING time of that commune lies between them — the inverse question of
  // AdvanceWorkingHours.
  //
  // WHY IT EXISTS (user decision 2026-10-02): "Quá hạn" stays derived (rule 10, invariant 3), but
  // HOW LATE a record is — the working time from its stored deadline to `now` — must be counted the
  // way its deadline was counted. Every caller outside this service has only wall-clock arithmetic
  // within reach, and `now - deadline` counts nights, weekends, `ngay_nghi_le` and `ngay_lam_bu` as
  // lateness: the direction that reports an authority later than it was. This RPC gives every
  // service the same count identity uses for deadlines, so no second count is ever written (ADR 0007;
  // rule 10, forbidden #2). No screen prints the figure yet; the contract exists so the first one to
  // do so has nothing to invent.
  //
  // # WHAT IS MEASURED — one rule, and every edge case falls out of it
  //
  //   working_seconds = the total length of [start, end) ∩ this commune's working sessions
  //
  // where "working sessions" is exactly the set AdvanceWorkingHours walks: the ordinary week of
  // `lich_lam_viec`, minus every `ngay_nghi_le`, plus every `ngay_lam_bu`, each wall-clock session
  // made an instant in Asia/Ho_Chi_Minh inside this server (see "Times on this boundary" above).
  //
  //   An endpoint OUTSIDE working time contributes nothing, and is not "snapped" anywhere. ADR 0007
  //   decision 8 is therefore satisfied by the shape, not by a branch: a span starting Friday 22:00
  //   measures the same as one starting Monday 07:30, exactly as the two deadlines are equal.
  //   An endpoint INSIDE a session counts from / up to that instant.
  //   start == end measures 0, and is OK.
  //   end BEFORE start is INVALID_ARGUMENT, never a negative number and never a silent 0. A signed
  //   answer invites "remaining = -elapsed" arithmetic on the caller's side; a 0 reads as "not late"
  //   and hides a caller that swapped its two instants. Remaining working time is a span too: send
  //   (now, deadline).
  //
  // # THE INVERSE PROPERTY, and the one direction in which it does NOT hold
  //
  //   for every h:  measure(t, AdvanceWorkingHours(t, h)) == h × 3600 seconds
  //
  // against the same calendar. The other direction does not hold, by design: measure is FLAT across
  // every closed stretch, so many instants measure the same h, and AdvanceWorkingHours returns the
  // EARLIEST of them (its `reached_at` comment). A caller must never "recover" a deadline by
  // advancing a measured figure.
  //
  // THE SAME CALENDAR IS PART OF THAT PROPERTY. ADR 0007 decision 6: a calendar change is not
  // retroactive for a STORED deadline. This RPC measures with the calendar AS IT STANDS AT THE CALL,
  // so a holiday entered after a record was received changes how late it now measures, never its
  // deadline. That is the right split — the deadline is a commitment, the lateness is a reading —
  // and it is why lateness is measured FROM THE STORED DEADLINE, never re-derived from the receipt
  // instant and the `sla` row.
  //
  // # WHY A LENGTH MAY LEAVE THIS SERVICE WHEN AN `sla` NUMBER MAY NOT
  //
  // ADR 0029 §Bổ sung keeps `sla` hours inside identity because a caller holding "72 working hours"
  // must turn it into an instant, and only wall-clock arithmetic is within its reach. A MEASURED
  // length is the opposite direction: both instants are already the caller's, the answer is a
  // reading for display or a report, and there is nothing it needs to be turned into. THE ONE
  // MISUSE IS ADDING IT TO AN INSTANT — `deadline + working_seconds`, `now + …` — which walks
  // straight through the closed time this RPC exists to exclude. That is rule 10, forbidden #2, and
  // the warning on `Deadline` applies to this figure word for word.
  //
  // WHAT IT DOES NOT DECIDE. Whether a record closed "on time" is a comparison of two INSTANTS
  // (closed_at vs the stored deadline), not a measurement, and the owner's open question on how
  // "đúng hạn" is counted (vigov-require reconciliation 2026-10-02) is not answered here. Nor does
  // this RPC know what a deadline is: it measures any two instants.
  //
  // # BATCHED, because the caller is a LIST
  //
  // The consumer is the overdue queue: one page, N late records, each measured from its own deadline
  // to the SAME `now`. One call per row is N hops and N reads of a calendar that could change
  // between them — two rows of one page measured against two calendars. One call per page is one hop
  // and one calendar read (skills/load-data-once; ADR 0012's batching default, which here applies in
  // full). Spans are general pairs rather than "N starts, one end", so a report measuring
  // receipt → closure per record uses the same RPC.
  //
  // # BOUNDS, and why they are INVALID_ARGUMENT rather than FAILED_PRECONDITION
  //
  //   1 TO 500 SPANS per call — the bound ResolveEscalationInstants uses, for the same reason: never a
  //   silent truncation, and a caller with more pages.
  //
  //   THE WHOLE CALL FITS IN TEN YEARS: from the earliest `start` to the latest `end` of the request,
  //   at most 10 calendar years in Asia/Ho_Chi_Minh. This is NOT AdvanceWorkingHours' 366-day
  //   horizon, deliberately. That horizon refuses an ANSWER that would land past the holidays anybody
  //   entered; here both endpoints are the caller's own, so there is no answer to land anywhere, and
  //   366 days would fail a whole page the day one record on it has been late for a year — with the
  //   caller unable to pre-filter it without the very calendar-days arithmetic rule 10 forbids it.
  //   What the bound refuses is a GARBAGE instant: an unset deadline column read as year 1, or the
  //   Unix epoch, which would walk decades of calendar for one row. Both endpoints come from the
  //   caller, so exceeding it is the caller's fault by construction — never the commune's
  //   configuration. A real span past ten years is a change to this comment, and additive.
  //
  //   THE CALENDAR IS NOT MADE COMPLETE BY ANY BOUND, here as on AdvanceWorkingHours: a span through a
  //   year whose holidays nobody entered measures that year's holidays as working time. That gap
  //   belongs to whoever operates the configuration screen.
  //
  // # Configuration faults are refused, and an empty calendar is NOT "zero working time"
  //
  // The four calendar faults AdvanceWorkingHours lists are FAILED_PRECONDITION here too, detected by
  // the same code, under the same laziness: a fault in a year no span of this call enters cannot
  // change this answer. THE EMPTY CALENDAR DESERVES ITS SENTENCE: mathematically it measures 0
  // everywhere, and 0 reads as "not late" on every row of the queue. It is refused, exactly as
  // AdvanceWorkingHours refuses it — the commune has not said when it is open, so nothing about its
  // working time can be read. AdvanceWorkingHours' fifth fault, the horizon, is never produced: the
  // ten-year bound above replaces it and is the caller's.
  //
  // # The commune travels in metadata; not cached; not stored; not audited; retry is safe
  //
  // ONE CALL, ONE COMMUNE: "x-tenant-id" names whose calendar is read, no field can name a second,
  // and an exemption is not expressible (ADR 0012, decision 1). NOT CACHED: a commune correcting its
  // holidays must see the reading change on the next load. NEVER STORE THE ANSWER: it moves with
  // `end` (usually `now`) and with the calendar, so a stored "late by" is a state built from a
  // comparison — rule 10, invariant 3, one step removed. A read of configuration: it writes nothing,
  // publishes nothing, and leaves no audit entry.
  //
  // # THE STATUS CODES ARE PART OF THE CONTRACT
  //
  //   OK                  one item per DISTINCT span — all of them, or the call fails. No partial
  //                       success: every span is measured against one calendar, so anything that
  //                       stops one stops all, and a page with some rows measured and some silently
  //                       absent reads the absent ones as 0.
  //   INVALID_ARGUMENT    the CALLER is wrong: no spans, more than 500, an unset span, an unset or
  //                       invalid `start` / `end`, `end` before `start`, or a call wider than ten
  //                       years. Checked BEFORE anything is read.
  //   FAILED_PRECONDITION the COMMUNE'S CALENDAR is missing or wrong — the four faults above. The
  //                       caller shows "chưa cấu hình lịch làm việc", never a number.
  //   NOT_FOUND           NEVER produced.
  //   UNAUTHENTICATED     NEVER produced by this RPC — it belongs to the caller-key interceptor.
  //   UNAVAILABLE etc.    the call did not happen. It is NOT "0 hours late": show no figure (the
  //                       "Quá hạn" state is still derivable without it), never a default.
  rpc MeasureWorkingHours(MeasureWorkingHoursRequest) returns (MeasureWorkingHoursResponse);

  // ResolveDeadlines answers, for ONE commune and ONE administrative record, the instants at
  // which that record's processing commitments fall due.
  //
  // WHAT IT IS: the commune's own two halves joined once, here. `sla` says HOW LONG in working
  // hours (migration 0008, ADR 0029); `lich_lam_viec` + `ngay_nghi_le` + `ngay_lam_bu` say WHEN
  // this commune is open (migration 0006, ADR 0007). The caller supplies the three things only it
  // knows — which kind of work, which field, and the instant the clock starts — and receives
  // INSTANTS it stores as given.
  //
  // # WHY IT RETURNS THE INSTANT AND NOT THE NUMBER OF HOURS — the decision this contract exists to record
  //
  // ADR 0029 §123 left exactly one question open and refused to answer it: a call returning HOURS
  // with the caller adding them up, or a call returning the DEADLINE already computed. THE USER
  // DECIDED ON 2026-09-22: THE DEADLINE, ALREADY COMPUTED.
  //
  // The reason is not convenience, it is that the other shape is FORBIDDEN. Returning hours puts
  // the working-hours arithmetic in `petitions` AND in `documents` — two implementations of one
  // count, which ADR 0007 rules out and `hooks/citizen_commitment_guard.py` blocks at the write.
  // The two copies would agree on every ordinary afternoon and disagree on exactly the days a
  // citizen notices: nights, weekends, `ngay_nghi_le`, `ngay_lam_bu`. And the disagreement has no
  // symptom — both compile, both pass their tests, and the wrong one has already been promised to
  // somebody.
  //
  // WHAT THE REJECTED SHAPE WOULD HAVE BOUGHT, STATED HONESTLY: a caller could show "N giờ làm
  // việc" on a screen without a second call. That is a real need (ADR 0028 §(a): the Mini App says
  // "sẽ được xem trong N giờ làm việc"), and it is NOT served here — see the omission recorded on
  // `Deadline`. It is additive when a screen exists that reads it.
  //
  // # WHY IT IS A SECOND RPC AND NOT A FIELD ON AdvanceWorkingHours
  //
  // ADR 0029 §119 calls that RPC "a precedent for the SHAPE, not a place to add fields", and the
  // shapes really do differ: its `working_hours` is CALLER-DECLARED DATA, and an optional
  // "look the hours up instead" flag would make the one required field of that message
  // conditionally meaningless — the shape where a caller sets both and nothing says which won.
  // Keeping them apart also keeps one property that is worth more than the saved message: a
  // caller of AdvanceWorkingHours is visibly counting hours IT chose, and a caller of this RPC is
  // visibly fixing a commitment THE COMMUNE chose. A reviewer can tell them apart at the call
  // site.
  //
  // THE ARITHMETIC IS NOT DUPLICATED BY THE SPLIT. Both RPCs walk the same
  // domain.TienGioLamViec, through the same calendar read, in the same process — one
  // implementation, two entrances.
  //
  // # THE CALLER NAMES WHICH CLOCKS IT IS FIXING, AND THAT IS NOT A CONVENIENCE
  //
  // `deadlines` is required and there is deliberately no "give me everything" default. ADR 0028
  // decision E sets a petition's two clocks AT TWO DIFFERENT MOMENTS: `han_tiep_nhan` when the row
  // is created, `han_xu_ly_xong` when a member of staff settles the field. On the citizen channel
  // the field is UNKNOWN at creation, so a response that always carried both would hand that
  // caller a `han_xu_ly_xong` computed from the DEFAULT row — which is precisely the 56-hour
  // ceiling ADR 0028 removed and its stop condition #1 forbids rebuilding. Requiring the caller to
  // NAME the clock makes storing the wrong one a sentence somebody had to write.
  //
  // ONE CALL CAN STILL NAME BOTH, and a caller whose form carries the field at intake should —
  // `van-ban-den`, and ADR 0028's rule for any channel with `linh_vuc` in the intake form. Two
  // clocks in one call is one calendar read and one hop; two calls is two, and the second could
  // read a calendar the first did not.
  //
  // # A COMMUNE WITH NO CONFIGURATION IS REFUSED. IT IS NEVER GIVEN A NUMBER
  //
  // `sla` IS EMPTY FOR EVERY COMMUNE TODAY — migration 0008 seeds nothing, deliberately, and the
  // onboarding step does not exist. So this is the ORDINARY answer at the moment, not an edge
  // case, and it is FAILED_PRECONDITION:
  //
  //   the commune has no `sla` row at all;
  //   the requested `work_kind` has no row, and none it could fall back to;
  //   the requested `linh_vuc` has no row AND that `work_kind` has no default row either.
  //
  // THERE IS NO DEFAULT AND THERE MUST NEVER BE ONE, in this service or in a caller. Not "24
  // hours", and not the sixteen rows of docs/ui-ux/14-cau-hinh.md §8 either: those came from ONE
  // commune's prototype, and a commitment invented by software is still told to a citizen as
  // though the authority made it (rule 10, forbidden #3). The refusal IS the answer, and the fix
  // is a configuration screen, not a fallback.
  //
  // WHAT THE CALLER DOES WITH IT: FAIL THE INTAKE. Do not store the record without a deadline —
  // transaction-boundaries.json `tinh_han_xu_ly_luc_tiep_nhan` states it in full, and the reason
  // is that a row with no deadline is a commitment nobody counts while every on-time/overdue
  // report counts it anyway.
  //
  // # `linh_vuc` IS A VALUE, AND A MISSPELLED ONE GETS THE DEFAULT ROW SILENTLY
  //
  // Field codes are a closed platform-level set owned by service `platform` (ADR 0026), so nothing
  // here can tell an unknown code from a code this commune simply has no row for — and the
  // documented fallback for the second is the default row (docs/ui-ux/14-cau-hinh.md:311, "Mặc
  // định cho mọi lĩnh vực"). A caller sending `ve-sinh-moi-truongg` therefore gets the DEFAULT
  // deadline and no error. THAT HOLE IS CLOSED AT THE WRITE PATH, NOT HERE — ADR 0029's own
  // conclusion, and the specification already carries the defect as evidence (14-cau-hinh.md:308,
  // an SLA row pointing at a code that no longer exists). Callers validate the field code before
  // they get here; this RPC is not the place that check lives.
  //
  // # The commune travels in metadata, and this RPC is not a candidate for exemption
  //
  // ONE CALL, ONE COMMUNE. "x-tenant-id" names WHOSE deadlines and WHOSE calendar are read, and
  // there is deliberately no field in the request that could name a second one. The caller always
  // holds it: an intake runs behind an edge that has already resolved the commune. Putting this
  // method on core/grpcx.methodsWithoutTenant is not even expressible — a commune's configuration
  // read without naming a commune — and adding any name to that list is a stop condition in its
  // own right (ADR 0012, decision 1).
  //
  // # THE STATUS CODES ARE PART OF THE CONTRACT
  //
  //   OK                  every requested clock answered. There is no partial success — see
  //                       ResolveDeadlinesResponse.
  //   INVALID_ARGUMENT    the CALLER is wrong: `work_kind` unspecified, no `count_from`, an empty
  //                       or over-length `deadlines`, or an unspecified entry in it.
  //   FAILED_PRECONDITION the COMMUNE'S CONFIGURATION is missing or wrong — no usable `sla` row
  //                       (above), or any of the four calendar faults AdvanceWorkingHours lists.
  //                       An `sla` row carrying a non-positive or absurd number of hours lands
  //                       here TOO, and NOT on INVALID_ARGUMENT: the number came from the
  //                       commune's table, not from the caller, and an operator sent to fix the
  //                       calling service would find nothing wrong with it.
  //   NOT_FOUND           NEVER produced. A commune with no configuration is FAILED_PRECONDITION:
  //                       the row is not "missing from a collection", the commune has not made a
  //                       decision yet, and those go to different people.
  //   UNAUTHENTICATED     NEVER produced by this RPC — it belongs to the caller-key interceptor
  //                       (ADR 0025) and means the DEPLOYMENT is misconfigured.
  //   UNAVAILABLE etc.    the call did not happen, and it is NOT "no deadline". Fail the intake.
  //
  // # The obligations that travel with the answer
  //
  // CALL IT ONCE, AT THE ACT THAT FIXES THE CLOCK, AND STORE WHAT IT RETURNS (rule 10, invariant
  // 2). The answer is a pure function of the arguments AND of the commune's configuration as it
  // stands at that instant, so the same call next month may legitimately answer differently —
  // ADR 0007 decision 6 fixes that a configuration change is NOT retroactive. Calling it again to
  // "re-derive" a stored deadline silently moves a commitment already made to a citizen.
  //
  // OVERDUE IS STILL DERIVED. This returns instants, never a state: rule 10, invariant 3 forbids a
  // field or a column that says "late", and there is none here.
  //
  // RETRYING A FAILED CALL IS SAFE: this RPC writes nothing, publishes nothing, and leaves no
  // audit entry. The audited act is the INTAKE, written by the caller in its own transaction.
  rpc ResolveDeadlines(ResolveDeadlinesRequest) returns (ResolveDeadlinesResponse);

  // ResolveDueSoonCutoff answers, for ONE commune, ONE kind of work and ONE instant, the LATEST
  // deadline that counts as "sắp đến hạn" at that instant.
  //
  // WHAT "SẮP ĐẾN HẠN" MEANS, and it is the specification's sentence, not this contract's: a record is
  // due soon when the WORKING hours REMAINING before its deadline are at most `sla.gio_sap_den_han`
  // (migration 0008, the comment on that column; docs/ui-ux/14-cau-hinh.md §8). The number is the
  // COMMUNE'S, per kind of work and field — there is no 72 anywhere in code (rule 10, forbidden #3).
  //
  // WHY IT EXISTS (user decision 2026-09-28): the task register's "Sắp đến hạn" filter (`soon=true`)
  // is refused today because nothing publishes the commune's threshold.
  //
  // # WHY IT RETURNS AN INSTANT AND NOT THE NUMBER OF HOURS — read before "simplifying" it
  //
  // ADR 0029 §Bổ sung (user, 2026-09-22) fixed that an RPC reading `sla` returns INSTANTS, not hours,
  // and that `gio_sap_den_han` does not leave this service AS HOURS. The reason is unchanged: with the
  // hours in hand a caller must turn "72 working hours" into something comparable with a stored
  // deadline, and the only arithmetic within reach — `now + 72h`, `deadline - 72h` — counts nights,
  // weekends, `ngay_nghi_le` and `ngay_lam_bu` as working time. That is rule 10, forbidden #2, and it
  // agrees with the right answer on every ordinary afternoon and disagrees on exactly the days an
  // officer is surprised by a task that was never flagged.
  //
  // ADR 0029 ALSO SAID THIS COLUMN NEEDS A "BACKWARD" COUNT FROM THE DEADLINE, WHICH DOES NOT EXIST.
  // That is true for a PER-RECORD instant (when to ring the bell for one task). It is NOT needed for
  // a FILTER, and that is the whole trick of this RPC: for any deadline D after `as_of`,
  //
  //   working hours in [as_of, D] <= N   ⟺   D <= due_soon_until
  //
  // where `due_soon_until` is the LATEST instant by which at most N working hours have elapsed since
  // `as_of` — a FORWARD walk, through the same calendar and the same single implementation
  // (domain.TienGioLamViec's walk) every deadline in this system is computed with. One call per list
  // request answers every row of the page by a plain comparison in SQL.
  //
  // # "LATEST", NOT "EARLIEST" — the opposite of `Deadline.due_at`, on purpose
  //
  // `due_at` is the EARLIEST instant N hours are reached, because a commitment must not gain a gap
  // nobody granted. Here the question is the reverse — "is at most N left" — so every instant up to
  // the next moment working time would accrue again still has exactly N left. When the N-th hour
  // ends at a session boundary (17:00 Friday), the answer is the START of the next working session
  // (Monday 07:30), and a task whose hand-entered deadline is Friday 23:59 is correctly due soon.
  // With "earliest" it would silently drop out of the filter every time the count ended on a
  // boundary — which, counted from a night or a weekend with N a whole number of working days, is
  // every time.
  //
  // # THE COMPARISON THE CALLER MAKES, and nothing else
  //
  //   due soon   ⟺   as_of < deadline  AND  deadline <= due_soon_until
  //
  // A deadline AT OR BEFORE `as_of` is OVERDUE, not due soon — that is the caller's `late` filter,
  // derived the same way (rule 10, invariant 3). Nothing here is stored: the answer is a function of
  // `as_of`, so a caller writing it into a column has built the `is_overdue` flag rule 10 forbids,
  // one step removed.
  //
  // ONE FIELD, ONE THRESHOLD. A list MIXING fields whose rows carry different `gio_sap_den_han`
  // cannot be filtered with one cutoff — ask once per field, or filter a kind of work whose records
  // carry no field. Tasks (`nhiem-vu`) carry none today, so their caller sends `linh_vuc` "" and reads
  // the default row.
  //
  // # A commune with no configuration is REFUSED — FAILED_PRECONDITION, never a number
  //
  // Exactly the three cases of ResolveDeadlines: no `sla` row at all; no row usable for this
  // `work_kind`; the `linh_vuc` has no row AND the kind has no default row. `sla` is empty for every
  // commune today, so this is the ORDINARY answer at the moment. The caller tells its user the filter
  // is not configured for this commune — it never substitutes 72 and never drops the filter
  // silently. The four calendar faults of AdvanceWorkingHours land here too, and so does a
  // non-positive or absurd `gio_sap_den_han` (the number came from the commune's table).
  //
  // # The commune travels in metadata; not audited; retry is safe
  //
  // "x-tenant-id" names WHOSE threshold and WHOSE calendar; there is no field that could name a
  // second one, and an exemption from carrying it is not expressible. A read of configuration: it
  // writes nothing, publishes nothing, and leaves no audit entry.
  //
  // # THE STATUS CODES ARE PART OF THE CONTRACT
  //
  //   OK                  `due_soon_until` is set, and is at or after `as_of`.
  //   INVALID_ARGUMENT    the CALLER is wrong: `work_kind` unspecified, `as_of` missing or invalid.
  //   FAILED_PRECONDITION the COMMUNE'S CONFIGURATION is missing or wrong — above.
  //   NOT_FOUND           NEVER produced.
  //   UNAUTHENTICATED     NEVER produced by this RPC — it belongs to the caller-key interceptor.
  //   UNAVAILABLE etc.    the call did not happen. It is NOT "nothing is due soon": refuse the
  //                       filter with a retryable error (503), never answer the page without it.
  //
  // NOT CACHED ACROSS REQUESTS. The answer moves with `as_of`, and a commune correcting its holidays
  // or its threshold must see the filter change on the next load (ADR 0007 decision 6 governs stored
  // commitments; nothing is stored here).
  rpc ResolveDueSoonCutoff(ResolveDueSoonCutoffRequest) returns (ResolveDueSoonCutoffResponse);

  // ResolveEscalationInstants answers, for ONE commune, ONE kind of work and ONE field, and for
  // each deadline a record has ALREADY MISSED, the two instants at which that lateness reaches the
  // commune's escalation thresholds: `sla.gio_bao_lanh_dao` (tell the unit head) and
  // `sla.gio_bao_chu_tich` (tell the chairman).
  //
  // WHY IT EXISTS (user decision 2026-09-29): the `escalation` job of docs/ui-ux/14-cau-hinh.md §9
  // runs in the service owning the late records — service-petitions (tasks, petitions) and
  // service-documents (incoming documents, citizen letters) — and needs to know, per late record, whether the
  // lateness has crossed each threshold. Both thresholds are the commune's own numbers in the `sla`
  // table, counted in WORKING HOURS (ADR 0007).
  //
  // # THE ANCHOR — the question ADR 0029 left open, and the reading this contract takes
  //
  // `gio_bao_*` count FROM THE DEADLINE THE RECORD MISSED. That is §9's sentence ("việc trễ quá số
  // ngày đã đặt thì báo lên trưởng bộ phận") with §8's TWO columns instead of §9's doubling — the
  // user's 2026-09-29 decision names two thresholds, not one doubled. It is NOT "after receipt"
  // (§8's heading is silent on the anchor, and counting from receipt would escalate a record that
  // is not late at all). Migration 0008's column comments still say "anchor undecided"; that text
  // is in an applied migration and is superseded here, not edited there.
  //
  // WHICH DEADLINE is the caller's: it passes the instant its record stores and has passed. A
  // petition has two clocks (ADR 0028); the runner names which one it escalates on, and nothing
  // here can tell them apart — they are both just instants.
  //
  // # WHY IT RETURNS INSTANTS AND NOT THE NUMBER OF HOURS
  //
  // ADR 0029 §Bổ sung 22/09: an RPC that reads `sla` returns instants, never hours. With 24 in hand
  // the only arithmetic within a caller's reach is `deadline + 24h`, which counts nights, weekends,
  // `ngay_nghi_le` and `ngay_lam_bu` as working time — rule 10, forbidden #2. Here the error would
  // tell a commune's chairman that work is two days late on a Monday morning after a weekend that
  // was not working time at all.
  //
  // # WHY PER DEADLINE AND FORWARD, NOT ONE CUTOFF LIKE ResolveDueSoonCutoff
  //
  // A cutoff ("every deadline at or before X has crossed the threshold at as_of") needs the count
  // walked BACKWARD from `as_of`, and there is no backward walk in this service: one would be a
  // second implementation of the count, the thing ADR 0007 forbids. Counting FORWARD from each
  // missed deadline is the same walk every deadline in this system is computed with
  // (domain.TienGioLamViec), so one implementation stays one. The cost is a longer request — one
  // entry per distinct missed deadline — paid by a job that runs at most once a day per commune.
  //
  // # WHY A FIFTH RPC AND NOT A FLAG ON ResolveDeadlines
  //
  // ResolveDeadlines FIXES a commitment once and the caller stores it; this answers a comparison
  // the caller makes and must never store (below). A flag would put the two behind one call site,
  // and ADR 0029 §119's argument — a reviewer must be able to tell the two apart — applies again.
  // DeadlineKind stays a two-value enum for the same reason: these are not deadlines of the record.
  //
  // # THE COMPARISON THE CALLER MAKES, and nothing else
  //
  //   unit head is due   ⟺   unit_head_due_at <= as_of
  //   chairman is due    ⟺   chairman_due_at  <= as_of
  //
  // `as_of` is the runner's `now` — the `claimed_at` of its AutomationRun. NEVER STORE EITHER
  // INSTANT: storing one builds an "escalated at" state from a comparison, the class rule 10,
  // invariant 3 forbids, and a commune correcting its holidays would leave it stale. What the caller
  // DOES store is the fact that it notified someone at a level — an act that happened — and the
  // notification's idempotency key already makes that act happen once (DeliverStaffNotifications).
  //
  // # One field per call
  //
  // Thresholds differ per field (`linh_vuc`), exactly as for ResolveDueSoonCutoff: group the late
  // records by field and ask once per group. Tasks carry no field: send "".
  //
  // # A commune with no configuration is REFUSED — FAILED_PRECONDITION, never a number
  //
  // The three `sla` cases of ResolveDeadlines, the four calendar faults of AdvanceWorkingHours, and
  // a non-positive or absurd `gio_bao_*`. The runner records the run as
  // AUTOMATION_RUN_OUTCOME_CONFIGURATION_MISSING and notifies nobody — never a default 24.
  //
  // # The commune travels in metadata; not audited; retry is safe
  //
  // "x-tenant-id" names WHOSE thresholds and WHOSE calendar; not a candidate for
  // core/grpcx.methodsWithoutTenant (ADR 0012, decision 1). A read of configuration: it writes
  // nothing, publishes nothing, leaves no audit entry. The audited acts are the notifications.
  //
  // # THE STATUS CODES ARE PART OF THE CONTRACT
  //
  //   OK                  one item per DISTINCT missed deadline requested — all of them, or the call
  //                       fails. No partial success: every entry is counted against one commune's
  //                       one table and one calendar, so anything that stops one stops all.
  //   INVALID_ARGUMENT    the CALLER is wrong: `work_kind` unspecified, `missed_deadlines` empty or
  //                       over 500, an unset or invalid entry.
  //   FAILED_PRECONDITION the COMMUNE'S CONFIGURATION is missing or wrong — above.
  //   NOT_FOUND           NEVER produced.
  //   UNAUTHENTICATED     NEVER produced by this RPC — it belongs to the caller-key interceptor.
  //   UNAVAILABLE etc.    the call did not happen. It is NOT "nothing crossed a threshold": the run
  //                       fails with AUTOMATION_RUN_OUTCOME_DEPENDENCY_UNAVAILABLE and notifies
  //                       nobody; the next scheduled run tries again.
  rpc ResolveEscalationInstants(ResolveEscalationInstantsRequest) returns (ResolveEscalationInstantsResponse);

  // ResolveUnassignedHoldInstants answers, for ONE commune, ONE kind of work and ONE field, and for
  // each instant at which a unit BEGAN HOLDING work with NOBODY assigned, the instant at which that
  // hold reaches the commune's `sla.unassigned_hold_hours` threshold — "work held by a department
  // with nobody assigned" is then reported (docs/ui-ux/14-cau-hinh.md:330, "Cả việc bộ phận giữ mà
  // chưa phân công ai").
  //
  // WHY IT EXISTS (user decision 2026-09-29, ADR 0058 open question #5, identity migration 0016):
  // the `sla_reminders` job runs in the service owning the records, and the threshold is a
  // per-commune, per-row number of WORKING hours. Handing the runner the number would invite
  // `start + N*time.Hour`, which rule 10, forbidden #2 names; this answers the instant instead
  // (ADR 0029 §Bổ sung 22/09), counted by the same forward walk as every deadline here
  // (domain.TienGioLamViec — ADR 0007: one implementation of the count).
  //
  // # WHY A SIBLING RPC AND NOT A THIRD FIELD ON EscalationInstants
  //
  //   A DIFFERENT ANCHOR. Escalation counts from a deadline the record MISSED; this counts from when
  //   a unit started holding the work unassigned — a record that is nowhere near its deadline can be
  //   held unassigned too long. One request field carrying both would label a hold start a "missed
  //   deadline", and a caller would soon send the wrong one of the two, with nothing to tell.
  //   A DIFFERENT JOB. Escalation is the daily `escalation` job; this is the `sla_reminders` job's
  //   input, on a different cadence and a different claimed scope.
  //   A DIFFERENT "NOT CONFIGURED". The escalation thresholds are NOT NULL; this one is nullable, and
  //   NULL is a real answer ("do not report"), not a fault. It is a property of the ROW, so it is
  //   answered once per call (`reporting_disabled`), not guessed per item.
  //   Additive either way; a new RPC changes no existing caller's decoding at all.
  //
  // # THE ANCHOR IS THE CALLER'S, and nothing here can check it
  //
  // The caller passes, per held record, the instant the unit's unassigned hold BEGAN — the instant
  // the record reached the unit with no assignee, or the instant its last assignee was removed. The
  // runner's own store owns that fact; identity sees only instants. A caller sending the record's
  // receipt time instead would report work that was assigned for most of that time.
  //
  // # NULL MEANS "DO NOT REPORT", AND NOTHING SUBSTITUTES A NUMBER
  //
  // The row is chosen exactly as for ResolveDeadlines (the field's own row, else the default row),
  // and THAT ROW'S value is read. A field row holding NULL is NULL even when the default row holds a
  // number: the fallback is by row, never by column. NULL answers OK with `reporting_disabled =
  // true` and NO items — the runner reports nothing for this field and records nothing as a fault.
  // There is no default 8 or 24 anywhere on this path (migration 0016: POST /api/v1/sla/defaults
  // writes 8 as a starting point the commune owns; it is never read here as a fallback).
  //
  // # THE COMPARISON THE CALLER MAKES, and nothing else
  //
  //   report is due   ⟺   unassigned_report_due_at <= as_of      (as_of = the run's `claimed_at`)
  //
  // NEVER STORE THE INSTANT — the same reason as ResolveEscalationInstants: a stored "reportable at"
  // is a state built from a comparison (rule 10, invariant 3) and goes stale when the commune edits
  // its calendar or its threshold. What the runner stores is that it SENT a report — an act — and
  // the notice's idempotency key makes that act happen once.
  //
  // # One field per call; the commune travels in metadata; not audited; retry is safe
  //
  // Group held records by field and ask once per group; tasks carry no field: send "".
  // "x-tenant-id" names whose threshold and whose calendar (ADR 0012, decision 1: not exempt). A
  // read of configuration: writes nothing, publishes nothing, leaves no audit entry.
  //
  // # THE STATUS CODES ARE PART OF THE CONTRACT
  //
  //   OK                  EITHER `reporting_disabled = false` and one item per DISTINCT
  //                       `hold_started_at` entry — all of them, or the call fails — OR
  //                       `reporting_disabled = true` and zero items. Never a mix, never a partial
  //                       answer. `reporting_disabled = false` with fewer items than distinct entries
  //                       is a contract fault; the caller fails the run rather than reporting nothing.
  //   INVALID_ARGUMENT    the CALLER is wrong: `work_kind` unspecified or unknown, `hold_started_at`
  //                       empty or over 500, an unset or invalid entry. Checked BEFORE anything is
  //                       read, so a malformed call is refused even for a field whose value is NULL.
  //   FAILED_PRECONDITION the COMMUNE'S CONFIGURATION is missing or wrong: the three `sla` cases of
  //                       ResolveDeadlines, a set value outside 1–2000, or (only when the value is set)
  //                       the four calendar faults of AdvanceWorkingHours. The runner records
  //                       AUTOMATION_RUN_OUTCOME_CONFIGURATION_MISSING and reports nothing.
  //   NOT_FOUND           NEVER produced.
  //   UNAUTHENTICATED     NEVER produced by this RPC — it belongs to the caller-key interceptor.
  //   UNAVAILABLE etc.    the call did not happen. It is NOT "nothing to report" and NOT "disabled":
  //                       the run fails with AUTOMATION_RUN_OUTCOME_DEPENDENCY_UNAVAILABLE.
  rpc ResolveUnassignedHoldInstants(ResolveUnassignedHoldInstantsRequest) returns (ResolveUnassignedHoldInstantsResponse);

  // ResolveOrgUnitPermissionHolders answers, for org units of the commune named by "x-tenant-id",
  // which staff sitting IN each unit hold ONE named permission key there — the recipients of a
  // notice that belongs to "whoever runs this unit's work".
  //
  // WHY IT EXISTS (user decision 2026-09-29): the `escalation` job's first level tells the head of
  // the unit holding the late work (§9 "báo lên trưởng bộ phận"; §8 "Báo lãnh đạo trực tiếp"), and
  // `sla_reminders` tells the unit when late work has no named holder. `bo_phan` has NO head column
  // (migration 0001:73-88), so "head" must be derived, and the derivation belongs to the service
  // that owns units, roles and grants.
  //
  // # WHY BY PERMISSION, AND NOT BY ROLE NAME OR A NEW COLUMN
  //
  //   A ROLE CODE (`truong-bo-phan`) would be the ad hoc role-string comparison rule 5 forbids (#3),
  //   and roles are per commune: a commune of eight staff has no "Trưởng bộ phận" at all, while one
  //   of forty routes the same work through a deputy chairman (0001:103-105).
  //   A HEAD COLUMN on `bo_phan` is a new fact nobody enters today, and a notice aimed at a column
  //   nobody filled reaches nobody, silently.
  //   A PERMISSION KEY is what the commune already configures on the Phân quyền screen: the person
  //   who may hand out this unit's work is the person who should hear that it is late. The caller
  //   names the key that means "hands out work" in ITS domain — `task.assign` for tasks,
  //   `feedback.assign` for petitions, `document.route` for incoming documents. All three are rows
  //   of the `quyen` table (0001:296-307).
  //
  // WHAT THAT COSTS, STATED: anybody in the unit whose role grants the key is answered, not one
  // "head". A commune granting `task.assign` to every chuyên viên notifies every chuyên viên. That
  // is the commune's grant working as configured, and it is visible on the screen that sets it.
  //
  // # THE PREDICATE
  //
  // A staff code is answered for unit U when its `nguoi_dung` row, in this commune, satisfies
  // ResolveAssignableStaff's predicate EXACTLY (not deleted, `co_tai_khoan`, `dang_hoat_dong` — a
  // locked or account-less person can never read a notice), has `bo_phan_id = U`, U is a LIVE unit
  // (ResolveLiveOrgUnits' predicate), and its role, not soft-deleted, grants `permission_key` in
  // `vai_tro_quyen` of this commune. Membership is DIRECT: a parent unit's staff are not answered
  // for a child unit.
  //
  // # THE KEY MUST EXIST — rule 5, invariant 3c
  //
  // A `permission_key` that is not a row of `quyen` is INVALID_ARGUMENT, never an empty answer. An
  // empty answer is ordinary (nobody holds it) and would be recorded as "no recipient"; a typo
  // answered the same way would make a job that notifies nobody, forever, with every test green.
  //
  // # A LOOKUP BY UNITS THE CALLER ALREADY HOLDS — NEVER A ROSTER
  //
  // The units are the ones the caller's late records store. An empty `org_unit_ids` answers empty,
  // never "every unit". Codes only — no name, no contact detail, no internal id — so it carries no
  // personal data; log counts, not codes.
  //
  // # Not audited; not exempt from "x-tenant-id"; retry is safe
  //
  // A read that decides only who is TOLD; it grants nothing and the caller must never use it in a
  // guard. The audited act is the notification.
  //
  // # THE STATUS CODES ARE PART OF THE CONTRACT
  //
  //   OK                  zero or more items; a unit with no holder, a removed unit, an unknown unit
  //                       and another commune's unit are ALL absent — one answer (rule 1).
  //   INVALID_ARGUMENT    `permission_key` empty or not a row of `quyen`; more than 50 unit ids.
  //   NOT_FOUND           NEVER produced.
  //   UNAUTHENTICATED     NEVER produced by this RPC — it belongs to the caller-key interceptor.
  //   UNAVAILABLE etc.    the call did not happen. It is NOT "nobody to tell": fail the run.
  rpc ResolveOrgUnitPermissionHolders(ResolveOrgUnitPermissionHoldersRequest) returns (ResolveOrgUnitPermissionHoldersResponse);

  // ResolveLeadershipStaff answers the staff codes of the commune's LEADERSHIP (`Lãnh đạo`,
  // kb/00-foundation/ubiquitous-language.md: Chủ tịch / Phó chủ tịch) — the accounts whose role
  // carries `vai_tro.la_lanh_dao = true`.
  //
  // WHY IT EXISTS (user decision 2026-09-29): the `escalation` job's second level (§8 "Báo Chủ
  // tịch"), the `weekly_digest` job (§9 "Bản tin đầu tuần cho lãnh đạo"), and the fallback of
  // `sla_reminders` for late work that has neither a holder nor a unit. The reference system picks
  // exactly this set — roles marked as leadership (../vigov-require/apps/api/app/workers/sla.py,
  // `_leaders`) — and the flag is the `Lãnh đạo` label the commune sets per role on the Phân quyền
  // screen (docs/ui-ux/14-cau-hinh.md §4).
  //
  // # "BÁO CHỦ TỊCH" REACHES THE LEADERSHIP, NOT ONLY THE CHAIRMAN — stated, not hidden
  //
  // Singling out the chairman would need a role-code comparison (`chu-tich-ubnd`), which rule 5
  // forbids (#3) and which a commune that renamed its roles would silently break. The template
  // roles flag both Chủ tịch and Phó Chủ tịch (ADR 0055 §4). If the customer wants the chairman
  // alone, that is a new fact on the role (a second flag) and an additive field here — not a
  // string match in a runner.
  //
  // # A ROSTER, AND WHY THAT IS ACCEPTABLE HERE WHEN IT IS NOT ELSEWHERE
  //
  // The other lookups in this service refuse to list. This one lists, deliberately: the question
  // has no key the caller could already hold. What bounds it: codes only (no personal data); the
  // set is the handful of people a commune marked as leadership; and every signed-in account of
  // the commune already sees each of them on GET /api/v1/staff-directory. It is NOT a path to the
  // wider roster: there is no filter field, and adding one is a new RPC with its own argument.
  //
  // # THE PREDICATE
  //
  // ResolveAssignableStaff's predicate EXACTLY (not deleted, `co_tai_khoan`, `dang_hoat_dong`),
  // AND the account's role is a live `vai_tro` row of this commune with `la_lanh_dao = true`.
  //
  // # EMPTY IS AN ORDINARY ANSWER, NOT A FALLBACK TRIGGER
  //
  // A commune that flagged no role has no leadership to tell. The runner records the items as
  // "without recipient" on its outcome — it never falls back to "everyone", to the unit holders,
  // or to an administrator.
  //
  // # Not audited; not exempt from "x-tenant-id"; retry is safe
  //
  // "x-tenant-id" is the whole scope: another commune's leadership is unreachable. The audited act
  // is the notification.
  //
  // # THE STATUS CODES ARE PART OF THE CONTRACT
  //
  //   OK                  zero or more codes.
  //   FAILED_PRECONDITION more than 50 leadership accounts — a configuration anomaly (a role flagged
  //                       by mistake), refused rather than truncated: a truncated list tells some
  //                       leaders and not others with nothing reporting which.
  //   NOT_FOUND           NEVER produced.
  //   UNAUTHENTICATED     NEVER produced by this RPC — it belongs to the caller-key interceptor.
  //   UNAVAILABLE etc.    the call did not happen. It is NOT "no leadership": fail the run.
  rpc ResolveLeadershipStaff(ResolveLeadershipStaffRequest) returns (ResolveLeadershipStaffResponse);

  // ClaimDueAutomationRuns answers, for the commune named by "x-tenant-id", which of the job scopes
  // the calling runner owns are DUE NOW — and CLAIMS each one it answers, atomically, so that no
  // other replica of any service runs it for this slot.
  //
  // WHY IT EXISTS (user decision 2026-09-29): the jobs of docs/ui-ux/14-cau-hinh.md §9 run
  // IN-PROCESS in the service owning the data, and their per-commune settings — on/off, cadence,
  // last run — are owned HERE, next to `sla` (ADR 0029's test: read by two services, owned by
  // neither, changes with the commune's administrative policy), edited under `admin.sla`.
  //
  // # WHY THE SCHEDULE NEVER LEAVES THIS SERVICE
  //
  // The reference system hands the runner the settings and lets it decide `_is_due`
  // (../vigov-require/apps/api/app/workers/scheduler.py:57-95). Here two services run jobs, each
  // with several replicas. Handing out the settings would put "is this due" in petitions AND in
  // documents — two implementations of one rule, drifting on exactly the edge cases (the minute a
  // slot opens, a restart inside it, the day a job is switched on). And two replicas reading the
  // same settings would both decide "due" and both run. A CLAIM answers both: one implementation of
  // the schedule, and a conditional write that only one caller can win.
  //
  // # A SCOPE IS (job, kind of work), BECAUSE ONE JOB RUNS IN TWO SERVICES
  //
  // `sla_reminders` sweeps tasks and petitions (service-petitions) AND incoming documents and
  // citizen letters (service-documents). One `last_run_at` per job would let whichever service ran first mark the
  // job done for the other. So run state is kept per AutomationRunScope; the SETTING (enabled,
  // cadence) stays per job, one row a commune edits once. Each scope has EXACTLY ONE owning runner —
  // the service owning that WorkKind's data (WorkKind's own comment names it). Identity cannot see
  // which service is calling (ADR 0025: one shared caller key), so a runner claiming a scope it does
  // not own would silently take that scope's runs away from its owner. That is the caller's
  // obligation and it is stated here because nothing can enforce it.
  //
  // # WHAT "DUE" MEANS — the promise, whichever way the server implements it
  //
  //   ONE SCHEDULE PER JOB, fixed by the job, set by the commune (Asia/Ho_Chi_Minh, §9):
  //     sla_reminders   every N minutes, N >= 5
  //     escalation      daily at HH:MM
  //     weekly_digest   weekly on a weekday at HH:MM
  //   A scope is due when its job is ENABLED and a scheduled slot has opened since the scope was
  //   last claimed. A slot that opened while no runner was ticking is run ONCE, at the next claim —
  //   never replayed once per missed slot, and never skipped for the day (the reference system's
  //   five-minute window loses the whole day to a restart at 07:06).
  //   A slot that opened BEFORE the job was last switched on never counts: enabling escalation at
  //   15:00 runs it tomorrow at the configured hour, not at 15:00 today.
  //   NO SETTING ROW MEANS OFF (§9: "Mặc định tắt hết"). There is no default schedule anywhere.
  //
  // # WHAT THE CLAIM WRITES, AND WHY IT IS NOT AUDITED
  //
  // It moves the scope's `last_claimed_at` to the server's now and issues a `run_id`. That is a
  // LEASE, not a business act, and it is written at up to every five minutes per scope per commune;
  // an audit entry per lease would bury the entries that carry legal weight. The run's trail is
  // RecordAutomationRunOutcome's entry, and every notice the run sends is audited where it is
  // written (DeliverStaffNotifications). A lease with no recorded outcome — the runner died — is
  // visible on the configuration screen as a run with no result, which is what it is.
  //
  // THE SERVER'S CLOCK, NOT THE CALLER'S. `claimed_at` comes from this service, so every replica of
  // every runner agrees about when a slot opened. The runner uses `claimed_at` as its `now` for the
  // whole run — the `as_of` it sends to ResolveDueSoonCutoff, the instant it compares deadlines and
  // escalation instants against, and the local date in its idempotency keys. Two clocks inside one
  // run put a record on neither list or on both.
  //
  // # HOW THE RUNNER FINDS COMMUNES TO ASK ABOUT — the answer that keeps this call per commune
  //
  // There is deliberately no "which communes have job X enabled" RPC. It would be a cross-commune
  // read travelling without "x-tenant-id", i.e. a new member of core/grpcx.methodsWithoutTenant —
  // a STOP CONDITION under ADR 0012, decision 1 — and its answer would be the list of every
  // commune's ULID, the prefix of every key in the system (rule 1, invariant 7). Instead the runner
  // iterates the communes IT ALREADY HOLDS DATA FOR (a commune with no task, petition or document in
  // that service has nothing for the job to do), skips any commune platform's GetTenant reports as
  // not `active` (a merged commune is inactive and keeps its data — rule 7, invariant 6), and asks
  // this RPC once per commune with that commune in "x-tenant-id". The enumeration is a cross-commune
  // read of tenant IDENTIFIERS in the runner's own store and carries its own `// @cross-tenant:`.
  //
  // # THE STATUS CODES ARE PART OF THE CONTRACT
  //
  //   OK                  zero or more runs. ABSENT MEANS "NOTHING TO DO NOW" — not enabled, not due,
  //                       or won by another replica; the three are indistinguishable and the runner
  //                       does nothing for all of them.
  //   INVALID_ARGUMENT    `scopes` empty or over 10, or an entry with an unspecified job or kind.
  //   NOT_FOUND           NEVER produced.
  //   UNAUTHENTICATED     NEVER produced by this RPC — it belongs to the caller-key interceptor.
  //   UNAVAILABLE etc.    the call did not happen, so NOTHING WAS CLAIMED as far as the runner may
  //                       assume: run nothing for this commune on this tick, try at the next. (If the
  //                       claim committed and the reply was lost, that slot is skipped — the safe
  //                       direction: a missed reminder, never a doubled one.)
  //
  // RETRYING IS NOT A NO-OP: a retry after a lost reply finds the slot already claimed and answers
  // absent. That is the intended behaviour and the reason the runner never retries a claim in a loop.
  rpc ClaimDueAutomationRuns(ClaimDueAutomationRunsRequest) returns (ClaimDueAutomationRunsResponse);

  // RecordAutomationRunOutcome writes the result of ONE claimed run — what the configuration screen
  // shows as "Chạy lần cuối … · kết quả" (§9, `ket_qua_lan_cuoi`) — and the run's audit entry.
  //
  // # ONE AUDIT ENTRY PER RUN, IN THE SAME TRANSACTION (rule 6, invariants 3 and 6)
  //
  // A background job is a system action and is audited with the system principal
  // (core/audit.SystemActor). The entry names the job, the scope, the run id and the counts below.
  // It is written with the outcome or not at all.
  //
  // # WHAT CROSSES: a closed outcome and three counts — no free text
  //
  // There is no "message" field, deliberately. A runner's error string is where a petition's
  // content, a citizen's phone number or a staff member's name ends up (rule 3, forbidden #3 and
  // #5), and this record is shown on a screen and kept in the trail. The outcome enum says which
  // PERSON has to act — the commune's configuration, the operator, or nobody.
  //
  // # IDEMPOTENT: THE FIRST OUTCOME FOR A RUN WINS (rule 2, invariant 5)
  //
  // A second call for the same `run_id` answers OK and changes nothing — whether it repeats the
  // first outcome or contradicts it. A runner retrying after a lost reply therefore cannot write two
  // entries, and a slow replica cannot overwrite a newer result.
  //
  // # THE STATUS CODES ARE PART OF THE CONTRACT
  //
  //   OK                  recorded, or already recorded (first write wins).
  //   INVALID_ARGUMENT    `run_id` empty, or `outcome` unspecified.
  //   NOT_FOUND           no run with that id was claimed IN THIS COMMUNE — unknown and another
  //                       commune's run are one answer (rule 1).
  //   UNAUTHENTICATED     NEVER produced by this RPC — it belongs to the caller-key interceptor.
  //   UNAVAILABLE etc.    not recorded. Retrying is safe and expected.
  rpc RecordAutomationRunOutcome(RecordAutomationRunOutcomeRequest) returns (RecordAutomationRunOutcomeResponse);
}

message Staff {
  string id = 1;
  string tenant_id = 2;       // staff belong to exactly one commune

  // Field 3 WAS `username`, and there has never been such a column. Sign-in is by `email`
  // (identity/internal/store/can_bo.go, TheoEmail), and the only per-commune unique
  // keys on `nguoi_dung` are UNIQUE (tenant_id, ma) and UNIQUE (tenant_id, email). The field
  // therefore also asserted a constraint that exists nowhere — worse than a spare field,
  // because whoever implements this service would have had to choose between inventing a
  // column and returning an empty string, and both make the contract lie about the record.
  //
  // The number AND the name are reserved: a number is never reused (rule 2, invariant 4), and
  // reserving the name stops the word coming back later attached to different data, which is
  // how a wrong field returns without anybody noticing.
  reserved 3;
  reserved "username";

  // AT MOST ONE element today: `nguoi_dung.vai_tro_id` is a single nullable column, so this
  // list is empty or holds one entry — a caller must not assume more, and must not assume at
  // least one either (the column is nullable). Kept repeated rather than narrowed to a
  // singular field because the schema is the narrower fact of the two: if a staff member ever
  // holds two roles, a caller written against a list keeps working, whereas a singular field
  // would have to be removed and replaced.
  //
  // These are ROLES, not permissions. A permission is a flat `<nhóm>.<việc>` key held by a
  // role (rule 5, invariant 3b); this contract never carries permissions, because a caller
  // that reads them would be deciding authorisation outside the service that owns it.
  repeated string roles = 4;

  // `mat_khau_hash` is deliberately absent and must never be added, in any form, hashed or
  // not (rule 3, rule 8). Nothing outside identity has a reason to see it, and a credential
  // that crosses a service boundary is a credential in somebody else's logs.
  //
  // `ho_ten` IS DELIBERATELY ABSENT TOO, AND IT NOW HAS A HOME ELSEWHERE — `StaffName`, answered by
  // ResolveStaffNames. Open question #11 (decided 2026-09-22) removed the blocker that used to keep
  // a staff name off every boundary; it did NOT make this the right message for one. This message
  // is what a caller DECIDES from — is this id a staff record of this commune, what role does it
  // hold — and it answers only for records still in the directory. A name here would be a second
  // path by which a staff member's name leaves this service, on a shape that cannot say whether the
  // record was removed, which is exactly how a departed person ends up rendered as current.
}

// StaffPrincipal is the authorisation state of one member of staff, at the instant one request
// was authenticated. It is the whole of what leaves this service for a guard to work on.
//
// EVERY FIELD THAT IS NOT HERE IS ABSENT ON PURPOSE, and the list of omissions is longer than
// the list of fields — read it before adding anything:
//
//	ho_ten, chuc_vu         XacThuc copies these onto PhienHienTai for identity's OWN header and
//	                        its own /sessions/current route. None of the four guards
//	                        (RequirePermission, AnyAuthenticated, CitizenOnly, Public) reads a
//	                        name, so sending one would put a citizen-grade personal datum into
//	                        four more processes and four more log pipelines to be used by
//	                        nothing (rule 3, invariant 1). Widening toward `ho_ten` is also
//	                        BLOCKED by an unanswered question: open question #11 (mask a staff
//	                        member's mobile number to other staff, or not) has to be settled
//	                        first, because it decides what "staff personal data" is allowed to
//	                        cross a boundary at all.
//	ma (the business code)  NO LONGER OMITTED — it is field 3 below, added 2026-09-22. The note
//	                        that stood here said "whoever adds it states which audit path reads
//	                        it", so: the four catalogue write routes of comms, documents,
//	                        finance and petitions (internal/http/danh_muc_ghi.go,
//	                        `nguoiThucHien`) put it in `audit_log.actor_id`. Why it stopped
//	                        being optional-in-practice is measured, not argued — see field 3.
//	sid                     The session id is credential-adjacent — XacThuc's own alert logs a
//	                        one-way fingerprint of it rather than the value, because an alert
//	                        carrying a working handle to a session is a second copy of it. It
//	                        earns its place on PhienHienTai for ONE job, ending one's own
//	                        session, and no other service does that job.
//	expiry                  Decided by the registry, re-read on the next request anyway. A
//	                        caller holding an expiry is a caller one edit away from deciding
//	                        validity from it, which is the revocation hole this whole RPC exists
//	                        to avoid.
//	tenant_id               The caller already holds it: it is the commune it resolved from Host
//	                        and sent in "x-tenant-id", and the server refused the call outright
//	                        if the credential disagreed. Echoing it back would create a second
//	                        source for one fact and hand the caller a choice between two values
//	                        — and a choice on the isolation path is where a default grows.
//	kind                    Every principal from this RPC is staff. A field with one possible
//	                        value is a field every consumer stops checking. The caller sets
//	                        Kind = "staff" because it called the staff RPC.
//	roles                   XacThuc leaves authz.Principal.Roles empty ON PURPOSE: a role
//	                        carried on the principal means a role change takes effect only when
//	                        the session ends. permission_keys below is read live, per request,
//	                        which is the property that has to be kept.
message StaffPrincipal {
  // The INTERNAL id of the staff record — the same value as Staff.id, and NOT the business code
  // `ma`.
  //
  // THE DISTINCTION IS LOAD-BEARING and it has a known failure mode: identity's own permission
  // query matches on `nd.id` (service-identity/internal/store/checker.go, truyVanQuyenGoc), so
  // a principal carrying the business code matches no row, every permission check answers
  // false, and every guarded route returns 403 with nothing in the response, the logs or a test
  // to point at the cause.
  string staff_id = 1;

  // Every permission key this person holds in this commune, as of this request.
  //
  // FLAT KEYS, "<nhóm>.<việc>" — "task.extend", "admin.role". They are the SAME strings that sit
  // in `vai_tro_quyen.quyen_ma`, that authz.Perm carries, and that the Phân quyền screen shows.
  // There is deliberately no translation layer and no (subsystem, action) pair: these rights are
  // not a Cartesian product, and `task.approve` is deliberately not `task.extend` (rule 5,
  // invariant 3b).
  //
  // WHY THE KEYS TRAVEL AT ALL — THE EXPENSIVE DECISION OF THIS CONTRACT. authz.Checker asks one
  // question at guard time, "may this caller do this one thing". In identity that question is
  // answered by a local query. In the other four services there is no local query to make, and
  // there must not be one: rule 2 forbidden #2 forbids them a connection to identity's database.
  // That leaves two shapes, and the cost of the rejected one is per request of every screen:
  //
  //	keys here (chosen)  ONE hop per request. ~30 short strings on the wire.
  //	a second RPC        TWO hops per request — one to authenticate, one per guard to ask about
  //	                    one key. Same freshness, double the latency and double the failure
  //	                    surface on the hot path of every guarded route in four services.
  //
  // THIS DOES NOT COLLAPSE THE SPLIT service-identity/internal/http/routes.go ARGUES AT LENGTH,
  // and the difference is worth stating precisely because it looks like the same list. That file
  // keeps authz.Checker (DECIDES, one key at a time) apart from QuyenDoc (DESCRIBES the caller's
  // own keys, so the web can avoid drawing what the server would refuse), and the accident it
  // fears is a caller deciding access from a list drawn for a menu. Neither interface changes
  // here, and this is not that list: it is the grant set computed by the service that OWNS the
  // grants, inside the very request it authenticates, handed to that request's guard. The web's
  // menu still comes from identity's own route through QuyenDoc. What WOULD collapse the split
  // is storing this set anywhere that outlives the request.
  //
  // SO, THE ONE OBLIGATION ON THE CALLER: this set is scoped to the single request it
  // authenticated. It is never written into a token, never attached to a session, never cached
  // across requests, and never written to disk. A withdrawn role must stop working on the very
  // next request — the moment this set outlives one request it becomes a role embedded in a
  // token, which skills/session-and-token names as FORBIDDEN and which rule 5, invariant 4
  // exists to prevent.
  //
  // AN EMPTY LIST IS A REAL AND ORDINARY ANSWER: an account whose role was withdrawn, or which
  // never held one, holds no key. It means every RequirePermission route answers 403 while
  // AnyAuthenticated routes still serve — it does NOT mean "we could not find out". A server
  // that cannot read the grants must fail the RPC, never answer a principal with an empty list.
  //
  // Ordered, and the order carries no meaning beyond making one caller's responses comparable
  // between requests.
  repeated string permission_keys = 2;

  // The BUSINESS CODE of the staff record — `CB-00123`, the same value as Staff.ma and the one
  // the Danh bạ cán bộ screen shows. It is what an audit entry records as "who", and it is NOT
  // the value any permission check may be made with.
  //
  // WHY BOTH ARE ON THE WIRE, WHICH IS THE QUESTION THIS FIELD EXISTS TO ANSWER. The two
  // identifiers answer two different questions and one value cannot answer both:
  //
  //	staff_id (field 1)  DECIDES ACCESS. identity's grant query matches `nd.id`, so this is
  //	                    the only value a permission check can be made with.
  //	ma (this field)     RECORDS RESPONSIBILITY. `audit_log.actor_id` is read years later by a
  //	                    person handling a complaint or an inspection, and `CB-00123` means
  //	                    something to them without any lookup being alive. A ULID means nothing
  //	                    to anyone, and the RPC that could translate it (ResolveStaffNames)
  //	                    reads a table that may by then no longer hold the row.
  //
  // MEASURED, WHICH IS WHY IT IS HERE RATHER THAN STILL PLANNED (2026-09-22): the policy had
  // been written in a comment since the login path was built —
  // `service-identity/internal/app/dang_nhap.go:151`, `Subject: cb.Ma, // business code, never
  // the internal id` — and nothing enforced it. Four catalogue write routes built on 2026-09-22
  // put the internal id in `actor_id` instead, and no test turned red, because a comment is not
  // a check. `audit_log.actor_id` then held two kinds of identifier in one column, which is a
  // column nobody can query. The enforcement that was missing now exists:
  // `.claude/hooks/audit_actor_guard.py` and `tools/check_audit_actor.py`.
  //
  // ADDITIVE, AND DELIBERATELY NOT REQUIRED (rule 2, forbidden #4). This message already has
  // consumers — the staffauth middleware of four services — and a consumer built before this
  // field simply does not read it. THE COST OF THAT CHOICE, STATED RATHER THAN HIDDEN: during a
  // rolling deploy, a NEW service talking to an OLD identity receives an empty `ma`, and every
  // AUDITED WRITE of that service then refuses with 500 rather than writing an entry attributed
  // to nobody (core/audit.Entry.validate). Reads and unaudited routes keep serving. That is the
  // narrow failure and it is the intended one: rule 6 does not permit a business write whose
  // trail cannot name who made it, and a silent fallback to the internal id would recreate the
  // very defect this field was added to close.
  string ma = 3;
}

message ResolveStaffPrincipalRequest {
  // The signed session token exactly as the browser presented it — the value of the
  // `vigov_session` cookie, verbatim, not parsed, not trimmed, not re-encoded by the caller.
  //
  // IT IS A CREDENTIAL, NOT DATA (rule 8). It never appears in a log line at either end, never
  // in an error message, never in an audit entry, and never in a metric label — at any level,
  // including debug. Anything that has to correlate two lines about one session uses a one-way
  // fingerprint, the way XacThuc's alert already does, never the value.
  //
  // AND NOTHING IN THE GENERATED CODE PROTECTS IT — measured on 2026-09-20, not assumed. The
  // generated String() prints this field in full, so `log.Info("req", "r", req)`, `%v` or `%+v`
  // on this message puts a WORKING session token into the log pipeline, where rule 8 says a
  // secret must never reach and from where it cannot be recalled. The `debug_redact` option was
  // tried and is a no-op in protobuf-go v1.36.12 — it was removed again rather than left in
  // place, because a marking that does nothing is worse than none: the next reader trusts it.
  // The protection is therefore a rule for humans: NEVER log this message, log the fields you
  // chose.
  //
  // THE CALLER DOES NOT VALIDATE IT FIRST. It does not hold the signing key, and a caller that
  // pre-checks anything about this string has started to build a second, weaker copy of the
  // decision this RPC exists to make — one that will disagree with the real one the first time
  // the token format changes.
  //
  // Empty is INVALID_ARGUMENT, not "no principal": a request with no credential must never
  // reach this RPC. See the status-code table on the RPC.
  string session_token = 1;

  // The address the BROWSER connected from, as the calling service observed it on its own
  // socket.
  //
  // WHY IT IS HERE: it exists for exactly one line of output — the security alert raised when a
  // credential's commune disagrees with the commune in metadata. Across this hop the server can
  // otherwise see only a pod address inside the cluster, which answers "which of our services
  // relayed it" and never "where was this probe from". XacThuc logs the real address today
  // (middleware.go, ipTu); dropping it would make the centralised alert strictly weaker than
  // the four scattered ones it replaces.
  //
  // IT IS A CLAIM AND MUST NEVER DECIDE ANYTHING. It is caller-supplied, so it is worth exactly
  // what the caller key is worth (ADR 0025: the key proves a call came from inside the
  // deployment, never which service). Rate-limiting on it, blocking on it, or storing it as the
  // audit trail's "from which IP" would be acting on a value nobody verified. The audit entry
  // for a business write is written by the service that observed the address itself, in its own
  // transaction (rule 6, invariant 3) — not from this echo.
  //
  // THE CALLER TAKES IT FROM ITS OWN SOCKET, NOT FROM X-Forwarded-For, for the reason spelled
  // out on ipTu: any client can set that header, and a forged address recorded with the
  // authority of a government record states that somebody acted from an address they never
  // used.
  //
  // "" IS VALID and means "not observed". The server logs the alert without it rather than
  // refusing the call: an authentication path that fails because a diagnostic field is missing
  // trades every staff member's access for a log line.
  string client_ip = 2;
}

// Wrapped, not a bare StaffPrincipal: adding a field later must not change the RPC signature.
message ResolveStaffPrincipalResponse {
  // ABSENT MEANS NO PRINCIPAL — the credential is not usable, for one of the reasons the RPC's
  // comment lists and deliberately does not distinguish.
  //
  // A MESSAGE RATHER THAN A SENTINEL STRING, so the two facts a principal is made of cannot be
  // half-set: there is no state in which an id arrives without its keys, or keys arrive without
  // an id. A caller checks presence once and is done.
  //
  // PRESENT WITH AN EMPTY permission_keys IS NOT THE SAME THING and callers must not merge the
  // two branches: it means a valid, live session held by somebody who currently holds no
  // permission — AnyAuthenticated serves them, RequirePermission refuses them. Merging it into
  // "no principal" would sign that person out instead of telling them they may not do this one
  // thing.
  StaffPrincipal principal = 1;
}

message ResolveCitizenSessionRequest {
  // The bearer token exactly as the Mini App presented it — the value after `Bearer ` in the
  // `Authorization` header, verbatim, not parsed, not trimmed, not re-encoded by the caller.
  //
  // IT IS A CREDENTIAL, NOT DATA (rule 8), and it substitutes for a WHOLE CITIZEN SESSION. It
  // never appears in a log line at either end, never in an error message, never in an audit
  // entry, never in a metric label, at any level including debug.
  //
  // AND NOTHING IN THE GENERATED CODE PROTECTS IT — the same measurement recorded on
  // `ResolveStaffPrincipalRequest.session_token` on 2026-09-20 applies unchanged: the generated
  // String() prints this field in full, and `debug_redact` is a no-op in protobuf-go v1.36.12.
  // The protection is a rule for humans: NEVER log this message, log the fields you chose.
  //
  // THERE IS NO SECOND FIELD, and in particular no `client_ip`. ResolveStaffPrincipal carries
  // one for exactly one line of output — the alert raised when a credential's commune disagrees
  // with the commune in metadata. THAT COMPARISON DOES NOT EXIST HERE and cannot: this RPC
  // carries no commune to compare against, because it is the call that establishes one
  // (ADR 0022). A field whose only consumer is an alert that cannot be raised would be a
  // caller-supplied address collected for nothing, which rule 3 does not permit.
  //
  // Empty is INVALID_ARGUMENT, not "no session". See the status-code table on the RPC.
  string session_token = 1;
}

// Wrapped, not a bare CitizenSessionPrincipal: adding a field later must not change the RPC
// signature.
message ResolveCitizenSessionResponse {
  // ABSENT MEANS NO SESSION — the token is not usable, for one of the reasons the RPC's comment
  // lists and deliberately does not distinguish.
  //
  // A MESSAGE RATHER THAN BARE STRINGS, so the facts cannot be half-set: there is no state
  // in which a citizen id arrives without the session id it was read from. A caller checks
  // presence once and is done.
  //
  // PRESENT WITH AN EMPTY `tenant_id` IS NOT THE SAME THING and callers MUST NOT merge the two
  // branches: it is a live session held by a citizen who has not chosen a commune yet (ADR 0005)
  // — the state the commune-picker screen is called in. Merging it into "no session" would sign
  // that citizen out at the exact moment they were about to choose.
  CitizenSessionPrincipal session = 1;
}

// CitizenSessionPrincipal is what the citizen edge learns about one request. Opaque, server-minted
// identifiers only — four of them since 08/10/2026, and never anything that is personal data.
//
// THE FOURTH FIELD, `zalo_account_id`, WAS ADDED ON THE OWNER'S DECISIONS OF 08/10/2026 (ADR 0080):
// a session whose phone is not verified yet may submit a petition, and that petition belongs to the
// session's Zalo account (`citizen_id` stays empty). Without the account on the principal, the
// owning service has nothing to record as the owner, nothing to filter a lookup on (rule 4,
// invariant 3) and no "who" for the trail (ADR 0045 §Ghi vết). It is a server-minted ULID like the
// other three, so the argument below — the edge type cannot carry personal data — still holds.
//
// It is the wire form of `core/httpx.CitizenSession`, field for field, and the two are meant to
// stay that way: the edge type refuses to be able to carry personal data, and a contract that
// could carry more would make that refusal a matter of the caller's discipline instead of a
// matter of the type. Read the comment on `core/httpx.CitizenSession` before adding anything
// here — it is the same argument and it is written out in full.
//
// NAMED `...Principal` TO SIT BESIDE StaffPrincipal AND TO BE READ AGAINST IT. A staff principal
// answers "who is acting and what may they do". This one answers "whose session, in which
// commune" and NOTHING about what may be done: a citizen identity is weak (rule 4) and grants
// nothing on its own. The shared suffix is there so the next person compares the two field lists
// and sees the missing permission set as a decision rather than an omission.
message CitizenSessionPrincipal {
  // The session id (sid) — the same role as StaffPrincipal's revocable session: it is what makes
  // a session REVOCABLE and it is what an audit entry quotes. IT NEVER DECIDES ACCESS.
  string session_id = 1;

  // The platform-wide opaque citizen identifier (ADR 0002), minted by the server. A phone number
  // cannot be derived from it.
  //
  // IT EXISTS SO RULE 4, INVARIANT 2 IS ACHIEVABLE: a citizen's identity comes FROM THE SESSION,
  // never from a request parameter. Every citizen-path query filters on this value AND on the
  // commune below.
  string citizen_id = 2;

  // The commune of this session — an ANSWER the server computed, never an input (see the note at
  // the top of this file, and ADR 0012 §B).
  //
  // "" IS A REAL ANSWER: the citizen is signed in but has chosen no commune yet (ADR 0005). The
  // caller maps it straight through to an empty `httpx.CitizenSession.TenantID`, where
  // `httpx.XaTuPhien` answers 401 for every business route. FILLING IN ANY DEFAULT HERE, OR IN
  // THE CALLER, IS RULE 1 FORBIDDEN #1 — one line that collapses isolation silently, with every
  // test still green.
  string tenant_id = 3;

  // The Zalo account that opened this session through the Mini App bridge — `tai_khoan_zalo.id`
  // (service-identity migration 0011, `@entity: ZaloAccount`), a ULID minted by identity. NEVER the
  // Zalo user id (personal data, stored only as a hash and never returned) and never a phone number.
  //
  // IT IS THE ACCOUNT'S "WHO" WHEN THE PHONE IS NOT VERIFIED — the trail and the idem subject of an
  // account-owned petition (ADR 0045 §Ghi vết: "mã tài khoản Zalo khi chưa có số"; migration 0011's
  // column note; owner, 08/10/2026, ADR 0080). A citizen has no staff-style business code: a citizen
  // audit entry records an opaque id with actor kind "citizen" (core/authz.Principal.Ma), and this
  // is that opaque id for the not-yet-verified case. No separate code is minted, by decision.
  //
  // "" IS A REAL ANSWER: a session that did not come through the bridge (`phien_cong_dan.tai_khoan_
  // zalo_id` NULL). A caller that needs an owner and finds BOTH this and `citizen_id` empty REFUSES —
  // it never substitutes the session id or anything else (fail closed).
  //
  // MAY BE SET BESIDE A NON-EMPTY `citizen_id`, and the two are not interchangeable: `citizen_id` is
  // the platform-wide person a verified phone names; this is one Zalo account in one Mini App (keyed
  // on (app_id, zalo user id)). Which of the two owns a record is the owning service's decision,
  // recorded with the record — never re-derived from whichever happens to be set today.
  string zalo_account_id = 4;
}

// CitizenIdentity is one citizen, once for the whole platform (ADR 0002).
//
// NAMED AFTER WHAT THE RECORD HOLDS, NOT AFTER THE PERSON — ADR 0023 decided this, and the
// reason has to travel with the name. The record holds exactly two things: an opaque
// identifier and a masked phone number. A message called `Citizen` is an open invitation for
// the next person to add `ho_ten`, `so_cccd`, `ngay_sinh`, and this is the one region of the
// model with NO tenant_id to contain the damage (ADR 0021, `@scope: cross-tenant`): a single
// subject holding identifying data for citizens of EVERY commune on the platform, with no
// commune boundary to limit who a mistaken query returns. Every heaviest obligation of Decree
// 13/2023 lands here at once.
//
// The name stops nobody adding a field. It makes adding one a sentence that has to be said
// out loud first, and that is the whole of what a name can do.
//
// Same name as the table it describes — `dinh_danh_cong_dan`,
// service-identity/migrations/0004_kenh_cong_dan.sql, marked `@entity: CitizenIdentity`.
message CitizenIdentity {
  string id = 1;
  // Phone is unique PLATFORM-WIDE. It is never returned unmasked unless the caller holds
  // explicit full-view permission, and every such read is audited.
  string phone_masked = 2;
}

// The link between a citizen and a commune, with the residence the citizen DECLARED for it.
message CitizenCommune {
  string citizen_id = 1;
  string tenant_id = 2;

  // WHAT THE CITIZEN DECLARED. It is NOT a legal status and NOT a verified fact — the store
  // keeps the declaration (`quan_he_cong_dan_xa.khai_cu_tru`) and whether an officer has
  // checked it (`trang_thai_xac_thuc`) in TWO separate columns, on purpose (ADR 0023 §A).
  // This contract carries only the first of those two facts today, because nothing reads the
  // second yet: a contract records what exists, not what is planned (ADR 0021, rule 4).
  //
  // A CONSUMER THEREFORE MUST NOT COUNT THIS AS A REGISTRATION. A report saying
  // "1.200 công dân thường trú" is read as 1.200 people holding a police registration; this
  // value only says 1.200 people typed that into an app.
  Capacity capacity = 3;

  // THE VALUES STAY IN VIETNAMESE, and that is ADR 0011's rule for enum VALUES, not a lapse
  // beside the English field names around them. Translating a name is a naming choice;
  // translating a VALUE asserts that the Vietnamese concept and the English word are the same
  // thing. Run ADR 0011's test — does reading this word wrongly get the PROCEDURE wrong, or
  // only the aesthetics?
  //
  // Under Luật Cư trú 2020, `thuong_tru` and `tam_tru` are states REGISTERED WITH THE POLICE:
  // they describe a registration, not where somebody actually lives. English
  // "permanent resident" describes the living, which is a different fact. A procedure that
  // requires the applicant to hold a registered `thuong_tru` in the commune is NOT satisfied
  // by "has lived here for years but never registered". Wrong procedure, not wrong aesthetics
  // — so the Vietnamese stays, spelled without diacritics.
  //
  // These are the same three strings the store CHECKs
  // (service-identity/migrations/0004_kenh_cong_dan.sql, quan_he_khai_cu_tru_hop_le). One
  // vocabulary from the column to the contract: translating at the API layer would leave the
  // API disagreeing with the database, or force migrating values on archival records (rule 7).
  enum Capacity {
    CAPACITY_UNSPECIFIED = 0;

    CAPACITY_THUONG_TRU = 1;   // đã đăng ký thường trú tại xã này
    CAPACITY_TAM_TRU = 2;      // đã đăng ký tạm trú tại xã này

    // NO DECLARATION EXISTS for this (citizen, commune) pair — nothing more, nothing less.
    //
    // WAS `CAPACITY_TRANSIENT` / "vãng lai", AND THAT WORD ASSERTED A FACT THE DATA DOES NOT
    // HOLD. "Vãng lai" means the person is physically present in the area without registering.
    // But this row is created the moment a citizen submits a report to a commune (ADR 0005),
    // and that includes somebody sitting in Hà Nội reporting a problem to a commune in Đà
    // Nẵng. The system does not know where the person is and has no way to find out — and a
    // status the data cannot support is a status somebody eventually counts (ADR 0023 §2).
    CAPACITY_CHUA_KHAI = 3;
  }
}

message BatchGetStaffRequest {
  // Duplicates are collapsed by the server. Order carries no meaning.
  //
  // AT MOST 200 ids per call. More than that is INVALID_ARGUMENT, never a silent truncation:
  // a truncated batch makes the caller render blank names for real rows and nothing reports
  // it. (This is deliberately unlike list pagination, where clamping `limit` to the maximum
  // is safe because the cursor carries on from there — here there is no cursor to carry on.)
  //
  // 200 is derived from the caller, not guessed: a list page is 20 rows by default
  // (.claude/skills/rest-api-design, §5) and one page can never need more distinct staff
  // than it has rows, so 200 leaves an order of magnitude of headroom and still covers the
  // ENTIRE staff roster of a commune-level unit in one call. An unbounded id list from the
  // caller is an unbounded query on the receiver.
  repeated string ids = 1;
}

// Wrapped, not a bare repeated Staff: adding a field later must not change the RPC signature.
message BatchGetStaffResponse {
  // FEWER ITEMS THAN IDS REQUESTED IS A VALID RESPONSE, and the order is NOT the order of
  // `ids`. The caller MUST map by Staff.id. Assuming index alignment, or assuming
  // len(items) == len(ids), is wrong silently — it attaches one person's name to another
  // person's record, which in an administrative file is a falsified record.
  //
  // An id is absent when: it does not exist, it is soft deleted, or it belongs to ANOTHER
  // commune than the one in the "x-tenant-id" metadata. The three are deliberately
  // indistinguishable in the response — telling them apart would leak that a record exists
  // in a commune the caller may not read.
  repeated Staff items = 1;
}

message ResolveStaffNamesRequest {
  // THE STAFF CODES an already-stored record carries — `nguoi_dung.ma`, spelled `CB-2026-7K3M9Q`.
  // Duplicates are collapsed by the server; order carries no meaning.
  //
  // WHY CODES AND NOT INTERNAL IDS, since this field held `ids` when the contract was first
  // written on 2026-09-22: this RPC exists to put a name beside a line of an archival record, and
  // the identifier those lines actually hold is the business code. `audit_log.actor_id` stores
  // `ma` — decided the same day, rule 6 invariant 8. A lookup keyed on the internal id would have
  // resolved nothing ever written, which is the one failure this RPC was built to prevent.
  //
  // The rename cost nothing because it was made before the first implementation and before the
  // first consumer; both halves were still unwritten. That window is closed now.
  //
  // AT MOST 200 codes per call — the same ceiling as BatchGetStaffRequest, and deliberately the
  // same NUMBER, so a caller that batches correctly for one batches correctly for both. More is
  // INVALID_ARGUMENT, never a silent truncation: there is no cursor to carry on from, so a clamped
  // batch makes real rows render blank with nothing reporting it.
  //
  // AN EMPTY LIST IS A VALID REQUEST AND ANSWERS WITH AN EMPTY RESPONSE. It is NOT "give me
  // everybody", and there is no spelling of this request that means that. It is deliberately not
  // INVALID_ARGUMENT either: a list page with no rows legitimately produces no codes, so this is
  // an ordinary call rather than a wiring fault.
  //
  // THERE IS NO SECOND FIELD, AND THAT IS THE DESIGN. No date range, no department, no "removed
  // only", no cursor, no flag. See the RPC comment: a predicate here turns a lookup into a listing,
  // in one line, with every existing test still green.
  //
  // `ma` AND NOT `codes`: it is the same string the Phân quyền screen shows and `nguoi_dung.ma`
  // stores, and StaffPrincipal already spells it `ma` (ADR 0011 keeps the Vietnamese term where
  // the mapping table has no English one).
  repeated string ma = 1;
}

// Wrapped, not a bare repeated StaffName: adding a field later must not change the RPC signature.
message ResolveStaffNamesResponse {
  // FEWER ITEMS THAN IDS REQUESTED IS A VALID RESPONSE, and the order is NOT the order of `ids`.
  // The caller MUST map by StaffName.id. Assuming index alignment, or assuming
  // len(items) == len(ids), attaches one person's name to another person's record — which in an
  // administrative file is a falsified record, not a display bug.
  //
  // AN ID IS ABSENT when it does not exist, or when it belongs to ANOTHER COMMUNE than the one in
  // "x-tenant-id". The two stay deliberately indistinguishable, exactly as in
  // BatchGetStaffResponse: telling them apart would leak that a record exists in a commune the
  // caller may not read.
  //
  // WHAT IS NO LONGER A REASON FOR ABSENCE IS THE WHOLE POINT OF THIS RPC. A soft-deleted record is
  // ANSWERED here, carrying its name and STAFF_RECORD_STANDING_REMOVED_FROM_DIRECTORY. That single
  // difference from BatchGetStaffResponse is why this message exists, and widening
  // BatchGetStaffResponse to match would undo the property that one of the two is safe to decide
  // from.
  repeated StaffName items = 1;
}

// StaffName is what it takes to print ONE person's name beside ONE line of history, and nothing
// else.
//
// NAMED AFTER WHAT IT HOLDS, NOT AFTER THE PERSON — the decision ADR 0023 made for
// `CitizenIdentity` over `Citizen`, for the same reason. A message called `HistoricalStaff`, or
// `Actor`, is an open invitation to add `chuc_vu`, `dien_thoai`, `email`, `bo_phan`. A message
// called `StaffName` makes each of those a sentence somebody has to say out loud first. The name
// stops nobody adding a field; that is the whole of what a name can do, and it is worth having.
//
// EVERY FIELD THAT IS NOT HERE IS ABSENT ON PURPOSE:
//
//	dien_thoai, email   Contact details, and NOT NEEDED TO READ A RECORD — which is the entire
//	                    purpose of this message, and rule 3, invariant 6 gives only the fields
//	                    actually needed. For somebody who has left the authority they are worse than
//	                    unnecessary: there is no reason to hold a former employee's contact details
//	                    open to four more services and their log pipelines. Open question #11
//	                    unmasked staff contact details on a commune's OWN INTERNAL SCREENS on
//	                    2026-09-22. It did not put them on this boundary, and it is not read as
//	                    having done so.
//	chuc_vu, bo_phan    The position and department AS THEY ARE TODAY — which is precisely not the
//	                    position the person held when they acted. Printing today's title beside a
//	                    2026 act states something false about an administrative record, and it is
//	                    believed because it came from the system. A historical title is a fact the
//	                    RECORD would have to carry; no lookup can reconstruct it.
//	roles               An authorisation-adjacent fact with no part in printing a name, and one a
//	                    caller would eventually decide from. BatchGetStaff carries it for callers
//	                    asking the membership question.
//	tenant_id           The caller already holds it: it is the commune it sent in "x-tenant-id", and
//	                    an id from any other commune is absent from this response. Echoing it back
//	                    would create a second source for one fact on the isolation path, and a
//	                    second source is where a disagreement gets settled by guessing.
//	ma                  The business code. Wanted eventually — an inspector matching this line to a
//	                    personnel file would use it — and NOT here, because nothing reads it today
//	                    and a contract records what exists rather than what is planned (ADR 0021).
//	                    Adding a field later is additive and costs nothing; removing one costs a
//	                    permanent `reserved`. Whoever adds it names the screen that reads it.
message StaffName {
  // Echoed from the request. It is the KEY the caller maps by — never a position.
  //
  // THE BUSINESS CODE `nguoi_dung.ma`, the same value `audit_log.actor_id` stores (rule 6,
  // invariant 8) and the same value StaffPrincipal.ma carries. NOT the internal id: Staff.id and
  // StaffPrincipal.staff_id are a different identifier with a different job — they decide
  // AUTHORISATION, this one records RESPONSIBILITY, and a reader of an archival line needs the
  // second.
  //
  // ECHOED SO THE CALLER CAN MAP, and echoed as the SAME KIND of value it sent. A response that
  // echoed the internal id would force every caller to hold a second table just to join the answer
  // back onto the line it asked about — and the caller has no way to build that table.
  string ma = 1;

  // The person's full name, exactly as `nguoi_dung.ho_ten` holds it.
  //
  // IT IS PERSONAL DATA (rule 3) and it is here because a record that names nobody answers nothing
  // when an inspection asks who handled a file. It is the ONE piece of personal data on this
  // contract, and the RPC comment carries the argument for it.
  //
  // `full_name` AND NOT `ho_ten`: the contract surface is English (ADR 0011), and unlike `linh_vuc`
  // this is not a Vietnamese administrative term with no English equivalent — a person's full name
  // is the same fact in both languages, so naming it in English asserts nothing.
  //
  // NEVER EMPTY IN AN OK RESPONSE. `nguoi_dung.ho_ten` is NOT NULL, so an empty string here is a
  // contract fault and never "this person has no name" — a caller that renders it as a blank has
  // printed an unattributed line onto an archival record.
  string full_name = 2;

  // WHETHER THIS STAFF RECORD IS STILL IN THIS COMMUNE'S DIRECTORY — nothing more.
  //
  // WHY THE FIELD EXISTS: without it this RPC is a wider BatchGetStaff, and a caller eventually
  // decides "this id resolved, so this person can be assigned work" — about a record that resolved
  // PRECISELY BECAUSE it had been removed.
  //
  // READ THE VALUES EXACTLY AS THEY ARE NAMED. They describe the RECORD, not the person's
  // employment, and that is not pedantry — see StaffRecordStanding for what the data does and does
  // not hold.
  //
  // NEVER UNSPECIFIED IN AN OK RESPONSE. An item with an unspecified standing is a contract fault,
  // not "we could not find out": the server answers it from one nullable column it has already
  // read. THE ZERO VALUE IS UNSPECIFIED RATHER THAN A BOOL'S `false` ON PURPOSE — a bool would make
  // a forgotten assignment silently claim one of the two real answers, and on this field one of
  // them is a statement about a person, printed on a government screen.
  StaffRecordStanding standing = 3;
}

// StaffRecordStanding says whether a staff RECORD is still in its commune's directory. IT DOES NOT
// SAY WHETHER THE PERSON STILL WORKS THERE, and the distinction is why this enum is worded as it is
// rather than as "đang công tác / không còn công tác".
//
// OPEN QUESTION #10 (decided 2026-09-22) SPLIT ONE BUTTON INTO TWO OPERATIONS: retirement and
// transfer are a LOCK and the person STAYS in the directory; a duplicated row is a SOFT DELETE. So
// under that decision a soft-deleted record is a row that should never have existed — and the
// PERSON named on it may be perfectly current under their other row. Labelling that record "không
// còn công tác" would state, on a government screen, that somebody had left when they had not.
//
// AND FOR OLDER ROWS THE DATA CANNOT TELL THE TWO APART AT ALL. Question #10's own `reversal_cost`
// records it: before that date there was ONE button, so a deleted row may be a genuine departure or
// a duplicate, and no column distinguishes them afterwards. An enum naming an employment status
// would therefore assert a fact the data does not hold — the failure ADR 0023 §2 names, where a
// status the data cannot support is a status somebody eventually counts.
//
// SO THERE ARE TWO VALUES AND NOT THREE. A LOCKED account is IN_DIRECTORY: question #10 decided that
// somebody who retires is locked and stays listed, and `nguoi_dung.dang_hoat_dong` is ALSO what a
// temporary suspension sets — one column, two meanings, so it cannot carry a third value here
// honestly either. What the caller gets is exactly what the data holds: `deleted_at`.
//
// THE VALUES ARE IN ENGLISH, unlike WorkKind and DeadlineKind, and ADR 0011's test is what decides
// it. Those two carry the exact strings a COLUMN stores, so translating them would be a second
// spelling of a stored value and a lookup on the wrong spelling finds no row. This enum stores
// nothing — it is derived per request from `deleted_at IS NULL` — so there is no Vietnamese value
// being translated and no procedure to get wrong. The Vietnamese sentence a screen prints is the
// CALLER's wording, not this contract's.
enum StaffRecordStanding {
  STAFF_RECORD_STANDING_UNSPECIFIED = 0;

  // The record is in this commune's staff directory today.
  //
  // IT SAYS NOTHING ABOUT WHETHER THE ACCOUNT IS USABLE. A locked account is still IN the
  // directory (question #10), and a caller needing "may this person be assigned work" asks
  // ResolveAssignableStaff, whose predicate is the one that answers it. (NOT BatchGetStaff: its
  // predicate is the register's, and it answers locked and account-less people as present.)
  STAFF_RECORD_STANDING_IN_DIRECTORY = 1;

  // The record has been removed from the directory — `nguoi_dung.deleted_at` is set. The row itself
  // is still there (rule 7: soft delete, never destruction), which is the only reason the name can
  // be answered at all.
  //
  // WHAT A CALLER MAY SAY FROM IT: that this staff RECORD is no longer in the commune's directory.
  // WHAT IT MAY NOT SAY: that the person left, retired, or was dismissed. See the comment on this
  // enum for why the data does not support that sentence.
  STAFF_RECORD_STANDING_REMOVED_FROM_DIRECTORY = 2;
}

message ResolveAssignableStaffRequest {
  // THE STAFF CODES the caller is about to write as holders of work — `nguoi_dung.ma`, spelled
  // `CB-00123`, the value Principal.Ma carries and every holder check compares with. NOT the
  // internal id: the record being written stores the code, so the code is what has to be verified.
  //
  // `ma` AND NOT `codes`, for the reason ResolveStaffNamesRequest.ma gives: the same string
  // `nguoi_dung.ma` stores and StaffPrincipal.ma carries (ADR 0011).
  //
  // Duplicates are collapsed by the server; order carries no meaning. A blank string matches no row
  // and is simply absent from the answer.
  //
  // AT MOST 50 codes per call. More is INVALID_ARGUMENT, never a silent truncation — a clamped
  // batch would answer real, assignable people as "not assignable" with nothing reporting it.
  //
  // 50 IS DERIVED FROM THE CALLERS, not from BatchGetStaff's 200: this is asked at the moment of an
  // ASSIGNMENT, and one assignment names one assignee (a petition) or a handful of co-handlers (a
  // task, a document). 50 is an order of magnitude over that and still bounds the query on the
  // receiver. A caller that genuinely needs more is doing something that is not an assignment —
  // listing the assignable roster, which is GET /api/v1/staff-directory's job.
  //
  // AN EMPTY LIST IS A VALID REQUEST AND ANSWERS EMPTY. It is NOT "everyone assignable" and there is
  // no spelling of this request that means that.
  //
  // THERE IS NO SECOND FIELD, AND THAT IS THE DESIGN. No department, no role, no cursor: a predicate
  // here turns a verification into a roster listing with no permission guarding it.
  repeated string ma = 1;
}

// Wrapped, not a bare repeated string: adding a field later must not change the RPC signature.
message ResolveAssignableStaffResponse {
  // The requested codes that satisfy the predicate on the RPC comment — a SUBSET of the request,
  // each at most once, in no meaningful order. The caller checks membership by value.
  //
  // A CODE IS ABSENT when it does not exist, is soft deleted, has no account, is locked, or belongs
  // to ANOTHER COMMUNE than the one in "x-tenant-id". The five are deliberately indistinguishable,
  // and the caller treats every one of them the same way: refuse the assignment.
  //
  // THE RESPONSE NEVER CARRIES A CODE THAT WAS NOT REQUESTED. A caller should treat one as a contract
  // fault, not as an extra assignee.
  repeated string assignable_ma = 1;
}

message ResolveLiveOrgUnitsRequest {
  // THE ORG-UNIT IDS the caller is about to write — identity's `bo_phan.id`, the value
  // service-petitions stores in `bo_phan_id` and `co_quan_chu_tri_id`. NOT `bo_phan.ma` (the slug):
  // the record being written stores the id, so the id is what has to be verified.
  //
  // Duplicates are collapsed by the server; order carries no meaning. A blank string matches no row
  // and is simply absent from the answer.
  //
  // AT MOST 50 ids per call — the same ceiling as ResolveAssignableStaffRequest.ma, from the same
  // derivation: one assignment names one unit and perhaps a lead unit. More is INVALID_ARGUMENT,
  // never a silent truncation.
  //
  // AN EMPTY LIST IS A VALID REQUEST AND ANSWERS EMPTY. It is NOT "every live unit".
  //
  // THERE IS NO SECOND FIELD, AND THAT IS THE DESIGN: a predicate here turns a verification into a
  // listing of the org chart.
  repeated string ids = 1;
}

// Wrapped, not a bare repeated string: adding a field later must not change the RPC signature.
message ResolveLiveOrgUnitsResponse {
  // The requested ids that are live `bo_phan` rows of this commune — a SUBSET of the request, each at
  // most once, in no meaningful order. The caller checks membership by value.
  //
  // AN ID IS ABSENT when it does not exist, is soft deleted, or belongs to ANOTHER COMMUNE than the
  // one in "x-tenant-id". The three are deliberately indistinguishable (rule 1), and the caller treats
  // every one of them the same way: refuse the write.
  repeated string live_ids = 1;
}

message ResolveStaffOrgUnitsRequest {
  // The staff BUSINESS CODE — `nguoi_dung.ma`, the value authz.Principal.Ma carries. The caller sends
  // ITS OWN principal's code, taken from the session and never from a request parameter.
  //
  // `ma` AND NOT `code`, for the reason ResolveStaffNamesRequest.ma gives (ADR 0011).
  //
  // Empty is INVALID_ARGUMENT — see the status-code table on the RPC.
  string ma = 1;
}

// Wrapped, not a bare repeated string: adding a field later must not change the RPC signature.
message ResolveStaffOrgUnitsResponse {
  // The live org units this person sits in — identity's `bo_phan.id`, the same value
  // service-petitions stores in `bo_phan_id`, so the caller compares by value with no translation.
  //
  // AT MOST ONE ELEMENT TODAY: `nguoi_dung.bo_phan_id` is a single nullable column. Repeated for the
  // reason `Staff.roles` is: the schema is the narrower fact of the two, and a caller written against
  // a list keeps working the day a person can sit in two units. A caller must not assume more than
  // one, and must not assume at least one.
  //
  // EMPTY IS AN ORDINARY ANSWER — no unit, unknown code, removed record, removed unit — see the RPC.
  // It means the unit clause of the caller's filter matches nothing. It never means "every unit".
  repeated string org_unit_ids = 1;
}

message ResolveOrgUnitNamesRequest {
  // THE ORG-UNIT IDS an already-stored record carries — identity's `bo_phan.id`, the value
  // service-petitions stores in `bo_phan_id` and `co_quan_chu_tri_id`. Duplicates are collapsed by
  // the server; order carries no meaning; a blank string matches nothing and is absent.
  //
  // AT MOST 200 ids per call — the ResolveStaffNames ceiling, and the same number on purpose, so a
  // caller printing a register batches identically for names of people and names of units. More is
  // INVALID_ARGUMENT, never a silent truncation.
  //
  // AN EMPTY LIST IS A VALID REQUEST AND ANSWERS EMPTY. It is NOT "every unit".
  //
  // THERE IS NO SECOND FIELD, AND THAT IS THE DESIGN: a predicate here turns a lookup into a listing
  // of the org chart, removed units included.
  repeated string ids = 1;
}

// Wrapped, not a bare repeated OrgUnitName: adding a field later must not change the RPC signature.
message ResolveOrgUnitNamesResponse {
  // FEWER ITEMS THAN IDS REQUESTED IS A VALID RESPONSE, and the order is NOT the order of `ids`.
  // The caller MUST map by OrgUnitName.id — assuming index alignment prints one unit's name on
  // another unit's line of an archival register.
  //
  // AN ID IS ABSENT when it names no row, or a row of ANOTHER COMMUNE than the one in
  // "x-tenant-id" — deliberately indistinguishable (rule 1). A soft-deleted unit is NOT absent: it
  // is answered with RECORD_STANDING_REMOVED, which is the point of this RPC.
  repeated OrgUnitName items = 1;
}

// OrgUnitName is what it takes to print ONE unit's name beside ONE line of a record, and nothing
// else. Named after what it holds (the ADR 0023 discipline StaffName follows): no parent, no slug,
// no ordering, no staff count — none is needed to print a line, and each is a sentence somebody has
// to say out loud before it is added.
message OrgUnitName {
  // Echoed from the request — the KEY the caller maps by, never a position. `bo_phan.id`.
  string id = 1;

  // The unit's name exactly as `bo_phan.ten` holds it TODAY (upper-case by convention). `name` and
  // not `label`: `bo_phan.ten` is a proper name, the distinction kb/00-foundation/
  // ubiquitous-language.md draws between `ten` and `nhan`.
  //
  // NEVER EMPTY IN AN OK RESPONSE: `bo_phan.ten` is NOT NULL, so an empty string is a contract fault.
  string name = 2;

  // Whether the unit is still on the commune's org chart. NEVER UNSPECIFIED in an OK response.
  RecordStanding standing = 3;
}

message ResolveTaskBlocLabelsRequest {
  // THE TASK-BLOC CODES an already-stored record carries — `khoi_nhiem_vu.ma` (`khoi-uy-ban`), the
  // value service-petitions stores in `nhiem_vu.khoi`. `ma` and not `codes`, for the reason
  // ResolveStaffNamesRequest.ma gives (ADR 0011).
  //
  // Duplicates are collapsed; order carries no meaning; a blank string is absent. AT MOST 200 codes
  // per call — the ResolveStaffNames ceiling, far above a catalogue capped at 100 rows
  // (store.TranDanhMucKhoiNhiemVu). More is INVALID_ARGUMENT, never a silent truncation. An empty list
  // answers empty — NOT "the whole catalogue", which is GET /api/v1/task-blocs' job. No second field.
  repeated string ma = 1;
}

// Wrapped, not a bare repeated TaskBlocLabel: adding a field later must not change the RPC signature.
message ResolveTaskBlocLabelsResponse {
  // Fewer items than codes is ORDINARY; order is meaningless; map by TaskBlocLabel.ma. A code is
  // absent when it names no row or a row of another commune — indistinguishable (rule 1). A removed
  // code is answered, flagged RECORD_STANDING_REMOVED.
  repeated TaskBlocLabel items = 1;
}

// TaskBlocLabel is what it takes to print one bloc's label beside one task, and nothing else.
message TaskBlocLabel {
  // Echoed from the request — the KEY the caller maps by. `khoi_nhiem_vu.ma`.
  string ma = 1;

  // The label exactly as `khoi_nhiem_vu.nhan` holds it TODAY (`Khối Uỷ ban`). `label` because the
  // column is `nhan` (ubiquitous-language.md). NEVER EMPTY in an OK response: the column is NOT NULL.
  string label = 2;

  // Whether the catalogue row is still in the catalogue (`deleted_at IS NULL`). A row switched off
  // with `dang_dung = false` is LIVE. NEVER UNSPECIFIED in an OK response.
  RecordStanding standing = 3;
}

// RecordStanding says whether a commune's reference ROW (an org unit, a catalogue entry) has been
// soft deleted — `deleted_at` and nothing else. It is derived per request and stored nowhere, so
// its values are English (ADR 0011's test, as for StaffRecordStanding).
//
// SEPARATE FROM StaffRecordStanding ON PURPOSE: that enum carries a long argument about what a
// removed STAFF record does and does not say about a person, and none of it applies to a unit or a
// bloc. One enum for both would make either argument read as if it covered the other.
//
// THE ZERO VALUE IS UNSPECIFIED RATHER THAN A BOOL'S `false`: a forgotten assignment must be loud,
// not silently claim one of the two real answers.
enum RecordStanding {
  RECORD_STANDING_UNSPECIFIED = 0;

  // The row is live: `deleted_at IS NULL`.
  RECORD_STANDING_LIVE = 1;

  // The row has been soft deleted (rule 7: the row is kept, which is the only reason it can be
  // answered). A caller may say the unit / entry is no longer in use; it may not decide anything.
  RECORD_STANDING_REMOVED = 2;
}

message ResolveLiveOrgUnitCodesRequest {
  // THE ORG-UNIT BUSINESS CODES a caller holds from outside the system — `bo_phan.ma`, the slug a
  // clerk types into an import spreadsheet. `ma` and not `codes` (ADR 0011).
  //
  // Duplicates are collapsed; order carries no meaning; a blank string is absent. AT MOST 200 codes
  // per call; more is INVALID_ARGUMENT, never a silent truncation. An empty list answers empty — NOT
  // "every live unit". No second field.
  repeated string ma = 1;
}

// Wrapped, not a bare map: adding a field later must not change the RPC signature.
message ResolveLiveOrgUnitCodesResponse {
  // One item per requested code that a LIVE unit of this commune carries, each code at most once, in
  // no meaningful order; map by OrgUnitCodeMatch.ma. A code is ABSENT when it names no row, a removed
  // row, or a row of another commune — one answer, and the caller refuses every one of them.
  // The response never carries a code that was not requested.
  repeated OrgUnitCodeMatch items = 1;
}

// OrgUnitCodeMatch pairs a requested unit code with the id of the live unit carrying it.
message OrgUnitCodeMatch {
  // Echoed from the request — the KEY the caller maps by. `bo_phan.ma`.
  string ma = 1;

  // The live unit's `bo_phan.id` — the value the caller stores. NEVER EMPTY in an OK response.
  string id = 2;
}

message ListCitizenCommunesRequest { string citizen_id = 1; }
message ListCitizenCommunesResponse { repeated CitizenCommune items = 1; }

message AdvanceWorkingHoursRequest {
  // The instant the count starts from. AN INSTANT, not a local wall-clock time.
  //
  // IT CARRIES THE CALLER'S MARK, AND THE MARK BELONGS TO THE CALLER. ADR 0007, decision 5 says
  // the mark is reception and not assignment — and this field is deliberately NOT named
  // `received_at`, because "reception" is a business event of the calling service and a contract
  // is named for what the data IS (ADR 0017). A `Văn bản đến` and a `Phản ánh` reach this field
  // through two different business events; the arithmetic is the same one.
  //
  // NOT COMPARED WITH `now`, ON PURPOSE. A document that arrived yesterday and is registered
  // today counts from yesterday — an ordinary administrative fact, not a mistake. A server that
  // clamped this forward to `now` would silently move a commitment the caller had already fixed.
  //
  // UNSET IS INVALID_ARGUMENT. There is no "count from now" default: a default here makes the
  // deadline depend on when the call happened to be made rather than on when the authority
  // received the file, and a default on a path that produces a citizen-facing commitment is the
  // same class of mistake as a default on the isolation path.
  google.protobuf.Timestamp count_from = 1;

  // The amounts of WORKING time to advance, in whole working hours. ADR 0007's table holds
  // 2, 8, 16, 24, 40 and 168.
  //
  // PLURAL BECAUSE ONE INTAKE HAS MORE THAN ONE DEADLINE — not as an application of ADR 0012's
  // batching default, whose reasoning (a list screen, one round trip per row) has no purchase
  // here. ADR 0007's table gives every row TWO deadlines, `Tiếp nhận` and `Xử lý xong` — 2 hours
  // and 16 hours for an `An ninh trật tự` report — counted from the SAME instant against the
  // SAME calendar. A singular RPC would make one intake two hops and give the second hop the
  // chance to read a calendar the first one did not.
  //
  // AN INTEGER OF HOURS, NOT A google.protobuf.Duration, and the type is the safety. A Duration
  // means wall-clock elapsed time everywhere else it appears, so `16h` in a Duration reads as
  // "sixteen hours later" — precisely the answer rule 10, forbidden #2 forbids and this whole
  // RPC exists to prevent. Here the unit sits in the field NAME, where it cannot be mistaken for
  // an offset. WHOLE HOURS because that is what ADR 0007's table holds; a commune needing 90
  // minutes is a change to what a deadline MEANS, which belongs to ADR 0007 and would add a
  // field here rather than reinterpret this one.
  //
  // ZERO IS INVALID_ARGUMENT, and this is the cheap one to get wrong. An SLA that was never
  // configured arrives here as a zero, and a zero answered politely returns `count_from` itself
  // — a record due at the instant it was received, which every report downstream then reads as
  // "already late". A missing configuration must fail loudly in the caller that owns it.
  //
  // AT MOST 20 ENTRIES; above that INVALID_ARGUMENT, NEVER a silent truncation — the same reason
  // BatchGetStaffRequest gives: there is no cursor to carry on from, and a truncated answer
  // stores an administrative record with one of its two commitments missing. 20 is derived from
  // the caller rather than guessed: ADR 0007's table needs two per record, so this leaves an
  // order of magnitude of headroom.
  //
  // AT MOST 2 000 PER ENTRY; above that INVALID_ARGUMENT and deliberately NOT
  // FAILED_PRECONDITION. An ordinary working year is 8 hours × 5 days × 52 weeks = 2 080, so
  // nothing above this ceiling can be delivered inside the horizon on `reached_at` by any week a
  // commune actually works — which makes it a fault in the CALLER by construction rather than a
  // fault in the calendar. Answering it with the configuration code would send an operator to
  // read a calendar that is perfectly correct. ADR 0007's largest real value is 168.
  //
  // DUPLICATES ARE COLLAPSED by the server and the order carries no meaning. Map the response by
  // `working_hours`, never by position.
  repeated uint32 working_hours = 2;
}

// Wrapped, not a bare repeated WorkingHoursReached: adding a field later must not change the
// RPC signature.
message AdvanceWorkingHoursResponse {
  // ONE ITEM PER DISTINCT `working_hours` REQUESTED — ALL OF THEM, OR THE CALL FAILS.
  //
  // THERE IS NO PARTIAL SUCCESS, and that is the OPPOSITE discipline from BatchGetStaffResponse
  // above, on purpose. There, a missing id is an ordinary answer, and telling the three reasons
  // apart would leak that a record exists in a commune the caller may not read. Here every entry
  // in one call is counted against ONE calendar for ONE commune, so anything that stops one
  // entry stops every entry — and a response holding one of two amounts would let a petition be
  // stored carrying its `Tiếp nhận` commitment and no `Xử lý xong` commitment, a half-processed
  // administrative file of exactly the kind rule 2, invariant 6 exists to forbid.
  // 0006_lich_lam_viec.sql makes the same choice for the same reason: three tables in one
  // transaction, all or none.
  //
  // MAP BY `working_hours`, NOT BY POSITION. Duplicates in the request are collapsed, so
  // len(items) can be smaller than len(working_hours) and an index is never a key.
  repeated WorkingHoursReached items = 1;
}

// One requested amount of working time, and the instant this commune reaches it.
message WorkingHoursReached {
  // Echoed from the request. It is the KEY the caller maps by — never a position.
  uint32 working_hours = 1;

  // The EARLIEST instant at which this commune has been open for `working_hours` since
  // `count_from`.
  //
  // "EARLIEST" IS ARITHMETIC, NOT A POLICY, and it is written down because the alternative is a
  // silent off-by-one-session: if the count runs out exactly at 11:30 and the afternoon session
  // opens at 13:30, the answer is 11:30. Returning 13:30 would hand the commune two hours nobody
  // granted it — on every deadline that lands on a session boundary, and lunch is a session
  // boundary every working day.
  //
  // AN INSTANT, which is exactly the `TIMESTAMPTZ` the caller stores (ADR 0007, decision 1). The
  // caller stores this value as given; it does not re-render it through a zone of its own, and
  // it does not round it.
  //
  // THE HORIZON IS 366 DAYS AFTER `count_from`. An answer that would fall beyond it is
  // FAILED_PRECONDITION, not an answer — and the reason is the Vietnamese working year rather
  // than a wish to bound a loop. Tết and National Day arrangements, including làm bù, are
  // announced ONE YEAR AT A TIME (0006_lich_lam_viec.sql, on `ngay_lam_bu`), so a calendar is
  // only ever complete for about a year ahead. A count that walks past the last holidays anybody
  // entered does not fail — it returns a confident instant computed from a stretch of time with
  // no holidays in it, which is the worst of the available answers. Refusing also bounds the
  // server's walk, but that is the smaller of the two reasons.
  //
  // THE HORIZON DOES NOT MAKE THE CALENDAR COMPLETE, and no contract can. A count starting in
  // December and running into January is inside the horizon and still crosses a year whose
  // holidays may not be entered yet. That gap belongs to whoever operates the configuration
  // screen; it is named here so the next reader does not mistake the horizon for a guarantee.
  google.protobuf.Timestamp reached_at = 2;
}

message MeasureWorkingHoursRequest {
  // The spans to measure. 1 TO 500 ENTRIES, checked on what the caller SENT and before duplicates
  // are collapsed; empty or more is INVALID_ARGUMENT, never a silent truncation.
  //
  // DUPLICATES ARE COLLAPSED (a page of late records often shares a deadline) and the order carries
  // no meaning. Map the response by `span` — both instants compared as instants (seconds and
  // nanos) — never by position.
  //
  // AN UNSET ENTRY IS INVALID_ARGUMENT, never skipped: skipping it would return fewer items than
  // asked for, which this contract defines as a fault.
  repeated WorkingTimeSpan spans = 1;
}

// Two instants, in order. Used as the request entry AND echoed as the response key, so the caller
// maps by the very value it sent.
//
// INSTANTS, not wall-clock times: the zone is applied inside the server, once, as for every other
// working-hours RPC here. Neither is compared with `now`.
message WorkingTimeSpan {
  // Where the measurement begins — for lateness, the record's STORED deadline exactly as stored.
  // UNSET or invalid is INVALID_ARGUMENT: there is no "from now" default, for the reason
  // AdvanceWorkingHoursRequest.count_from gives.
  google.protobuf.Timestamp start = 1;

  // Where it ends, EXCLUSIVE — for lateness, the caller's own `now`, the same one its `late` filter
  // compares against. UNSET or invalid is INVALID_ARGUMENT; there is no server-side "now": two
  // clocks one request apart make a record late by a negative amount. Before `start` is
  // INVALID_ARGUMENT; equal to `start` measures 0.
  google.protobuf.Timestamp end = 2;
}

// Wrapped, not a bare repeated item: adding a field later must not change the RPC signature.
message MeasureWorkingHoursResponse {
  // ONE ITEM PER DISTINCT SPAN REQUESTED — ALL OF THEM, OR THE CALL FAILS. Map by `span`;
  // len(items) can be smaller than the request because duplicates collapse.
  repeated WorkingTimeMeasured items = 1;
}

// One span and the working time of this commune inside it.
message WorkingTimeMeasured {
  // Echoed from the request — the KEY the caller maps by.
  WorkingTimeSpan span = 1;

  // The total length of [span.start, span.end) that falls inside this commune's working sessions,
  // in WHOLE SECONDS, truncated toward zero.
  //
  // SECONDS AND NOT HOURS, because lateness is not a whole number of hours: a record twenty minutes
  // late would read 0 — "not late" — in an hours field. Rounding to the hour, half-hour or minute is
  // a DISPLAY decision of the screen that prints it, and it is plain division of this number. The
  // calendar's own boundaries are whole seconds (this server reads every session as seconds since
  // midnight, service-identity domain.GioTrongNgay), so only
  // the caller's two endpoints can carry a fraction, and dropping it moves no session boundary.
  //
  // AN INTEGER AND NOT A google.protobuf.Duration, for the reason AdvanceWorkingHoursRequest gives
  // for `working_hours`: a Duration means wall-clock time everywhere else it appears, and
  // `deadline.Add(d)` would type-check. The unit sits in the field name. NEVER ADD IT TO AN INSTANT
  // (rule 10, forbidden #2); never store it (rule 10, invariant 3).
  //
  // ALWAYS SET IN AN OK RESPONSE; 0 is a real answer only when the span holds no working time (a
  // span inside a weekend, a night, or start == end). A commune with no calendar at all is
  // FAILED_PRECONDITION, never 0.
  uint64 working_seconds = 2;
}

// WorkKind is the kind of work one `sla` row applies to — FOUR BUSINESS DOMAINS, not four
// labels. `van-ban-den` and `don-thu` are `documents`' work; `phan-anh` and `nhiem-vu` are
// `petitions`'. That split is the whole reason the table belongs to neither of those services and
// lives in identity (ADR 0029).
//
// A NEW VALUE IS A DECISION, NOT A DEPLOYMENT — ADR 0029, stop condition #1. Adding one here
// adds a business domain to a commune's commitment table, and whoever needs it asks the user
// first. `don-thu` WAS SUCH A DECISION: the user lifted ADR 0039's exclusion on 2026-09-29, and
// identity migration 0016 admits the value into `sla.loai_viec`.
//
// APPEND-ONLY. Values are never renumbered or reused; the wire number is the contract, the
// position in this list is not. A server older than a value answers it INVALID_ARGUMENT (its
// exhaustive switch refuses unknowns) — never as one of the values it knows.
//
// THE VALUES STAY IN VIETNAMESE, following `CitizenCommune.Capacity` above and ADR 0011's rule
// for enum VALUES. They are the exact strings `sla.loai_viec` stores, spelled as the CHECK
// constraint admits them (migration 0008, `sla_loai_viec_hop_le`), and as
// service-identity/internal/domain.LoaiViec holds them. One vocabulary from the column to the
// contract: an English name here would be a second spelling of one value, and a lookup keyed on
// the wrong spelling finds no row — which this contract answers as "the commune has not
// configured it", the one wrong answer that looks exactly like a right one.
enum WorkKind {
  WORK_KIND_UNSPECIFIED = 0;

  WORK_KIND_VAN_BAN_DEN = 1; // sổ văn bản đến — service-documents
  WORK_KIND_PHAN_ANH = 2;    // phản ánh của công dân — service-petitions
  WORK_KIND_NHIEM_VU = 3;    // nhiệm vụ — service-petitions
  // sổ đơn thư (ADR 0039) — service-documents, like VAN_BAN_DEN. Stored as `don-thu`.
  WORK_KIND_DON_THU = 4; // vi-name-ok: enum VALUE mirroring sla.loai_viec 'don-thu' (ADR 0011), fourth member of the existing WORK_KIND_* family
}

// DeadlineKind names WHICH of a record's two clocks is being asked for.
//
// TWO CLOCKS, TWO SEPARATE ACTS THAT FIX THEM (ADR 0028, decision E), and the names are the names
// of the two columns they are stored in — `han_tiep_nhan` and `han_xu_ly_xong`
// (kb/00-foundation/ubiquitous-language.md). Vietnamese values for the reason WorkKind gives, and
// with a second reason of its own: the caller's job is to put this answer in the column of the
// same name, and two names for one column is where the two get swapped.
//
// SWAPPING THE TWO PRODUCES NO ERROR ANYWHERE. Both are instants, both are plausible, and the
// only difference is which commitment the authority made. That is why they are an enum and not a
// pair of positional fields.
//
// THERE IS NO THIRD VALUE, AND THREE CANDIDATES WERE REFUSED RATHER THAN OVERLOOKED. `sla` also
// holds `gio_sap_den_han`, `gio_bao_lanh_dao` and `gio_bao_chu_tich`:
//
//   `gio_sap_den_han` is a count of working hours REMAINING BEFORE the deadline, so producing it
//   means walking the calendar BACKWARD from an instant — arithmetic that does not exist in this
//   service and that nothing has specified. Reusing the forward walk would silently answer a
//   different question. (STILL TRUE FOR A PER-RECORD INSTANT, and it is why this enum has no third
//   value. A LIST FILTER by that column does not need the backward walk — ResolveDueSoonCutoff
//   answers it with a forward one from the caller's `now`, and its comment gives the equivalence.)
//
//   `gio_bao_lanh_dao` and `gio_bao_chu_tich` HAVE NO AGREED ANCHOR. The specification says it two
//   ways at once — §8 heads the columns "sau 24 giờ" without saying after what, while §9's
//   escalation job counts from the deadline being missed and DOUBLES the figure instead of reading
//   the second column. Nothing may compute an escalation from them until somebody answers "after
//   what", because a commune's leadership would be notified on a basis nobody chose and the
//   message would not say which.
//
//   (2026-09-29: the user decided the escalation job reads BOTH columns; the anchor this contract
//   takes is the missed deadline — see ResolveEscalationInstants. They are STILL not a third value
//   here: an escalation instant is a comparison the runner makes, not a clock of the record that
//   anybody stores.)
enum DeadlineKind {
  DEADLINE_KIND_UNSPECIFIED = 0;

  // `han_tiep_nhan` — the deadline for a member of staff to READ the record. Fixed when the row
  // is created, from `sla.gio_tiep_nhan`.
  DEADLINE_KIND_TIEP_NHAN = 1;

  // `han_xu_ly_xong` — the deadline for the matter to be SETTLED. Fixed at the act that settles
  // which field the record belongs to, from `sla.gio_xu_ly_xong` of that field (ADR 0028).
  DEADLINE_KIND_XU_LY_XONG = 2;
}

message ResolveDeadlinesRequest {
  // Which kind of work this record is. UNSPECIFIED is INVALID_ARGUMENT — there is no default kind
  // of work, and guessing one would read another domain's numbers.
  WorkKind work_kind = 1;

  // The field code this record belongs to, "" FOR THE DEFAULT ROW.
  //
  // "" IS A REAL REQUEST AND THE ORDINARY ONE ON THE CITIZEN CHANNEL: at the instant a citizen's
  // petition is created nobody knows the field yet, so ADR 0028 decision E reads `gio_tiep_nhan`
  // from the DEFAULT row. The schema refuses the empty string in the column outright
  // (`sla_linh_vuc_khong_rong`), so "" can only ever mean the default row and never a field whose
  // code is blank.
  //
  // A NON-EMPTY CODE FALLS BACK TO THE DEFAULT ROW when this commune has no row for it. That
  // fallback is the SPECIFICATION's, not this RPC's — `linh_vuc = null` is labelled "Mặc định cho
  // mọi lĩnh vực" — and without it a commune would have to type a row per field before one
  // deadline could be computed. The cost is on the RPC comment: a misspelled code is
  // indistinguishable from an unconfigured one, and the check belongs to the write path.
  //
  // THE SPELLING IS THE COLUMN'S. `linh_vuc` is not translated because no English name for it
  // exists in kb/00-foundation/ubiquitous-language.md, and ADR 0011 forbids inventing one here.
  // The value is a platform-level code (ADR 0026) and must reach `sla.linh_vuc` byte for byte.
  string linh_vuc = 2;

  // The instant both clocks count FROM. AN INSTANT, not a local wall-clock time.
  //
  // ONE START FOR BOTH CLOCKS, and that is ADR 0028 decision E, note 1: what differs between the
  // two is WHEN EACH IS FIXED, never where it starts counting. A petition classified three days
  // after it was sent still counts its `han_xu_ly_xong` from the moment the citizen pressed send —
  // the waiting is SUBTRACTED from the processing time, deliberately. A caller passing "now" at
  // classification time would hand the commune back the days it spent not classifying.
  //
  // UNSET IS INVALID_ARGUMENT. There is no "count from now" default, for the reason
  // AdvanceWorkingHoursRequest.count_from gives at length: a default makes the commitment depend
  // on when the call happened to be made rather than on when the authority received the file.
  //
  // NOT COMPARED WITH `now`, on purpose. A document that arrived yesterday and is registered today
  // counts from yesterday. The bounds that DO apply to a hand-entered instant are the caller's —
  // ADR 0028 decision F caps it at 7 days before the record is booked, and that is a rule about a
  // form field in `petitions`, not about this arithmetic.
  google.protobuf.Timestamp count_from = 3;

  // Which clocks this call is fixing. REQUIRED — an empty list is INVALID_ARGUMENT.
  //
  // THERE IS NO "ALL OF THEM" DEFAULT, and the RPC comment gives the full argument: always
  // returning both would hand a citizen-channel intake a `han_xu_ly_xong` computed from the
  // default row, rebuilding the ceiling ADR 0028 removed.
  //
  // AT MOST 2 ENTRIES, checked on what the caller SENT and before duplicates are collapsed — the
  // same discipline as BatchGetStaffRequest.ids, and here the ceiling is not a headroom estimate
  // but the number of values that exist. A third entry cannot be anything legitimate.
  //
  // DUPLICATES ARE COLLAPSED and the order carries no meaning. Map the response by `kind`, never
  // by position.
  //
  // AN UNSPECIFIED ENTRY IS INVALID_ARGUMENT, never skipped. Skipping it would return fewer items
  // than asked for, which this contract defines as a fault — so the caller would see a contract
  // error where the real fault was its own zero value.
  repeated DeadlineKind deadlines = 4;
}

// Wrapped, not a bare repeated Deadline: adding a field later must not change the RPC signature.
message ResolveDeadlinesResponse {
  // ONE ITEM PER DISTINCT `deadlines` ENTRY REQUESTED — ALL OF THEM, OR THE CALL FAILS.
  //
  // THERE IS NO PARTIAL SUCCESS, the same discipline AdvanceWorkingHoursResponse states and for a
  // sharper reason: both clocks of one call are read from ONE commune's table against ONE
  // commune's calendar, so anything that stops one stops both. A response carrying one of two
  // would let a record be stored with one commitment attached and the other silently absent —
  // and an absent instant reaches a caller as a zero `time.Time`, i.e. a deadline in year 1, i.e.
  // a record that is overdue the moment it is created.
  //
  // MAP BY `kind`, NOT BY POSITION. Duplicates in the request are collapsed, so len(items) can be
  // smaller than len(deadlines) and an index is never a key.
  repeated Deadline items = 1;
}

// One clock of one record, and the instant it falls due.
//
// NAMED `Deadline` AND NOT `ProcessingDeadline` ON PURPOSE. `ProcessingDeadline` is already taken:
// it is the entity name of an `sla` ROW — a commune's configured number of hours
// (service-identity/migrations/0008_sla.sql, `-- @entity: ProcessingDeadline`,
// kb/30-indexes/data-ownership.json). This message is the OTHER thing: one instant computed from
// such a row for one record. Two meanings behind one name is how a later reader comes to think
// this message is the configuration.
message Deadline {
  // Echoed from the request. It is the KEY the caller maps by — never a position — and it is what
  // tells the caller WHICH COLUMN to store `due_at` in.
  DeadlineKind kind = 1;

  // The instant this commitment falls due: the EARLIEST instant at which this commune has been
  // open for the configured number of working hours since `count_from`.
  //
  // AN INSTANT, which is exactly the `TIMESTAMPTZ` the caller stores (ADR 0007, decision 1). The
  // caller stores this value AS GIVEN: it does not re-render it through a zone of its own, does
  // not round it, and does not adjust it. Every zone question was settled inside the server, which
  // combines the commune's wall-clock calendar with a date in Asia/Ho_Chi_Minh — see the note on
  // `WorkingHoursReached.reached_at`. No offset is ever attached on this boundary.
  //
  // NEVER UNSET IN AN OK RESPONSE. An item with no `due_at` is a contract fault, not "no deadline
  // applies": the absence of a deadline is expressed by the call FAILING, never by an empty field
  // a caller could store as a zero instant.
  google.protobuf.Timestamp due_at = 2;

  // THERE IS NO `working_hours` FIELD, AND ITS ABSENCE IS A DECISION.
  //
  // A real consumer is coming: ADR 0028 §(a) has the Mini App telling a citizen "sẽ được xem
  // trong N giờ làm việc", and N cannot be recovered from an instant without the calendar. It is
  // NOT here because nothing reads it today, and a contract records what exists rather than what
  // is planned (ADR 0021) — the same reason `StaffPrincipal` carried no `ma` until a write path
  // actually read one, on 2026-09-22, at which point it was added. Adding a field later
  // is additive and costs nothing; removing one costs a permanent `reserved`.
  //
  // WHOEVER ADDS IT STATES WHICH SCREEN READS IT, and carries this warning with it: the figure is
  // for DISPLAY. It is a count of WORKING hours, and adding it to anything — `count_from`, `now`,
  // a `time.Duration` — walks straight through nights, weekends, `ngay_nghi_le` and `ngay_lam_bu`
  // while looking like it respected the unit. That is rule 10, forbidden #2, and it is the exact
  // shape this whole RPC exists to make unnecessary.
}

message ResolveDueSoonCutoffRequest {
  // Which kind of work the threshold is read for. UNSPECIFIED is INVALID_ARGUMENT — there is no
  // default kind of work, and guessing one reads another domain's number.
  WorkKind work_kind = 1;

  // The field code, "" FOR THE DEFAULT ROW — same meaning, same fallback and same caveat as
  // ResolveDeadlinesRequest.linh_vuc: a non-empty code with no row of its own falls back to the
  // default row (the specification's rule), so a misspelled code is indistinguishable from an
  // unconfigured one. `nhiem-vu` records carry no field today, so a task caller sends "".
  string linh_vuc = 2;

  // The instant "remaining" is measured from — the caller's `now` for the page it is building.
  //
  // SUPPLIED BY THE CALLER, AND UNSET IS INVALID_ARGUMENT. No server-side "now" default: the caller
  // compares the answer against the SAME `now` it uses for its `late` filter, and two clocks one
  // request apart put a record on neither list or on both.
  //
  // NOT COMPARED WITH `now` here; any instant is answerable.
  google.protobuf.Timestamp as_of = 3;
}

// Wrapped, not a bare Timestamp: adding a field later must not change the RPC signature.
message ResolveDueSoonCutoffResponse {
  // The LATEST instant by which at most `sla.gio_sap_den_han` working hours have elapsed since
  // `as_of`, through this commune's calendar. A deadline D is due soon ⟺ as_of < D <= this.
  //
  // AN INSTANT FOR A COMPARISON, NEVER FOR STORAGE. It moves with `as_of`. Writing it onto a record
  // builds a stored "is due soon" state — the class rule 10, invariant 3 forbids.
  //
  // NEVER UNSET IN AN OK RESPONSE. "Not configured" is FAILED_PRECONDITION, never an empty field a
  // caller could read as year 1 and filter every record out with.
  //
  // THERE IS NO `working_hours` FIELD, deliberately, for the reason ADR 0029 §Bổ sung gives and the
  // RPC comment restates: the number of hours invites arithmetic nobody outside this service may do.
  // A screen that wants to PRINT "72 giờ làm việc" is a real, later need; it is additive, and whoever
  // adds it names the screen and carries the warning on `Deadline`.
  google.protobuf.Timestamp due_soon_until = 1;
}

message ResolveEscalationInstantsRequest {
  // Which kind of work the late records are. UNSPECIFIED is INVALID_ARGUMENT — no default kind.
  WorkKind work_kind = 1;

  // The field code, "" FOR THE DEFAULT ROW — same meaning, same fallback and same caveat as
  // ResolveDeadlinesRequest.linh_vuc. One field per call: group late records by field.
  string linh_vuc = 2;

  // The deadlines the caller's records have MISSED — each the stored instant (`han_xu_ly_xong`,
  // `han_tiep_nhan`, a task's `han`) exactly as the record holds it. The count of each threshold
  // starts here; an instant outside working hours starts at the next working session (ADR 0007,
  // decision 8), the same walk as every deadline.
  //
  // NOT COMPARED WITH `now` here: any instant is answerable, and whether it is in fact missed is
  // the caller's comparison against its own `claimed_at`.
  //
  // DUPLICATES ARE COLLAPSED (many records share a deadline); order carries no meaning. Map the
  // response by `missed_deadline`, compared as an instant (seconds and nanos), never by position.
  //
  // 1 TO 500 ENTRIES. Empty or more is INVALID_ARGUMENT, never a silent truncation — a truncated
  // answer would leave late records un-escalated with nothing reporting it. 500 bounds one server
  // walk per entry; a commune with more distinct late deadlines in one field pages.
  repeated google.protobuf.Timestamp missed_deadlines = 3;
}

// Wrapped, not a bare repeated EscalationInstants: adding a field later must not change the RPC
// signature.
message ResolveEscalationInstantsResponse {
  // ONE ITEM PER DISTINCT `missed_deadlines` ENTRY — ALL OF THEM, OR THE CALL FAILS. Map by
  // `missed_deadline`; len(items) can be smaller than the request because duplicates collapse.
  repeated EscalationInstants items = 1;
}

// The two escalation instants of one missed deadline.
//
// NAMED FOR WHO IS TOLD, and the names are chosen against a real collision:
// kb/00-foundation/ubiquitous-language.md uses `Lãnh đạo` for Chủ tịch / Phó chủ tịch, while §8's
// "Báo lãnh đạo trực tiếp" means the head of the unit holding the work (§9: "báo lên trưởng bộ
// phận"). A field called `leader_due_at` would read as the leadership and invert the two levels.
message EscalationInstants {
  // Echoed from the request — the KEY the caller maps by.
  google.protobuf.Timestamp missed_deadline = 1;

  // The EARLIEST instant at which `sla.gio_bao_lanh_dao` working hours have elapsed since
  // `missed_deadline` in this commune's calendar. Level one: tell the head of the unit holding the
  // work (ResolveOrgUnitPermissionHolders). NEVER UNSET in an OK response. NEVER STORED.
  google.protobuf.Timestamp unit_head_due_at = 2;

  // The EARLIEST instant at which `sla.gio_bao_chu_tich` working hours have elapsed since
  // `missed_deadline`. Level two: tell the leadership (ResolveLeadershipStaff). NEVER UNSET in an OK
  // response. NEVER STORED.
  //
  // ORDERING — A RULE ON THE WRITE PATH, NOT A GUARANTEE ON THIS ANSWER. The user decided on
  // 2026-09-29 that the chairman's threshold is never below the unit head's (Y >= X), and identity
  // enforces it whenever an `sla` row is saved (service-identity domain.KiemTraDongSLA). It is NOT a
  // schema CHECK (migration 0016 says why), and this read does not re-check it — so a row written
  // before the rule, and not edited since, may still hold Y < X and answer a `chairman_due_at`
  // EARLIER than `unit_head_due_at`. The caller therefore evaluates the two levels independently and
  // never infers one from the other ("chairman is due" does not imply "unit head was told").
  google.protobuf.Timestamp chairman_due_at = 3;
}

message ResolveUnassignedHoldInstantsRequest {
  // Which kind of work the held records are. UNSPECIFIED is INVALID_ARGUMENT — no default kind.
  WorkKind work_kind = 1;

  // The field code, "" FOR THE DEFAULT ROW — same meaning, same fallback and same caveat as
  // ResolveDeadlinesRequest.linh_vuc. One field per call: group held records by field.
  string linh_vuc = 2;

  // For each held record, the instant its unit BEGAN holding it with nobody assigned — see the RPC
  // comment for what that instant is and whose fact it is. The count starts here; an instant
  // outside working hours starts at the next working session (ADR 0007, decision 8).
  //
  // NOT COMPARED WITH `now` here. DUPLICATES ARE COLLAPSED; order carries no meaning. Map the
  // response by `hold_started_at`, compared as an instant (seconds and nanos), never by position.
  //
  // 1 TO 500 ENTRIES — the ResolveEscalationInstants bound, for the same reason. Empty or more is
  // INVALID_ARGUMENT, never a silent truncation.
  repeated google.protobuf.Timestamp hold_started_at = 3;
}

// Wrapped, not a bare repeated item: adding a field later must not change the RPC signature.
message ResolveUnassignedHoldInstantsResponse {
  // TRUE ⟺ the applicable `sla` row's `unassigned_hold_hours` is NULL: the commune chose NOT to
  // report unassigned holds for this kind of work and field. `items` is then EMPTY.
  //
  // AN EXPLICIT FLAG, NOT "AN ITEM WITH NO INSTANT": an unset Timestamp reaches a Go caller as the
  // Unix epoch through AsTime(), which is `<= as_of` — "report everything now", the opposite of what
  // NULL means. The default `false` is the ordinary case and is always paired with a full `items`.
  bool reporting_disabled = 1;

  // When `reporting_disabled` is false: ONE ITEM PER DISTINCT `hold_started_at` ENTRY — ALL OF
  // THEM, OR THE CALL FAILS. Map by `hold_started_at`.
  repeated UnassignedHoldInstant items = 2;
}

// The reporting instant of one unassigned hold.
message UnassignedHoldInstant {
  // Echoed from the request — the KEY the caller maps by.
  google.protobuf.Timestamp hold_started_at = 1;

  // The EARLIEST instant at which `sla.unassigned_hold_hours` working hours have elapsed since
  // `hold_started_at` in this commune's calendar. Report the hold to the unit
  // (ResolveOrgUnitPermissionHolders) once this is <= the run's `claimed_at`. NEVER UNSET in an
  // item. NEVER STORED.
  google.protobuf.Timestamp unassigned_report_due_at = 2;
}

message ResolveOrgUnitPermissionHoldersRequest {
  // THE ORG-UNIT IDS the caller's records store — identity's `bo_phan.id`. Duplicates collapsed;
  // order meaningless; a blank string is absent. AT MOST 50, the ResolveLiveOrgUnits ceiling; more is
  // INVALID_ARGUMENT, never a silent truncation. An empty list answers empty — NOT "every unit".
  repeated string org_unit_ids = 1;

  // ONE flat permission key, "<nhóm>.<việc>" (rule 5, invariant 3b), that MUST be a row of `quyen`
  // (invariant 3c) — otherwise INVALID_ARGUMENT. The caller's domain key for "hands out this unit's
  // work": `task.assign`, `feedback.assign`, `document.route`.
  //
  // ONE key, not a list: "holds any of" and "holds all of" are two different questions, and the
  // caller that needs a second key asks a second time.
  string permission_key = 2;
}

// Wrapped: adding a field later must not change the RPC signature.
message ResolveOrgUnitPermissionHoldersResponse {
  // One item per requested unit that is live in this commune AND has at least one holder. Map by
  // OrgUnitPermissionHolders.org_unit_id. Never an id that was not requested.
  repeated OrgUnitPermissionHolders items = 1;
}

message OrgUnitPermissionHolders {
  // Echoed from the request — the KEY the caller maps by. `bo_phan.id`.
  string org_unit_id = 1;

  // Staff business codes (`nguoi_dung.ma`, `CB-…`) — what DeliverStaffNotifications addresses and
  // what every holder check compares with. At least one; each at most once; order meaningless.
  repeated string staff_ma = 2;
}

// No field, and that is the design: the question has no parameter, and any filter added here turns
// the leadership lookup into a roster query. Wrapped so a field can still be added additively.
message ResolveLeadershipStaffRequest {}

// Wrapped: adding a field later must not change the RPC signature.
message ResolveLeadershipStaffResponse {
  // Staff business codes of the commune's leadership — see the predicate on the RPC. Each at most
  // once, order meaningless, at most 50. EMPTY IS ORDINARY: a commune that flagged no role.
  repeated string staff_ma = 1;
}

// AutomationJob is one of the commune-switchable background jobs of docs/ui-ux/14-cau-hinh.md §9.
//
// THREE, BY THE USER'S 2026-09-29 DECISION. §9 lists five: `refresh_dashboards` is DROPPED and
// `send_scheduled_reports` is DEFERRED, by that same decision. A value for either is
// added when it is decided, never reserved speculatively.
//
// ENGLISH VALUES, and ADR 0011's rule for enum values does not bite: these are keys of the SOFTWARE's
// jobs, identical in every commune, not values written into an archival record. They follow the
// reference system's job keys (../vigov-require/apps/api/app/modules/admin/automation.py:47-100),
// with `sla_checker` renamed `sla_reminders` by the same decision. The string stored in identity's
// settings table is the lower-case suffix (`sla_reminders`), and the server owns that mapping.
enum AutomationJob {
  AUTOMATION_JOB_UNSPECIFIED = 0;

  // "Nhắc việc sắp đến hạn và đã quá hạn" — every N minutes. Runs per WorkKind in its owning service.
  // Reads ResolveDueSoonCutoff and, for work a unit holds unassigned, ResolveUnassignedHoldInstants.
  AUTOMATION_JOB_SLA_REMINDERS = 1;

  // "Leo thang việc trễ hạn" — daily. Reads ResolveEscalationInstants.
  AUTOMATION_JOB_ESCALATION = 2;

  // "Bản tin đầu tuần cho lãnh đạo" — weekly. Addresses ResolveLeadershipStaff.
  AUTOMATION_JOB_WEEKLY_DIGEST = 3;
}

// The unit of run state: one job, over one kind of work, run by the one service that owns that
// kind's data. See ClaimDueAutomationRuns for why run state cannot be per job alone.
message AutomationRunScope {
  // UNSPECIFIED is INVALID_ARGUMENT.
  AutomationJob job = 1;

  // UNSPECIFIED is INVALID_ARGUMENT. VAN_BAN_DEN and DON_THU belong to service-documents; PHAN_ANH
  // and NHIEM_VU to service-petitions. Exactly one runner per kind — see ClaimDueAutomationRuns.
  WorkKind work_kind = 2;
}

message ClaimDueAutomationRunsRequest {
  // The scopes THIS runner owns and is ready to run now. 1 TO 10 entries; duplicates collapsed.
  // The whole cross product is now three jobs × four kinds = twelve, but no runner owns it: each
  // runner owns two kinds (service-documents VAN_BAN_DEN + DON_THU, service-petitions PHAN_ANH +
  // NHIEM_VU), so one runner's full claim is three jobs × two kinds = six. Ten bounds that with
  // headroom; a request over it is INVALID_ARGUMENT, and a runner that ever owns more asks twice.
  repeated AutomationRunScope scopes = 1;
}

// Wrapped: adding a field later must not change the RPC signature.
message ClaimDueAutomationRunsResponse {
  // One run per requested scope that was due AND won by this call. A SUBSET of the request; never a
  // scope that was not requested. Absent: see the RPC's status table.
  repeated AutomationRun runs = 1;
}

// One claimed run: this caller, and nobody else, runs `scope` for this commune now.
message AutomationRun {
  // A ULID issued by this service. The key RecordAutomationRunOutcome is called with, and what the
  // run's audit entry names. NOT an idempotency key for notices: a crashed run's work is redone by a
  // later run with a different id, and a notice keyed on the run would be sent twice. Notice keys
  // are built from the business item — see DeliverStaffNotifications.
  string run_id = 1;

  // Echoed — what was claimed.
  AutomationRunScope scope = 2;

  // This service's clock at the claim. THE RUNNER'S `now` FOR THE WHOLE RUN — see the RPC comment.
  // NEVER UNSET in an OK response.
  google.protobuf.Timestamp claimed_at = 3;
}

// How one run ended. Closed on purpose — no free text crosses (see RecordAutomationRunOutcome).
// Each value names WHO acts next, which is the only thing the configuration screen needs to say.
enum AutomationRunOutcome {
  AUTOMATION_RUN_OUTCOME_UNSPECIFIED = 0;

  // Ran to the end. Zero notices is a success too — nothing was due.
  AUTOMATION_RUN_OUTCOME_SUCCEEDED = 1;

  // An identity call answered FAILED_PRECONDITION: the commune has no usable `sla` row or its
  // calendar is faulty. The commune's administrator acts (Cấu hình → Thời hạn xử lý). Nobody was
  // notified from a default.
  AUTOMATION_RUN_OUTCOME_CONFIGURATION_MISSING = 2;

  // A dependency (identity, comms, the runner's own database) was unavailable. The operator acts;
  // the next scheduled run retries. Notices already delivered stay delivered and are not repeated
  // (their idempotency keys).
  AUTOMATION_RUN_OUTCOME_DEPENDENCY_UNAVAILABLE = 3;

  // Anything else. The operator acts, from the runner's own logs (which carry codes, never content).
  AUTOMATION_RUN_OUTCOME_FAILED = 4;
}

message RecordAutomationRunOutcomeRequest {
  // The id ClaimDueAutomationRuns issued. Empty is INVALID_ARGUMENT.
  string run_id = 1;

  // UNSPECIFIED is INVALID_ARGUMENT.
  AutomationRunOutcome outcome = 2;

  // Records the run looked at (open tasks, petitions, documents in its scope). A count, for the
  // screen and the trail — never a list of them.
  uint32 records_examined = 3;

  // Recipient notices NEWLY created by this run — the sum of
  // DeliverStaffNotificationsResponse's `created` counts. Already-delivered duplicates not counted.
  uint32 notices_delivered = 4;

  // Records that were due a notice and had NOBODY to receive it (no holder, no unit holder, no
  // leadership). NOT an error — but the one count a commune must see, because each is late work
  // nobody is being told about.
  uint32 records_without_recipient = 5;
}

// Wrapped: adding a field later must not change the RPC signature.
message RecordAutomationRunOutcomeResponse {}

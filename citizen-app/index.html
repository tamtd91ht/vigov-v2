<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <!--
      No `user-scalable=no` and no `maximum-scale`: pinch-zoom stays available. Disabling zoom
      is the single most common way a mobile page becomes unusable for an ageing eye, and it is
      never worth the layout it protects.
      `viewport-fit=cover` is what makes env(safe-area-inset-*) resolve in styles.css.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3150" />
    <meta
      name="description"
      content="Giới thiệu ViHAT Software — Outsourcing Software Development Company."
    />
    <title>ViHAT Software</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

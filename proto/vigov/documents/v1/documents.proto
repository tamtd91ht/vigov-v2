syntax = "proto3";

package vigov.documents.v1;

import "google/protobuf/timestamp.proto";

// documents — Văn thư.
//
// Contract rules that apply to every RPC here:
//   * tenant_id travels in gRPC METADATA, never in a message body, under the key
//     "x-tenant-id" (lowercase — gRPC lowercases every key). A body is data the caller
//     declares, and a caller naming its own commune is a caller granting itself access
//     (rule 1, forbidden #2); the metadata is set by the client interceptor out of
//     context.Context, never passed as a business argument.
//   * a receiver that finds no "x-tenant-id" REFUSES the call with INVALID_ARGUMENT. It
//     never falls back to a default commune and never infers one from the payload — a
//     default on the isolation path collapses isolation silently, tests still green.
//   * the key sits inside the "x-tenant" prefix that core/httpx.StripTenantHeaders already
//     deletes from client-supplied requests, so a client that tries to inject it at the
//     public edge loses it before any handler runs.
//   * a `tenant_id` FIELD on a message is a DIFFERENT thing: an attribute of a stored
//     record, an answer the server returns. Never an input, never read to decide what the
//     caller may see.
//   * field numbers are never reused; a removed field becomes `reserved`
//   * new fields are always optional with a safe default

service DocumentsService {
  rpc Health(HealthRequest) returns (HealthResponse);

  // CountOrgUnitHoldings answers how many OPEN records of this service one org unit (identity's
  // `bo_phan.id`) is still holding, in the commune named by "x-tenant-id".
  //
  // THE SAME QUESTION, THE SAME SHAPE AND THE SAME STATUS CODES AS
  // vigov.petitions.v1.PetitionsService.CountOrgUnitHoldings — read the reasoning there (why it
  // exists, point-in-time, fail closed, not tenant-exempt). Only the predicate below is this
  // service's own, because only this service owns these statuses.
  //
  // # WHAT "HOLDS" AND "OPEN" MEAN HERE
  //
  //   Incoming document (`van_ban_den`)
  //     held by   `bo_phan_dang_giu_id` — the "ĐANG GIỮ" column of the register.
  //     open      live, and NOT domain.TrangThaiVanBanDen.DaKetThuc(): i.e. every status except
  //               `da-giai-quyet`, `chuyen-cap-tren`, `luu-khong-thu-ly`. Those three are truly
  //               final — a finished document is never routed again (domain.ChoChuyen) — so unlike
  //               petitions there is no reopen hazard on this side.
  //
  // # WHAT DELIBERATELY DOES NOT BLOCK
  //
  //   soft-deleted rows              no longer held by anyone (rule 7, invariant 2).
  //   finished documents             archival records naming the unit as history.
  //   routing history (`den_bo_phan_id`, `tu_bo_phan_id`)   who held it WHEN, never "held now".
  //
  // THE ONE EXECUTABLE SOURCE OF "FINISHED" IS DaKetThuc, not the list above. The server must count
  // with FinishedIncomingStatuses (derived from it), so a status added there reaches this answer
  // in the same edit — the list in this comment is explanation, not a second definition.
  //
  // RETRYING IS SAFE: it writes nothing, publishes nothing, and leaves no audit entry.
  rpc CountOrgUnitHoldings(CountOrgUnitHoldingsRequest) returns (CountOrgUnitHoldingsResponse);

  // ResolveDocumentTypeCodes answers, for each DOCUMENT TYPE CODE asked (`loai_van_ban.ma`, the slug
  // `cong-van`), whether a live row of the commune named by "x-tenant-id" carries it, and whether the
  // commune has it switched on (`dang_dung`).
  //
  // # WHY IT EXISTS (ADR 0079 lô 2 Q4, 08/10/2026)
  //
  // A commune may add its own deadline row for one document type. identity owns the `sla` table
  // (ADR 0029) and stores the type code there AS A VALUE (`sla.linh_vuc`); this service owns
  // `loai_van_ban` (data-ownership.json, DocumentType). No foreign key crosses that boundary, and
  // identity's ResolveDeadlines answers a misspelled code with the DEFAULT row, silently — so the
  // membership check at the write of the SLA row is the ONLY thing keeping a code outside the list out
  // of `sla`. identity may not read this service's database (rule 2, forbidden #2). This is the
  // question it asks instead. Until it existed identity refused every `van-ban-den` row with
  // ErrSLAFieldUnverifiable (service-identity/internal/app/sla_field_rule.go, checkFieldWithOwner).
  //
  // Its caller today: service-identity, SLA.AddFieldRule, kind `van-ban-den`, ONE code per call.
  //
  // # WHY "RESOLVE THESE CODES" AND NOT "LIST THE CATALOGUE"
  //
  // The caller holds the code it is about to write and needs one bit about it. A list would hand
  // identity a copy of a commune's catalogue it has no other use for — a second reader of tier-2 data
  // whose next use nobody reviews — and would bring a page size and a "did I get the whole list"
  // question no caller needs. Same family and same shape as identity's ResolveLiveOrgUnitCodes. The
  // screen that LISTS types reads GET /api/v1/document-types from this service directly.
  //
  // # THE PREDICATE — a code is ANSWERED when
  //
  //   a `loai_van_ban` row of this commune carries exactly that `ma`, and `deleted_at IS NULL`.
  //   `active` is that row's `dang_dung`.
  //
  // EXACT MATCH. The server does not trim, lowercase or otherwise normalise: the caller stores the
  // code it SENT, so a match on a normalised form would approve a string other than the one written.
  // The caller normalises first (domain.NormalizeSLAField) and asks with the result.
  //
  // `(tenant_id, ma)` is UNIQUE across soft-deleted rows (migration 0003), so one code names at most
  // one row and a removed type's code is never re-issued to a different type.
  //
  // # WHAT THE CALLER DOES WITH EACH ANSWER — fail closed
  //
  //   answered, active     accept: the SLA row may be written.
  //   answered, !active    REFUSE (ErrSLAFieldNotInList, "đã ngừng dùng"): a commune that switched a
  //                        type off is not issuing documents under it; a deadline row for it is a
  //                        typo-shaped mistake waiting. Same rule as a retired petition field
  //                        (ListPetitionFields: refuse for new intake).
  //   absent               REFUSE (ErrSLAFieldNotInList). Unknown, soft-deleted and another commune's
  //                        code are ONE answer, indistinguishable (rule 1).
  //   any error            REFUSE as ErrSLAFieldListUnavailable (503, retryable). NEVER "valid", NEVER
  //                        "unknown", NEVER a write unchecked.
  //
  // NOT CACHED by the caller: adding an SLA row is a rare administrative act, and a cached "active"
  // would let one through for a type switched off a moment ago.
  //
  // # A POINT-IN-TIME ANSWER, NOT A LOCK
  //
  // The type may be switched off or soft-deleted a millisecond after the answer. The SLA row then
  // names a type nobody issues under any more — harmless (it is only read when a document of that
  // type fixes its deadline) and declared in kb/30-indexes/transaction-boundaries.json under
  // `them_dong_thoi_han_rieng_kiem_ma`.
  //
  // # The commune travels in metadata; no personal data; not audited
  //
  // Codes in, codes and a flag out. Not exempt from "x-tenant-id" (ADR 0012, decision 1): the
  // commune is what scopes the answer. The audited act is identity's insert of the SLA row.
  //
  // # THE STATUS CODES ARE PART OF THE CONTRACT
  //
  //   OK                  zero or more items, each for a code that WAS requested, each code at most
  //                       once. FEWER THAN REQUESTED IS ORDINARY — it is "no live type carries this
  //                       code". An empty request answers empty, never "every type".
  //   INVALID_ARGUMENT    more than 50 codes, or a blank code. Never a silent truncation.
  //   NOT_FOUND           NEVER produced. An unknown code is an ABSENT ITEM.
  //   UNAUTHENTICATED     NEVER produced by this RPC — it belongs to the caller-key interceptor.
  //   UNAVAILABLE etc.    the call did not happen. See "fail closed" above.
  //
  // RETRYING IS SAFE: it writes nothing, publishes nothing, and leaves no audit entry.
  rpc ResolveDocumentTypeCodes(ResolveDocumentTypeCodesRequest) returns (ResolveDocumentTypeCodesResponse);

  // ResolveCitizenLetterForTask answers, for ONE citizen letter of the commune named by "x-tenant-id",
  // whether a task may be created from it, and the facts the task inherits — "Chuyển thành nhiệm vụ"
  // (C9, ADR 0084 #6, ADR 0085).
  //
  // # WHY A READ IN THIS DIRECTION, AND NOT documents CALLING petitions TO CREATE THE TASK
  //
  // The task is the only record written, and it belongs to service-petitions (`nhiem_vu`). The browser
  // route therefore lives there, and petitions asks the OWNER of the letter for the facts instead of
  // accepting them from anybody: the source pair, the inherited deadline and the holder fallback are
  // derived ON THE SERVER, never taken from the client (C9; ledger
  // service-documents/tao-nhiem-vu-tu-ho-so-khac-service). The opposite shape — documents calling a
  // petitions "create task" RPC — would make petitions write a task on a caller-declared letter id,
  // deadline AND acting staff code, all three claims of whoever holds the one shared caller key
  // (ADR 0025 proves "inside the deployment", never "which service"). Here the only claim petitions
  // relies on is the commune in metadata, and the actor is its own session principal.
  //
  // ONE WRITE, ONE TRANSACTION, NOTHING TO COMPENSATE: nothing is written on the letter. The link is
  // the task's `nguon_giao = 'don-thu'` + `nguon_id = letter id` — one fact, one owner. Declared in
  // kb/30-indexes/transaction-boundaries.json, `tao_nhiem_vu_tu_don_thu`.
  //
  // # A DENUNCIATION NEVER CROSSES — and that is enforced HERE, by the owner of the letter
  //
  // C9 and ADR 0084 #6: a `to-cao` letter is not converted, and nothing of it — the denouncer's
  // identity, the summary, not even its register number — may reach the task register (Luật Tố cáo
  // 2018 Đ.8 confidentiality, ADR 0078 #4). The answer for a `to-cao` letter is the bare eligibility
  // DENUNCIATION with `letter` UNSET. The rule lives in the one service that knows the letter types;
  // petitions only maps the answer to its refusal.
  //
  // # NO PERSONAL DATA IN THE ANSWER, AT ALL
  //
  // No sender name, phone or address, and NOT THE SUMMARY. A summary quotes the letter (it is marked
  // as possibly personal in migration 0006), and `nhiem_vu` holds no citizen personal data by
  // construction (service-petitions/internal/domain/nhiem_vu.go, NhiemVu). The task title the
  // prototype pre-fills from the summary is pre-filled BY THE SCREEN, which already shows the summary
  // to a reader holding `petition.read`; the person confirming the dialog is the one who decides what
  // text crosses, and it reaches petitions as their typed title. Because nothing personal is returned,
  // this read is not audited (rule 6, invariant 7 covers FULL personal data).
  //
  // # THE PREDICATE
  //
  //   NOT_FOUND     no row of this commune with this id, or the row is soft-deleted (rule 7,
  //                 invariant 2). Unknown, deleted and another commune's id are ONE answer (rule 1).
  //   DENUNCIATION  a live row with `letter_type = 'to-cao'`. `letter` unset.
  //   ELIGIBLE      any other live row. NO STATUS FILTER: the prototype converts a letter in any
  //                 status (../vigov-require/apps/api/app/modules/documents/service.py:641-686) and
  //                 ADR 0084 #6 decided "bật, theo prototype, trừ tố cáo". A status rule added later is
  //                 a new eligibility value — additive — never a silent NOT_FOUND.
  //
  // # A POINT-IN-TIME ANSWER, NOT A LOCK
  //
  // petitions calls this BEFORE its transaction opens (a network round trip held inside a database
  // transaction is a row lock held for as long as another service chooses). Between the answer and
  // the commit the letter may be soft-deleted or have its deadline edited; the task then keeps what
  // it inherited AT THE ACT THAT FIXED IT (rule 10, invariant 2), exactly as a task outlives a
  // soft-deleted petition. `letter_type` is fixed at booking — no write path edits it — so a letter
  // cannot BECOME a denunciation in that window. The day a path that edits `letter_type` is written,
  // it must refuse a change into `to-cao` for a letter some task points at, or this guarantee is gone.
  //
  // # The commune travels in metadata; never exempt
  //
  // Not on core/grpcx.methodsWithoutTenant and never to be (ADR 0012, decision 1): the commune scopes
  // the row read.
  //
  // # THE STATUS CODES ARE PART OF THE CONTRACT
  //
  //   OK                  `eligibility` is never UNSPECIFIED in an OK answer; `letter` is set iff
  //                       ELIGIBLE. A caller seeing anything else treats it as a contract fault (refuse).
  //   INVALID_ARGUMENT    `letter_id` blank or longer than 64. No "x-tenant-id".
  //   NOT_FOUND           NEVER produced — "no such letter" is the NOT_FOUND ELIGIBILITY in an OK answer.
  //   UNAUTHENTICATED     NEVER produced by this RPC — the caller-key interceptor's code (ADR 0025).
  //   UNIMPLEMENTED       a documents older than this RPC: deploy documents BEFORE petitions.
  //   UNAVAILABLE etc.    the call did not happen. NOT "not found" and NOT "eligible": the caller
  //                       refuses with 503 and writes nothing.
  //
  // RETRYING IS SAFE: it writes nothing, publishes nothing, and leaves no audit entry.
  rpc ResolveCitizenLetterForTask(ResolveCitizenLetterForTaskRequest) returns (ResolveCitizenLetterForTaskResponse);
}

message HealthRequest {}
message HealthResponse {
  bool ok = 1;
}

message CountOrgUnitHoldingsRequest {
  // ONE org unit — identity's `bo_phan.id` (the ULID). Blank is INVALID_ARGUMENT. One and not a
  // list, for the reason given on the petitions request.
  string org_unit_id = 1;
}

// By kind, for the same reason as the petitions response. A kind added later (an outgoing
// document register, a citizen letter register with its own holder column) is a new field AND
// an update to core/documentsclient in the same change — a caller that reads zero for a kind it
// does not know weakens the refusal.
message CountOrgUnitHoldingsResponse {
  // Live incoming documents, not finished, whose `bo_phan_dang_giu_id` is the unit.
  uint32 open_incoming_documents = 1;
}

message ResolveDocumentTypeCodesRequest {
  // `loai_van_ban.ma` values, exactly as the caller will store them. 0 to 50; duplicates answered
  // once. A blank entry is INVALID_ARGUMENT — it would match nothing, and asking for it is a caller bug.
  repeated string codes = 1;
}

// Wrapped: adding a field later (a label, an order) must not change the RPC signature.
message ResolveDocumentTypeCodesResponse {
  // Only for codes that a live type of this commune carries. Order is not significant.
  repeated DocumentTypeCode items = 1;
}

message DocumentTypeCode {
  // Echoed exactly as requested — the key the caller maps by.
  string code = 1;

  // The commune has the type switched on (`dang_dung`). False is still a live row: answered, but the
  // caller refuses it for a new SLA row — see the RPC.
  bool active = 2;
}

message ResolveCitizenLetterForTaskRequest {
  // `citizen_letter.id` — the id in `/api/v1/citizen-letters/{id}`. It reaches petitions from the
  // browser, so it is a CLAIM until this RPC answers it within the commune of metadata. Blank or over
  // 64 characters is INVALID_ARGUMENT.
  string letter_id = 1;
}

// Wrapped: adding a field later must not change the RPC signature.
message ResolveCitizenLetterForTaskResponse {
  // Never UNSPECIFIED in an OK answer.
  CitizenLetterTaskEligibility eligibility = 1;

  // SET IF AND ONLY IF `eligibility` is ELIGIBLE. Unset for a denunciation by design — see the RPC.
  CitizenLetterTaskSource letter = 2;
}

// Whether a task may be created from the letter. A closed set; a new refusal (a status rule, say) is a
// new value, and a caller that does not know it REFUSES — never treats it as ELIGIBLE.
enum CitizenLetterTaskEligibility {
  CITIZEN_LETTER_TASK_ELIGIBILITY_UNSPECIFIED = 0;

  // A live letter of this commune, not a denunciation. `letter` is set.
  CITIZEN_LETTER_TASK_ELIGIBILITY_ELIGIBLE = 1;

  // Unknown, soft-deleted or another commune's id — one answer, indistinguishable (rule 1).
  CITIZEN_LETTER_TASK_ELIGIBILITY_NOT_FOUND = 2;

  // A live `to-cao` letter. Never converted (C9, ADR 0084 #6); nothing about it is returned.
  CITIZEN_LETTER_TASK_ELIGIBILITY_DENUNCIATION = 3;
}

// The facts a task inherits from a letter. CODES, IDS AND ONE INSTANT — NO PERSONAL DATA (see the RPC).
message CitizenLetterTaskSource {
  // Echo of the request: what petitions stores in `nhiem_vu.nguon_id`.
  string letter_id = 1;

  // The register number and its year (`citizen_letter.number`, `.year`) — the letter's BUSINESS
  // identifier. Read by petitions for its audit entry, so the trail names "đơn số 12/2026" and not a
  // ULID nobody can read years later (rule 6, invariant 2).
  uint32 number = 2;
  uint32 year = 3;

  // `citizen_letter.holding_unit_id` (identity's `bo_phan.id`) and `.assignee_code` (a STAFF BUSINESS
  // CODE, `CB-…`). "" = none. The FALLBACK the prototype uses when the dialog names neither a unit nor
  // a person (service.py:658-662). Not validated here — petitions re-checks both with identity before
  // writing, exactly as for any assignment (ResolveLiveOrgUnits / ResolveAssignableStaff).
  string holding_unit_id = 4;
  string assignee_code = 5;

  // THE DEADLINE THE LETTER SHOWS RIGHT NOW — the one "Hạn giải quyết" box of ADR 0084 #3: the
  // resolution deadline once the letter is accepted (`accepted_at` set), the processing deadline
  // before. Chosen HERE, by the one service that maps a stage to a column; petitions never picks.
  //
  // UNSET = THE LETTER HAS NO DEADLINE ("Không đặt hạn"), and the task is then created with none. It
  // is never replaced by a default anywhere downstream.
  //
  // AN INSTANT, as stored. petitions turns it into the task deadline itself: the Asia/Ho_Chi_Minh DATE
  // of this instant at 17:00 (C9, 24/09/2026). That is pinning a time of day on a date, not counting a
  // duration — rule 10, forbidden #2 is not involved.
  google.protobuf.Timestamp current_due_at = 6;
}

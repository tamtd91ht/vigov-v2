apiVersion: v1
kind: Service
metadata:
  name: platform
spec:
  selector: { app.kubernetes.io/name: platform }
  ports:
    - { name: rest, port: 8080, targetPort: rest }
    # Tên DNS trong cụm: platform.<namespace>.svc.cluster.local:9090
    # Đây là giá trị PLATFORM_GRPC_ADDR của bảy dịch vụ còn lại.
    - { name: grpc, port: 9090, targetPort: grpc }

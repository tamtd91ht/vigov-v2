apiVersion: v1
kind: Service
metadata:
  name: reporting
spec:
  selector: { app.kubernetes.io/name: reporting }
  # CHỈ cổng REST, TÊN `rest` — `tools/ingress` trỏ backend theo tên này và từ chối sinh nếu thiếu
  # (`tools/ingress/dinhtuyen.go`, `congCuaDichVu`). Dịch vụ này không phục vụ gRPC
  # (`cmd/server/main.go:118` chỉ mở một listener HTTP), nên khai thêm một cổng 9090 ở đây sẽ tạo
  # một Endpoint không có ai nghe — và người sau sẽ đọc nó là "có đường gọi tới reporting qua gRPC".
  ports:
    - { name: rest, port: 8080, targetPort: rest }

syntax = "proto3";

package vigov.documents.v1;

// documents — Văn thư.
//
// Contract rules that apply to every RPC here:
//   * tenant_id travels in gRPC METADATA, never in a message body, under the key
//     "x-tenant-id" (lowercase — gRPC lowercases every key). A body is data the caller
//     declares, and a caller naming its own commune is a caller granting itself access
//     (rule 1, forbidden #2); the metadata is set by the client interceptor out of
//     context.Context, never passed as a business argument.
//   * a receiver that finds no "x-tenant-id" REFUSES the call with INVALID_ARGUMENT. It
//     never falls back to a default commune and never infers one from the payload — a
//     default on the isolation path collapses isolation silently, tests still green.
//   * the key sits inside the "x-tenant" prefix that core/httpx.StripTenantHeaders already
//     deletes from client-supplied requests, so a client that tries to inject it at the
//     public edge loses it before any handler runs.
//   * a `tenant_id` FIELD on a message is a DIFFERENT thing: an attribute of a stored
//     record, an answer the server returns. Never an input, never read to decide what the
//     caller may see.
//   * field numbers are never reused; a removed field becomes `reserved`
//   * new fields are always optional with a safe default

service DocumentsService {
  rpc Health(HealthRequest) returns (HealthResponse);

  // CountOrgUnitHoldings answers how many OPEN records of this service one org unit (identity's
  // `bo_phan.id`) is still holding, in the commune named by "x-tenant-id".
  //
  // THE SAME QUESTION, THE SAME SHAPE AND THE SAME STATUS CODES AS
  // vigov.petitions.v1.PetitionsService.CountOrgUnitHoldings — read the reasoning there (why it
  // exists, point-in-time, fail closed, not tenant-exempt). Only the predicate below is this
  // service's own, because only this service owns these statuses.
  //
  // # WHAT "HOLDS" AND "OPEN" MEAN HERE
  //
  //   Incoming document (`van_ban_den`)
  //     held by   `bo_phan_dang_giu_id` — the "ĐANG GIỮ" column of the register.
  //     open      live, and NOT domain.TrangThaiVanBanDen.DaKetThuc(): i.e. every status except
  //               `da-giai-quyet`, `chuyen-cap-tren`, `luu-khong-thu-ly`. Those three are truly
  //               final — a finished document is never routed again (domain.ChoChuyen) — so unlike
  //               petitions there is no reopen hazard on this side.
  //
  // # WHAT DELIBERATELY DOES NOT BLOCK
  //
  //   soft-deleted rows              no longer held by anyone (rule 7, invariant 2).
  //   finished documents             archival records naming the unit as history.
  //   routing history (`den_bo_phan_id`, `tu_bo_phan_id`)   who held it WHEN, never "held now".
  //
  // THE ONE EXECUTABLE SOURCE OF "FINISHED" IS DaKetThuc, not the list above. The server must count
  // with FinishedIncomingStatuses (derived from it), so a status added there reaches this answer
  // in the same edit — the list in this comment is explanation, not a second definition.
  //
  // RETRYING IS SAFE: it writes nothing, publishes nothing, and leaves no audit entry.
  rpc CountOrgUnitHoldings(CountOrgUnitHoldingsRequest) returns (CountOrgUnitHoldingsResponse);
}

message HealthRequest {}
message HealthResponse {
  bool ok = 1;
}

message CountOrgUnitHoldingsRequest {
  // ONE org unit — identity's `bo_phan.id` (the ULID). Blank is INVALID_ARGUMENT. One and not a
  // list, for the reason given on the petitions request.
  string org_unit_id = 1;
}

// By kind, for the same reason as the petitions response. A kind added later (an outgoing
// document register, a citizen letter register with its own holder column) is a new field AND
// an update to core/documentsclient in the same change — a caller that reads zero for a kind it
// does not know weakens the refusal.
message CountOrgUnitHoldingsResponse {
  // Live incoming documents, not finished, whose `bo_phan_dang_giu_id` is the unit.
  uint32 open_incoming_documents = 1;
}

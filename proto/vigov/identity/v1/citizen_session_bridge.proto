syntax = "proto3";

package vigov.identity.v1;

import "google/protobuf/timestamp.proto";

// CitizenSessionBridgeService is the ONE door through which a citizen session of ViGov is issued
// for the Zalo Mini App. Its only caller is the `vihat-miniapp` backend (a separate, commercial
// repository), after that backend has verified a Zalo token with the secret of the app the token
// came from. Why it exists, and every decision behind its shape:
// kb/10-decisions/0045-cau-phien-cong-dan-mini-app.md. ADR 0044 is the decision it implements.
//
// A SEPARATE SERVICE, NOT A METHOD ON IdentityService, AND THAT IS STRUCTURAL:
//
//   * It is served on its OWN LISTENER with its OWN credential (ADR 0045 §Tin cậy). The caller is
//     not a ViGov service and must never hold GRPC_CALLER_KEY: that key opens every RPC of every
//     service (ADR 0025, "không mua được" #2). A listener that serves only this service is what
//     makes "the bridge credential opens exactly one RPC" a property of the wiring rather than a
//     list someone has to keep right.
//   * The app secret never crosses this boundary (ADR 0032). What crosses is the RESULT of the
//     verification — which app, which Zalo account, and optionally the phone number Zalo attested.
//
// THE COMMUNE: this RPC is called before any commune is known — it is the call that DECIDES the
// commune of the session — so it cannot carry "x-tenant-id". It needs a place on
// core/grpcx.methodsWithoutTenant, and adding a name there is a STOP CONDITION (ADR 0012,
// decision 1). NOT ADDED BY THIS CONTRACT. Until the user answers, the interceptor refuses it.
//
// NEVER LOG A MESSAGE OF THIS FILE. The generated String() prints every field in full
// (`debug_redact` is a no-op in protobuf-go v1.36.12, measured 2026-09-20); the request carries a
// Zalo account identifier and possibly a phone number (rule 3), the response a working bearer
// token (rule 8). Log the fields you chose, never the message.
service CitizenSessionBridgeService {
  // OpenCitizenSession issues a NEW citizen session and returns its bearer token exactly once.
  //
  // THE SERVER DECIDES THE COMMUNE; the caller only reports facts it verified (ADR 0044):
  //
  //   app mode COMMUNE (dedicated app)  the commune bound to `app_id` in service-platform. No
  //                                     binding, or the bound commune inactive -> FAILED_PRECONDITION.
  //                                     `tenant_hint` is IGNORED in this mode.
  //   app mode MAIN, commune_confirmed  `tenant_hint`, which must be an ACTIVE commune; it becomes
  //                                     the account's remembered commune. Audited, including the
  //                                     commune it replaced.
  //   app mode MAIN, otherwise          the account's remembered commune if it is still active,
  //                                     else "" (the introduction screen only). NEVER a default.
  //   app_id unknown to the platform    FAILED_PRECONDITION. There is no default app and no default
  //                                     commune (rule 1, forbidden #1).
  //
  // Every call writes a new session row and its audit entry IN ONE TRANSACTION (rule 6,
  // invariant 3), so it is NOT idempotent: a retry after a timeout may leave one extra session
  // whose token nobody holds. It expires by TTL; the cost is written in ADR 0045.
  //
  // STATUS CODES ARE PART OF THE CONTRACT:
  //
  //   OK                   a session was issued.
  //   INVALID_ARGUMENT     `app_id` or `zalo_user_id` empty, `tenant_hint` not a ULID, or
  //                        `commune_confirmed` without `tenant_hint`. A wiring fault in the caller.
  //   FAILED_PRECONDITION  the platform has no usable binding for this app, or the confirmed
  //                        commune is not active. A human fixes configuration; the client shows
  //                        "ứng dụng chưa sẵn sàng" / re-resolves the QR. Never retried blindly.
  //   UNAUTHENTICATED      NEVER produced by this RPC — only by the bridge-credential interceptor,
  //                        and it means the DEPLOYMENT is misconfigured.
  //   UNAVAILABLE etc.     nothing was issued. The caller answers 503; it never falls back to a
  //                        session of its own for the ViGov surface.
  rpc OpenCitizenSession(OpenCitizenSessionRequest) returns (OpenCitizenSessionResponse);
}

message OpenCitizenSessionRequest {
  // The Zalo Mini App ID whose app secret successfully verified the access token in THIS request.
  // A CLAIM BY THE BRIDGE CALLER, trusted only because the caller holds the bridge credential and
  // performed the exchange. HOW the caller learns which secret to use is ADR 0045 UNKNOWN #1.
  // Not personal data; may be logged.
  string app_id = 1;

  // The Zalo account id the verified access token belongs to. PERSONAL DATA (an online identifier
  // under Decree 13/2023): never logged, never returned, never in an audit entry. Whether it is
  // scoped per app is ADR 0045 UNKNOWN #2 — the server therefore keys the account on
  // (app_id, zalo_user_id), never on this value alone.
  string zalo_user_id = 2;

  // The `t=` parameter of a discovery QR (ADR 0005), passed through verbatim. "" when the app was
  // opened without one. CLIENT-SUPPLIED DATA: on its own it enters nothing (rule 1, forbidden #2).
  string tenant_hint = 3;

  // The citizen explicitly accepted, on a confirmation screen, the commune named by `tenant_hint`.
  // Only this act moves a main-app account into a commune or to a different one (ADR 0045 §Chế độ
  // app chính). false is the safe default: the session follows the remembered commune.
  bool commune_confirmed = 4;

  // The phone number Zalo attested in THIS request (getPhoneNumber token exchanged by the caller),
  // normalised to "84…" digits. "" when no phone token was exchanged — the ordinary case; the app
  // asks for the phone only when the citizen submits something (ADR 0045 §Số điện thoại).
  // PERSONAL DATA (rule 3): crosses this boundary only when present, is never logged, never echoed.
  string verified_phone = 5;

  // The citizen's address as the bridge caller observed it, for the audit entry (rule 6,
  // invariant 2). A claim by the caller; it is the only observer of that address.
  string client_ip = 6;

  // User agent or device label, truncated by the server. Diagnostics, never personal data.
  string device = 7;
}

// The app modes of ADR 0044. English names: these describe the software, not an administrative
// concept whose translation could assert a legal equivalence (ADR 0011).
enum MiniAppMode {
  MINI_APP_MODE_UNSPECIFIED = 0;
  // The ViHAT-owned main app: commune only through a confirmed QR, remembered per account.
  MINI_APP_MODE_MAIN = 1;
  // A commune's dedicated app: the commune is fixed by the app id.
  MINI_APP_MODE_COMMUNE = 2;
}

message OpenCitizenSessionResponse {
  // The bearer token, returned ONCE; only its SHA-256 is stored. A CREDENTIAL (rule 8): the bridge
  // caller relays it to the Mini App and never logs or persists it.
  string session_token = 1;

  // The session id — what an audit entry quotes and what revocation targets. Grants nothing.
  string session_id = 2;

  google.protobuf.Timestamp expires_at = 3;

  // The commune of this session — an ANSWER the server computed. "" is a real answer: no commune
  // (main app, never confirmed one, or the remembered one is no longer active). The Mini App then
  // shows the introduction screen only; it NEVER substitutes a commune.
  string tenant_id = 4;

  // The commune's display name at issuance, for the header and the confirmation screen. Display
  // only, point-in-time. "" exactly when `tenant_id` is "". Everything else about the commune
  // (address, logo, hotline, hours) is a separate citizen read of the display profile owned by
  // service-platform (ADR 0045 §Hồ sơ hiển thị) — deliberately not on this path.
  string tenant_display_name = 5;

  // Whether this session is bound to a verified citizen identity (a phone number verified now or
  // previously for this Zalo account). false: the session may browse, and every route that reads
  // or writes the citizen's own records refuses it (ADR 0045 §Phiên chưa có số điện thoại).
  bool phone_verified = 6;

  MiniAppMode app_mode = 7;
}

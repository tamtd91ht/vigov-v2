  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: platform } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: identity } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: comms } }
      ports:
        - { port: 9090, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:

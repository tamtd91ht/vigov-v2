# Web quản trị cho cán bộ — Next.js standalone, `node server.js`, cổng 3000.
#
# KHÔNG có biến `NEXT_PUBLIC_*` nào, và đó là bất biến có kiểm thử canh
# (`web-admin/src/ranh-gioi-nguon.test.ts`): biến mang tiền tố ấy bị nung thẳng vào bundle
# trình duyệt lúc build, nên một giá trị theo-xã đặt ở đó sẽ đóng băng MỘT xã vào ảnh dùng
# chung cho mọi xã (luật 1 bất biến 10, luật 8 bất biến 4).
#
# Ảnh chạy bằng user `node` (UID 1000), KHÔNG phải 65532 như ảnh distroless của dịch vụ Go.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-admin
  labels:
    app.kubernetes.io/name: web-admin
    app.kubernetes.io/part-of: vigov
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: web-admin }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-admin
        app.kubernetes.io/part-of: vigov
        vigov.vn/be-mat: rest
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: web-admin }

      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }

      containers:
        - name: web
          image: harbor.omicrm.services/ci/vigov-web-admin:CHUA-GHIM-THE
          imagePullPolicy: IfNotPresent

          ports:
            - { name: http, containerPort: 3000 }

          env:
            - { name: PORT,      value: "3000" }
            - { name: HOSTNAME,  value: "0.0.0.0" }   # mặc định của Next là 127.0.0.1 → probe không tới được

          # web-admin là CỔNG của `/api/v1/*` (quyết định 25/09/2026: k8s chỉ cấp Secret +
          # ConfigMap, định tuyến nằm trong ứng dụng). Nó đọc `*_HTTP_ADDR` — địa chỉ nội bộ
          # của năm dịch vụ Go — và `ENV` từ ConfigMap chung. Không đặt thì mặc định
          # `http://<dịch vụ>:8080`, tức đúng tên Service trong cùng namespace.
          # KHÔNG có `secretRef`: web-admin không giữ bí mật nào.
          envFrom:
            - configMapRef: { name: cau-hinh-chung }

          # `/healthz` không hỏi xã, không gọi backend. Probe `/` từng bị chuyển hướng sang
          # `/dang-nhap`, trang ấy hỏi identity bằng Host là IP pod → 404 → pod không bao
          # giờ Ready — và một identity chập chờn sẽ kéo cả web-admin khỏi vòng phục vụ.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 5

          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits:   { memory: 512Mi }

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

          volumeMounts:
            - { name: tmp,   mountPath: /tmp }
            - { name: cache, mountPath: /app/.next/cache }   # Next ghi cache ảnh lúc chạy

      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: cache
          emptyDir: { sizeLimit: 256Mi }

      imagePullSecrets:
        - name: harbor-vigov

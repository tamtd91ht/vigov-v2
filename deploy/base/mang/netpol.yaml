# BIÊN MẠNG. Đây là biên DUY NHẤT bảo vệ cổng 9090.
#
# `core/platformclient/directory.go:73` quay số bằng `insecure.NewCredentials()`: gRPC giữa
# các dịch vụ KHÔNG có TLS và KHÔNG đi qua lớp kiểm quyền của bề mặt REST. `EXPOSE 9090`
# trong Dockerfile chỉ là tài liệu. Nếu tệp này không được áp, mọi thứ vẫn chạy và trông
# bình thường — chỉ là danh bạ xã của toàn hệ thống mở cho bất kỳ pod nào trong cụm.

# 1. Từ chối tất cả, cả vào lẫn ra. Mọi cho phép bên dưới là NGOẠI LỆ có tên.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# 2. REST 8080: chỉ từ ingress controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rest-from-ingress
spec:
  podSelector:
    matchLabels: { vigov.vn/surface: rest }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports:
        - { port: 8080, protocol: TCP }
        - { port: 3000, protocol: TCP }
---
# 3. gRPC 9090: VÀO mỗi dịch vụ CHỈ từ đúng những pod gọi nó (ADR 0048 §Chốt bổ sung 01/10 #2).
#
# Trước 01/10/2026 đây là MỘT chính sách `allow-grpc-internal` cho MỌI pod trong namespace vào
# 9090. Hẹp lại vì NetworkPolicy chỉ CỘNG quyền: còn một luật rộng thì mọi luật hẹp bên cạnh
# (quy tắc 11) là rào trông như đang canh mà không canh gì. Hẹp theo từng CẶP GỌI THẬT, đọc từ mã
# — mỗi `*client.Dial` trong `service-*/cmd/` — không đọc từ tài liệu. Bảng cặp gọi ghi ở sổ
# `deploy/netpol-grpc-theo-cap-goi` (kb/90-ephemeral/tien-do/deploy.json), không chép vào đây.
#
# THÊM MỘT LỜI GỌI gRPC MỚI (một `*client.Dial` mới, hay một dịch vụ mới phục vụ 9090) MÀ KHÔNG
# THÊM CẶP Ở ĐÂY VÀ Ở QUY TẮC 4b thì không có gì đỏ: pod xanh, probe xanh (probe chỉ gõ 8080), chỉ
# có lời gọi ấy treo tới hết hạn. Sửa ở cả hai nơi — vào ở bên được gọi, ra ở bên gọi.
#
# ⚠ ĐỔI TÊN ĐỐI TƯỢNG = PHẢI XOÁ TAY BẢN CŨ. Tên là danh tính của NetworkPolicy khi `kubectl
# apply`; áp bản render này KHÔNG gỡ `allow-grpc-internal` đã có trên cụm, và vì quyền chỉ cộng,
# bản cũ còn đó thì mọi dòng dưới đây vô nghĩa. Sau khi áp, chạy trong namespace của overlay:
#     kubectl -n <namespace> delete networkpolicy allow-grpc-internal
# rồi kiểm `kubectl -n <namespace> get networkpolicy` không còn tên ấy.
#
# Chọn pod bằng NHÃN TÊN `app.kubernetes.io/name`, không bằng `vigov.vn/grpc` — nhãn ấy nói "pod
# này phục vụ 9090", không nói "ai được gọi nó". `finance` và `reporting` không phục vụ gRPC (không
# có `GRPCServer` trong `configUses`), nên không có chính sách VÀO; chúng chỉ gọi đi.
#
# 3a. platform 9090 ← mọi dịch vụ Go còn lại (danh bạ xã: phân giải Host → xã, ADR 0003).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grpc-to-platform
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: platform }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: comms } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: documents } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: finance } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: identity } }   # cả `operatorctl` chạy trong pod identity
        - podSelector: { matchLabels: { app.kubernetes.io/name: petitions } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: reporting } }
      ports:
        - { port: 9090, protocol: TCP }
---
# 3b. identity 9090 ← CHỈ sáu dịch vụ hỏi danh tính cán bộ (`identityclient`) — platform thêm 02/10/2026.
#
# Từ 01/10/2026 (người dùng chốt "Cổng riêng cho OperatorService") 9090 KHÔNG còn mang RPC vận hành:
# OperatorService chỉ đăng ký trên cổng 9093 của identity, và chỉ quy tắc 11 cho vào 9093. Trước đó
# hai loại RPC chung 9090, nên một pod bị chiếm trong năm dịch vụ dưới đây gọi thẳng được
# OpenOperatorSession — vòng qua giới hạn theo IP của platform, giả client_ip, khoá người vận hành 12
# giờ. NetworkPolicy chỉ phân biệt theo pod và cổng, không theo RPC: tách cổng là cách duy nhất.
#
# platform VÀO danh sách từ 02/10/2026 (ADR 0069): tuyến ghi cán bộ đầu tiên của nó (logo + banner
# web-admin, quyền admin.org) cần ResolveStaffPrincipal — `identityclient.Dial` trong
# `service-platform/cmd/server/main.go`. 9090 chỉ còn RPC cán bộ (OperatorService đã sang 9093 từ
# 01/10), nên điều này KHÔNG mở lại lỗ quy tắc 11 đã đóng. Cầu phiên công dân 9091 là quy tắc 8.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grpc-to-identity
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: identity }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: comms } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: documents } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: finance } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: petitions } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: reporting } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: platform } }
      ports:
        - { port: 9090, protocol: TCP }
---
# 3c. comms 9090 ← documents, petitions và finance (gửi thông báo qua `commsclient`; finance: nhắc tên
# trong trao đổi dự án, ADR 0081 #5).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grpc-to-comms
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: comms }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: documents } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: petitions } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: finance } }
      ports:
        - { port: 9090, protocol: TCP }
---
# 3d. documents 9090 ← identity (`CountOrgUnitHoldings`, hỏi trước khi xoá một bộ phận) và petitions
# (`ResolveCitizenLetterForTask`, hỏi đơn thư trước khi chuyển thành nhiệm vụ — ADR 0085 A,
# `documentsclient.Dial` trong `service-petitions/cmd/server/main.go`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grpc-to-documents
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: documents }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: identity } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: petitions } }
      ports:
        - { port: 9090, protocol: TCP }
---
# 3e. petitions 9090 ← CHỈ identity (`CountOrgUnitHoldings`, cùng lý do với 3d).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grpc-to-petitions
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: petitions }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: identity } }
      ports:
        - { port: 9090, protocol: TCP }
---
# 4. Đường RA chung của mọi pod: DNS và hạ tầng dữ liệu NGOÀI cụm.
#
# gRPC 9090 KHÔNG còn ở đây (01/10/2026): luật này áp cho MỌI pod (`podSelector: {}`), nên mở 9090
# ở đây là cho mọi pod — kể cả web-admin và vihat-miniapp — gọi mọi dịch vụ. Đường ra 9090 nay theo
# từng bên gọi, ở quy tắc 4b. Đối tượng giữ tên `allow-egress`, nên `kubectl apply` sửa tại chỗ.
#
# ⚠ TẠM MỞ `0.0.0.0/0` TỪ 24/09/2026 — NỢ, không phải thiết kế. Người dùng chọn gỡ ràng buộc
# địa chỉ để deploy prod trước khi biết dải mạng của PostgreSQL / Redis, "bổ sung sau".
# Theo dõi ở sổ `_chung/netpol-duong-ra-tam-mo`.
#
# Vẫn GIỮ giới hạn CỔNG: pod ra được mọi địa chỉ nhưng chỉ trên 5432 / 6379 / 9092. Xoá hẳn
# luật này thì KHÔNG được — quy tắc 1 từ chối mọi đường ra, nên pod mất CSDL và chết ở bước
# di trú. Cái giá của lúc tạm mở: một pod bị chiếm quyền gửi được dữ liệu tới BẤT KỲ máy nào
# mở một trong ba cổng ấy, thay vì chỉ tới mạng nội bộ. Một dịch vụ hồ sơ hành chính không có
# lý do gì để ra Internet, nên đích đúng là dải mạng thật của CSDL — thay `0.0.0.0/0` bằng dải
# ấy ngay khi biết, rồi render lại (deploy/README.md mục 11.3).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0       # ← NỢ: thay bằng dải mạng thật của PostgreSQL / Redis / Kafka
      ports:
        - { port: 5432, protocol: TCP }
        - { port: 6379, protocol: TCP }
        - { port: 9092, protocol: TCP }
---
# 4b. Đường RA gRPC 9090: mỗi bên gọi CHỈ tới đúng những dịch vụ nó quay số — mặt kia của quy tắc 3.
#
# Cần cả hai phía: quy tắc 1 từ chối cả vào lẫn ra, nên thiếu đường ra thì luật vào ở quy tắc 3 không
# được dùng tới. platform → identity:9093 là quy tắc 11 (`allow-platform-egress-identity-grpc`), không ở đây.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-comms-egress-grpc
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: comms }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: platform } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: identity } }
      ports:
        - { port: 9090, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-documents-egress-grpc
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: documents }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: platform } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: identity } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: comms } }
      ports:
        - { port: 9090, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-finance-egress-grpc
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: finance }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: platform } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: identity } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: comms } }
      ports:
        - { port: 9090, protocol: TCP }
---

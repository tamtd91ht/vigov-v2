apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vigov-prod

resources:
  - ../../base

# Host + TLS của prod. Bảng định tuyến của Ingress KHÔNG ở đây: nó SINH ra ở
# `base/mang/ingress.yaml` từ `kb/20-contracts/openapi.json`. Xem `ingress-moi-truong.yaml`.
patches:
  - path: ingress-moi-truong.yaml
    target: { group: networking.k8s.io, version: v1, kind: Ingress, name: vigov }

commonLabels:
  # Nhãn để CHỌN, không phải để xoá. Job triển khai cố ý KHÔNG dùng `kubectl apply --prune`:
  # xoá một tài nguyên phải là hành động có người quyết, không phải hệ quả phụ của deploy.
  vigov.vn/mt: prod

configMapGenerator:
  - name: cau-hinh-chung
    literals:
      - ENV=prod
      # Thời gian một thay đổi tên miền cần để có hiệu lực trên mọi pod. Dài hơn 1 phút thì
      # `config.CanhBao()` kêu — onboard một xã mới sẽ chờ lâu không giải thích được.
      - TENANT_CACHE_TTL=30s
      # DANGEROUS_AUTH_BYPASS KHÔNG xuất hiện ở đây, có chủ ý: `config.Load` TỪ CHỐI khởi
      # động nếu nó bật ở ENV=prod (luật 8 bất biến 7). Không khai là cách chắc chắn nhất.

# ════════════════════════════════════════════════════════════════════════════════════════
# THẺ ẢNH — CHỈ DÙNG CHO LẦN CÀI ĐẦU. Chốt 22/09/2026.
#
# Job `vigov-deploy` KHÔNG còn sửa khối này. Nó đặt ảnh bằng `kubectl set image` và nhật ký
# triển khai nằm ở lịch sử build của job — xem `deploy/Jenkinsfile`, khối đầu tệp.
#
# Vì thế khối này KHÔNG phản ánh thẻ đang chạy trên cụm. Chạy `kubectl apply -k` lên một
# namespace đã có dịch vụ sẽ đẩy CẢ BẢY về `CHUA-TRIEN-KHAI-LAN-NAO`, tức ImagePullBackOff
# đồng loạt. Cách sửa manifest mà không đạp phải bẫy ấy: `deploy/README.md`, mục *Sửa
# manifest sau khi đã chạy*.
# ════════════════════════════════════════════════════════════════════════════════════════
images:
  - name: harbor.omicrm.services/ci/vigov-service-platform
    newTag: CHUA-TRIEN-KHAI-LAN-NAO
  - name: harbor.omicrm.services/ci/vigov-service-identity
    newTag: CHUA-TRIEN-KHAI-LAN-NAO
  - name: harbor.omicrm.services/ci/vigov-web-admin
    newTag: CHUA-TRIEN-KHAI-LAN-NAO
  # MỖI ẢNH TRONG `base/` PHẢI CÓ MỘT DÒNG Ở ĐÂY. Thiếu một dòng thì `kustomize` KHÔNG báo
  # lỗi — nó giữ nguyên `CHUA-GHIM-THE` của base, và lượt deploy đỏ ở ImagePullBackOff, cách
  # xa nguyên nhân.
  - name: harbor.omicrm.services/ci/vigov-service-comms
    newTag: CHUA-TRIEN-KHAI-LAN-NAO
  - name: harbor.omicrm.services/ci/vigov-service-documents
    newTag: CHUA-TRIEN-KHAI-LAN-NAO
  - name: harbor.omicrm.services/ci/vigov-service-finance
    newTag: CHUA-TRIEN-KHAI-LAN-NAO
  - name: harbor.omicrm.services/ci/vigov-service-petitions
    newTag: CHUA-TRIEN-KHAI-LAN-NAO

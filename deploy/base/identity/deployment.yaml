# Dịch vụ `identity` — tài khoản cán bộ, RBAC, cơ cấu tổ chức, danh tính công dân, phiên, OTP.
#
# Nó giữ phần lớn bề mặt REST: `/api/v1/{staff,roles,role-permissions,sessions,org-units,
# communes,...}` — 15 trong 23 tuyến của `kb/20-contracts/openapi.json`. Bốn dịch vụ khác nay
# cũng có tuyến thật và đã có manifest riêng (comms · documents · finance · petitions);
# `reporting` vẫn 0 tuyến nên vẫn chưa, xem deploy/README.md.
#
# NÓ PHỤC VỤ gRPC, VÀ HAI DÒNG NGAY ĐÂY TỪNG NÓI NGƯỢC LẠI. `cmd/server/main.go:351` mở một
# listener thứ hai ở `GRPC_LISTEN_ADDR` (mặc định `:9090`) và đăng ký `IdentityService`
# (main.go:459) — đó là đường DUY NHẤT để bốn dịch vụ kia đổi cookie phiên lấy principal cán
# bộ, và `.env.example:114` đã ghi sẵn `IDENTITY_GRPC_ADDR=identity:9090`.
#
# Thiếu cổng 9090 ở đây và ở `service.yaml`, cộng với thiếu nhãn `vigov.vn/grpc` mà quy tắc 3
# của `mang/netpol.yaml` dựa vào, thì hỏng theo kiểu KHÔNG CÓ GÌ BÁO: identity xanh, probe
# xanh, REST của nó chạy — chỉ có mọi tuyến có kiểm quyền của bốn dịch vụ kia trả 401 cho
# phiên hợp lệ. Đúng cảnh mà main.go:388-390 mô tả là thứ máy chủ gRPC ấy sinh ra để chấm dứt.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: vigov
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: identity }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
        app.kubernetes.io/part-of: vigov
        vigov.vn/be-mat: rest    # NetworkPolicy: nhận 8080 từ ingress
        vigov.vn/grpc: "co"      # NetworkPolicy: nhận 9090 từ pod cùng namespace
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: identity }

      # Đăng nhập bị cắt đôi bởi một lượt deploy sẽ để lại bản ghi audit nói rằng một người
      # đã đăng nhập trong khi không cookie nào được phát — trạng thái quy định lưu trữ không
      # cho phép. Tiến trình đóng êm THẬT: HTTP `Shutdown` với ngữ cảnh 20 giây song song với
      # `GracefulStop` của gRPC (`service-identity/cmd/server/main.go:356-418`), nên 45 giây ở
      # đây là để đoạn ấy chạy xong chứ không phải một con số cho đẹp.
      terminationGracePeriodSeconds: 45

      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }

      containers:
        - name: server
          image: harbor.omicrm.services/ci/vigov-service-identity:CHUA-GHIM-THE
          imagePullPolicy: IfNotPresent

          ports:
            - { name: rest, containerPort: 8080 }
            # 9090 KHÔNG ĐƯỢC PHƠI RA INTERNET: `insecure.NewCredentials()`, không TLS, và nó
            # không đi qua lớp kiểm quyền của bề mặt REST. Thứ chặn thật là NetworkPolicy quy
            # tắc 3 (`mang/netpol.yaml`) cộng với `GRPC_CALLER_KEY` trên mỗi RPC — cả hai, chứ
            # không phải một trong hai.
            - { name: grpc, containerPort: 9090 }

          env:
            # Bắt buộc. `platformclient.Dial` từ chối khởi động khi rỗng — fail closed, có
            # tên (`core/platformclient/directory.go:66`). Thiếu nó thì mọi xã trả 404 và
            # người ta đi tìm DNS cả buổi chiều.
            - name: PLATFORM_GRPC_ADDR
              value: platform:9090
          envFrom:
            - configMapRef: { name: cau-hinh-chung }
            - secretRef:    { name: bi-mat-identity }

          startupProbe:
            httpGet: { path: /healthz, port: rest }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /healthz, port: rest }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: rest }
            periodSeconds: 20
            failureThreshold: 5

          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits:   { memory: 384Mi }

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

          volumeMounts:
            - { name: tmp, mountPath: /tmp }

      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }

      imagePullSecrets:
        - name: harbor-vigov

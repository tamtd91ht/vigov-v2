apiVersion: v1
kind: Service
metadata:
  name: petitions
spec:
  selector: { app.kubernetes.io/name: petitions }
  ports:
    - { name: rest, port: 8080, targetPort: rest }
    # Tên DNS trong cụm: petitions.<namespace>.svc.cluster.local:9090
    # Đây là giá trị `PETITIONS_GRPC_ADDR` của `identity` (chặn xoá bộ phận còn giữ hồ sơ,
    # `CountOrgUnitHoldings`). Không có dòng này thì mọi lần xoá bộ phận bị từ chối.
    - { name: grpc, port: 9090, targetPort: grpc }

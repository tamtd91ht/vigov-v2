syntax = "proto3";

package vigov.comms.v1;

import "google/protobuf/timestamp.proto";

// comms — Thông tin – truyền thông.
//
// Contract rules that apply to every RPC here:
//   * tenant_id travels in gRPC METADATA, never in a message body, under the key
//     "x-tenant-id" (lowercase — gRPC lowercases every key). A body is data the caller
//     declares, and a caller naming its own commune is a caller granting itself access
//     (rule 1, forbidden #2); the metadata is set by the client interceptor out of
//     context.Context, never passed as a business argument.
//   * a receiver that finds no "x-tenant-id" REFUSES the call with INVALID_ARGUMENT. It
//     never falls back to a default commune and never infers one from the payload — a
//     default on the isolation path collapses isolation silently, tests still green.
//   * the key sits inside the "x-tenant" prefix that core/httpx.StripTenantHeaders already
//     deletes from client-supplied requests, so a client that tries to inject it at the
//     public edge loses it before any handler runs.
//   * a `tenant_id` FIELD on a message is a DIFFERENT thing: an attribute of a stored
//     record, an answer the server returns. Never an input, never read to decide what the
//     caller may see.
//   * field numbers are never reused; a removed field becomes `reserved`
//   * new fields are always optional with a safe default
//
// ONE business RPC (2026-09-29): DeliverStaffNotifications, for the automation jobs.

service CommsService {
  rpc Health(HealthRequest) returns (HealthResponse);

  // DeliverStaffNotifications puts notices into the header-bell inbox of named STAFF of the commune
  // in "x-tenant-id" — the unified inbox of docs/ui-ux/08-thong-bao.md §8 ("Nhắc sắp/quá hạn — sinh
  // bởi job Nhắc việc sắp đến hạn và đã quá hạn").
  //
  // WHY IT EXISTS (user decision 2026-09-29): the automation jobs of docs/ui-ux/14-cau-hinh.md §9 run
  // in service-petitions and service-documents, and their staff notices are delivered by comms.
  // service-comms/migrations/0005_thong_bao_noi_bo.sql:63-69 refused to invent this inbox because
  // it is fed by OTHER services — an inter-service contract whose source of truth is `.proto`. This
  // is that contract.
  //
  // # NOT AN ANNOUNCEMENT, AND NOT THE CITIZEN CHANNEL
  //
  // `Thông báo` names three things (ubiquitous-language.md: `announcements` · `public-notices` ·
  // `notifications`). This RPC is the THIRD: a system notice to one member of staff. It is not an
  // internal announcement (§5 — authored by a person holding `announcement.create`, frozen, counted
  // for acknowledgement) and never reaches a citizen. Writing reminders into the announcement book
  // would bury the commune's real announcements under machine-generated rows and fake an author.
  //
  // # IDEMPOTENT BY THE CALLER'S KEY — rule 2, invariant 5
  //
  // A notice is delivered AT MOST ONCE per (commune, `idempotency_key`, recipient). A retried run, a
  // second replica, or a later run redoing a crashed one sends the same key and creates nothing new.
  // The FIRST delivery wins: a repeat with a different title is not an update, it is a duplicate.
  //
  // THE KEY IS BUILT FROM THE BUSINESS ITEM, NEVER FROM THE RUN — a crashed run is redone by a later
  // run with another run id, and a key carrying the run id sends everything twice. The recipes the
  // jobs use (the caller owns them; comms treats the key as opaque):
  //
  //   sla_reminders, one digest per person per day   sla_reminders:due_soon:<work_kind>:<YYYY-MM-DD>
  //   sla_reminders, overdue, once per day late      sla_reminders:overdue:<work_kind>:<record id>:<YYYY-MM-DD>
  //   escalation, once per level, ever               escalation:<work_kind>:<record id>:<unit_head|chairman>
  //   weekly_digest, once per ISO week               weekly_digest:<work_kind>:<YYYY-Www>
  //
  // The date is the LOCAL date (Asia/Ho_Chi_Minh) of the run's `claimed_at`
  // (identity.v1.AutomationRun). `<record id>` is the record's internal id — never a citizen's
  // phone, name or anything else rule 3 lists.
  //
  // # WHAT A NOTICE MAY SAY — rule 3
  //
  // `title` and `body` are Vietnamese sentences the caller composes, and they are STORED and SHOWN.
  // They carry business codes (a task's title, an arrival number, a count) and NEVER citizen personal
  // data: not a petition's content, not a citizen's name, phone, address or coordinates. The
  // reference system put a petition's summary in the body (../vigov-require/apps/api/app/workers/
  // sla.py, `row.summary[:280]`); that is the line not to copy. A recipient who needs the content
  // follows `link` to a screen that checks their permission.
  //
  // # WHO MAY BE ADDRESSED
  //
  // Staff business codes of THIS commune — from identity (ResolveOrgUnitPermissionHolders,
  // ResolveLeadershipStaff) or the holder codes the caller's own records store. Comms does NOT
  // re-resolve them: a code that names nobody in this commune yields a row nobody in this commune can
  // read, because the inbox is read by (commune, signed-in code). That is harmless, and the caller
  // is still responsible for not sending one.
  //
  // # ONE TRANSACTION, ONE AUDIT ENTRY (rule 6)
  //
  // Every notice of one call, and ONE audit entry with the system principal, commit together or not
  // at all. The entry's delta carries kinds, recipient codes and counts — never `title` or `body`,
  // for the reason service-comms/internal/app/thong_bao_noi_bo.go gives for announcements: free text
  // can name a person and the trail is never deleted.
  //
  // NEVER LOG THIS REQUEST. The generated String() prints `title` and `body` in full. Log counts.
  //
  // # THE STATUS CODES ARE PART OF THE CONTRACT
  //
  //   OK                  every notice either created or already present — see the response.
  //   INVALID_ARGUMENT    the CALLER is wrong, and NOTHING is written: empty or over-long
  //                       `notifications`, an empty or over-long key, kind unspecified, no recipient
  //                       or too many, an empty or over-long title or body, a `link` that is not a
  //                       relative path. All or nothing — a half-delivered batch cannot be told from a
  //                       whole one.
  //   NOT_FOUND           NEVER produced.
  //   UNAUTHENTICATED     NEVER produced by this RPC — it belongs to the caller-key interceptor.
  //   UNAVAILABLE etc.    nothing written. Retrying the SAME request is safe and expected: the keys
  //                       make it deliver once.
  rpc DeliverStaffNotifications(DeliverStaffNotificationsRequest) returns (DeliverStaffNotificationsResponse);
}

message HealthRequest {}
message HealthResponse {
  bool ok = 1;
}

// What a notice is about — what the bell draws as its icon, what a filter groups by, and (since
// ADR 0079 Q3) which Zalo on/off box of the commune it answers to. Values are added when a producer
// exists, never reserved ahead: the other bell items of 08-thong-bao.md §8 and the ten spec-11 events
// with no producer (task assigned, extension request, …) are phase 2 of ADR 0079 Q3.
//
// English identifiers on the wire; the value comms stores in its inbox column follows ADR 0011
// (Vietnamese enum values) and is comms' mapping — one wire value, one stored value, listed beside
// each value below (service-comms/migrations/0021_zalo_kinds_per_domain.sql).
//
// # TWO GENERATIONS, ONE ENUM (08/10/2026)
//
// Values 1–3 carry no domain: "due soon" for a task, a document and a petition is one value, and an
// unassigned-unit notice travelled as OVERDUE because no value of its own existed. ADR 0079 Q3 makes
// each (domain, shape) a box a commune switches separately, so values 5–16 name the domain IN THE
// VALUE. A domain FIELD beside `kind` was rejected: (a) it makes illegal pairs representable — a
// domain on WEEKLY_DIGEST, an UNASSIGNED with no domain — and comms would need a pair table and a
// refusal rule for each; (b) a value with no field is exactly what old producers already send, so the
// field buys no compatibility the enum does not; (c) one wire value per stored value is the mapping
// the inbox, the Zalo dispatcher and 0021's CHECKs already speak.
//
// # WHAT COMMS DOES WITH THE OLD VALUES — they stay valid, for as long as a producer may send them
//
//   DUE_SOON   (1) → stored `sap-den-han`
//   OVERDUE    (2) → stored `qua-han`        (old producers also send unassigned notices under it;
//                                            comms cannot tell, and does not try)
//   ESCALATION (3) → stored `leo-thang`
//
// They are NOT translated to a per-domain value: comms does not know the domain, and guessing one from
// `link` or the key would be inventing a classification into rows that can never be edited (0010
// guard). A commune's Zalo box set is mapped AT READ (0021 header, "THE READ-TIME MAP"): `qua-han`
// ticked means every `*.qua-han` and `*.chua-cu-nguoi` — exactly what it received before.
//
// # ROLLOUT ORDER — comms FIRST, producers second
//
// A comms build that predates values 5–16 maps them to "" and refuses the WHOLE batch with
// INVALID_ARGUMENT (service-comms/internal/grpc/server.go kindFromWire). So: deploy comms that knows
// 5–16; then switch service-petitions and service-documents. A producer switched first fails its runs
// (outcome recorded, nothing delivered) until comms catches up — loud, not silent, and nothing is lost
// because the next run sends the same idempotency keys. Switching kind mid-day does NOT re-deliver:
// deduplication is per (commune, key, recipient) and the first delivery wins — `kind` is not in it.
//
// Retiring 1–3 (and narrowing 0021's settings CHECK) is a later, separate change, after every producer
// sends 5–16 — never in the change that adds them. They are then `reserved`, never renumbered.
enum StaffNotificationKind {
  STAFF_NOTIFICATION_KIND_UNSPECIFIED = 0;

  // LEGACY, no domain → `sap-den-han`. "Bạn có N việc sắp đến hạn". Producers move to 5 / 9 / 13.
  STAFF_NOTIFICATION_KIND_DUE_SOON = 1;

  // LEGACY, no domain → `qua-han`. One late record, once per day late — and, from old producers, an
  // unassigned-unit notice too. Producers move to 6 / 10 / 14 (late) and 7 / 11 / 15 (unassigned).
  STAFF_NOTIFICATION_KIND_OVERDUE = 2;

  // LEGACY, no domain → `leo-thang`. One late record crossing a threshold of ResolveEscalationInstants,
  // once per level. Producers move to 8 / 12 / 16.
  STAFF_NOTIFICATION_KIND_ESCALATION = 3;

  // The Monday summary for leadership → `ban-tin-tuan`. NOT legacy and NOT split per domain: spec 11
  // has one digest event, and the three digests are told apart by their idempotency key, not by a
  // kind a commune could switch separately (0021 header).
  STAFF_NOTIFICATION_KIND_WEEKLY_DIGEST = 4;

  // --- Task (`nhiem_vu`, producer service-petitions, work kind `nhiem-vu`) ---------------------------

  // → `nhiem-vu.sap-den-han`. The daily "N việc sắp đến hạn" digest for tasks.
  STAFF_NOTIFICATION_KIND_TASK_DUE_SOON = 5;

  // → `nhiem-vu.qua-han`. One late task, once per day late.
  STAFF_NOTIFICATION_KIND_TASK_OVERDUE = 6;

  // → `nhiem-vu.chua-cu-nguoi`. The holding unit has assigned nobody past `sla.unassigned_hold_hours`
  // (ResolveUnassignedHoldInstants). Spec 11 "Bộ phận chưa cử người làm"; split OUT of OVERDUE.
  STAFF_NOTIFICATION_KIND_TASK_UNASSIGNED = 7;

  // → `nhiem-vu.leo-thang`. One late task crossing an escalation threshold, once per level.
  STAFF_NOTIFICATION_KIND_TASK_ESCALATION = 8;

  // --- Document (`van-ban` family, producer service-documents) ----------------------------------------
  //
  // DOCUMENT, not INCOMING_DOCUMENT: spec 11 groups "Văn bản, đơn thư" as ONE event family and 0021
  // stores `van-ban.*`, so the đơn thư register, when it gets a producer, sends these same values
  // instead of a fourth family.

  // → `van-ban.sap-den-han`.
  STAFF_NOTIFICATION_KIND_DOCUMENT_DUE_SOON = 9;

  // → `van-ban.qua-han`.
  STAFF_NOTIFICATION_KIND_DOCUMENT_OVERDUE = 10;

  // → `van-ban.chua-cu-nguoi`.
  STAFF_NOTIFICATION_KIND_DOCUMENT_UNASSIGNED = 11;

  // → `van-ban.leo-thang`.
  STAFF_NOTIFICATION_KIND_DOCUMENT_ESCALATION = 12;

  // --- Petition (`phieu_phan_anh`, producer service-petitions, work kind `phan-anh`) ------------------

  // → `phan-anh.sap-den-han`.
  STAFF_NOTIFICATION_KIND_PETITION_DUE_SOON = 13;

  // → `phan-anh.qua-han`.
  STAFF_NOTIFICATION_KIND_PETITION_OVERDUE = 14;

  // → `phan-anh.chua-cu-nguoi`.
  STAFF_NOTIFICATION_KIND_PETITION_UNASSIGNED = 15;

  // → `phan-anh.leo-thang`.
  STAFF_NOTIFICATION_KIND_PETITION_ESCALATION = 16;

  // --- Disbursement (`giai-ngan`, producer service-finance) ------------------------------------------

  // → `giai-ngan.nhac-ten`. The staff member was mentioned in a disbursement project's discussion
  // (ADR 0081 #5; prototype vigov-require apps/api/app/modules/budget/service.py:1065-1076). One notice
  // per mentioned person, never the author.
  //
  // BELL ONLY — NEVER ZALO (ADR 0081 #5, decided 08/10/2026). It is not a Zalo box a commune can tick
  // and comms queues no Zalo delivery for it: 0023 admits it on staff_notification only, not on
  // zalo_channel_setting.kinds nor zalo_delivery.kind.
  //
  // ROLLOUT: comms first, as for 5–16 — a comms build that predates 17 refuses the whole batch.
  STAFF_NOTIFICATION_KIND_DISBURSEMENT_MENTION = 17;
}

message DeliverStaffNotificationsRequest {
  // 1 TO 100 notices; empty or more is INVALID_ARGUMENT, never a silent truncation. A run with more
  // pages. The TOTAL number of recipients across the call is at most 1 000 — one transaction must
  // stay bounded.
  repeated StaffNotification notifications = 1;
}

// One notice, addressed to one or more staff of this commune.
message StaffNotification {
  // The caller's key — see the RPC comment for the recipes. 1 to 200 printable ASCII characters.
  // Deduplication is per (commune, key, recipient), so one key addresses a whole set of recipients
  // and a recipient added in a later call with the same key still receives it once.
  string idempotency_key = 1;

  // UNSPECIFIED is INVALID_ARGUMENT.
  StaffNotificationKind kind = 2;

  // Staff business codes (`CB-…`, `nguoi_dung.ma`) — NEVER an internal id (rule 6, invariant 8: the
  // inbox is read by the code the session carries). 1 to 200; duplicates collapsed.
  repeated string recipient_ma = 3;

  // The bell's first line, Vietnamese, 1 to 200 characters. No citizen personal data — see the RPC.
  string title = 4;

  // The bell's second line (`mo_ta`), 0 to 500 characters; "" draws none. Same rule as `title`.
  string body = 5;

  // Where the bell item leads, in web-admin: a RELATIVE PATH starting with a single "/" (the route
  // segments are Vietnamese — `/nhiem-vu?soon=true`). "" means the item
  // leads nowhere. Anything with a scheme, a host or "//" is INVALID_ARGUMENT: a stored absolute URL
  // is an open redirect waiting in every recipient's bell. No personal data in it (rule 3,
  // forbidden #4). At most 300 characters.
  string link = 6;

  // The records a due-soon digest names, each with its deadline — so comms can apply the commune's
  // Zalo "Sắp đến hạn: nhắc trước" lead (ADR 0079 lô 5 Q13) to the ZALO copy only. Added 08/10/2026.
  //
  // WHY A FIELD, NOT THE BODY: the digest today carries its codes in `body` and no deadline, so comms
  // cannot tell which of them fall inside a Zalo lead narrower than the bell's due-soon window (the
  // producer's set comes from identity.v1.ResolveDueSoonCutoff). Parsing `body` would make free text a
  // contract; asking the producer to know the Zalo lead would put a comms setting in two services.
  //
  // WHICH KINDS: set ONLY on a due-soon kind — DUE_SOON (1), TASK_DUE_SOON (5), DOCUMENT_DUE_SOON (9),
  // PETITION_DUE_SOON (13). Non-empty on any other kind is INVALID_ARGUMENT (the whole batch, as for
  // every other refusal): a deadline list on an OVERDUE notice is an illegal pair, not a hint.
  //
  // EMPTY = AN OLD PRODUCER, NOT "NOTHING IS DUE": comms keeps TODAY's behaviour for that notice — the
  // Zalo copy is the bell's title and body, unfiltered. Never read empty as "drop the Zalo copy".
  //
  // WHAT COMMS DOES WITH IT:
  //   * the BELL row is unchanged — same `title`, `body`, `link`, same one row per recipient. The
  //     items never narrow, re-word or re-count the bell.
  //   * the ZALO copy keeps only the items inside the commune's Zalo lead, and comms composes the Zalo
  //     text from the KEPT items (count and codes), never from `title`/`body`, which count the wider
  //     bell set. No kept item → no Zalo message for that notice (the bell row still exists).
  //   * the Zalo lead can only NARROW: the producer sends the bell's set, so a Zalo lead longer than
  //     the bell window cannot reach records the producer never sent.
  //   * WHEN the window is measured is comms' decision and has a trap: this digest is delivered ONCE
  //     per recipient per day (key `sla_reminders:due_soon:<work_kind>:<YYYY-MM-DD>`, first delivery
  //     wins). Filtering only at the moment of delivery drops every item that enters the Zalo lead
  //     later that day — it is never sent again before it is overdue. Comms must schedule against
  //     the deadline, not just filter at receipt.
  //
  // VALIDATION (INVALID_ARGUMENT, nothing written): at most 500 items; every `code` 1 to 100
  // printable characters, unique within the notice; every `deadline` set. A producer with more than
  // 500 sends the 500 EARLIEST deadlines — the ones a narrower Zalo lead keeps first.
  //
  // ROLLOUT ORDER — proto, then comms, then producers. Unlike kinds 5–16 the order is not load-bearing:
  // a comms build that predates this field ignores it as an unknown field and sends today's Zalo copy.
  // Producers (service-petitions, service-documents automation_jobs) fill it when they switch.
  //
  // Same rule 3 as `body`: the items name exactly the records `body` counts — business codes only,
  // and never a record the recipient may not see (an ADR 0030 `can-bo` petition reaches only
  // recipients holding `feedback.restricted` — the producer's recipient chain decides that per record,
  // and the items follow the same per-recipient list as `body`). Not logged, like the rest of the
  // request.
  repeated DueSoonItem due_soon_items = 7;
}

// One record in a due-soon digest.
message DueSoonItem {
  // The business code the digest shows — a task's `ma`, a petition's `ma_tra_cuu`, an incoming
  // document's `MaVanBanDen`. Never an internal id, never citizen personal data.
  string code = 1;

  // The record's STORED deadline (`han_xu_ly`, `han_xu_ly_xong`), copied as read — rule 10,
  // invariant 2: fixed once, at the act that fixes it, never recomputed. A producer that computes a
  // deadline here moves a commitment already made. Comms only compares it with the Zalo lead; it never
  // derives a deadline or an overdue state from it. Unset is INVALID_ARGUMENT — a due-soon record
  // always has one (DueSoonAt requires it).
  google.protobuf.Timestamp deadline = 2;
}

// Wrapped: adding a field later must not change the RPC signature.
message DeliverStaffNotificationsResponse {
  // One item per requested notice, mapped by `idempotency_key` — a key requested twice in one call
  // is INVALID_ARGUMENT, so the key is unambiguous.
  repeated StaffNotificationDelivery items = 1;
}

message StaffNotificationDelivery {
  // Echoed — the KEY the caller maps by.
  string idempotency_key = 1;

  // Recipients for whom this call CREATED an inbox row.
  uint32 created = 2;

  // Recipients who already had this key — a retry or a redone run. Not an error.
  uint32 already_delivered = 3;
}

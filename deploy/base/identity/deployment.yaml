# Dịch vụ `identity` — tài khoản cán bộ, RBAC, cơ cấu tổ chức, danh tính công dân, phiên, OTP.
#
# Hôm nay đây là dịch vụ DUY NHẤT có route REST thật: `/api/v1/{staff,roles,role-permissions,
# sessions,org-units,communes}` (kb/20-contracts/openapi.json). Bảy dịch vụ còn lại là khung
# sinh sẵn — chưa đáng đưa lên cụm, xem deploy/README.md.
#
# Nó KHÔNG phục vụ gRPC: `cmd/server/main.go` chỉ mở một `http.Server`. Vì thế không có cổng
# 9090 và không có nhãn `vigov.vn/grpc` — khai một cổng không ai nghe là mời người sau tin
# rằng có đường gọi tới nó.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: vigov
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: identity }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
        app.kubernetes.io/part-of: vigov
        vigov.vn/be-mat: rest
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: identity }

      # Đăng nhập bị cắt đôi bởi một lượt deploy sẽ để lại bản ghi audit nói rằng một người
      # đã đăng nhập trong khi không cookie nào được phát — trạng thái quy định lưu trữ không
      # cho phép (`service-identity/cmd/server/main.go:258`).
      terminationGracePeriodSeconds: 45

      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }

      containers:
        - name: server
          image: registry.vihat.vn/vigov/vigov-service-identity:CHUA-GHIM-THE
          imagePullPolicy: IfNotPresent

          ports:
            - { name: rest, containerPort: 8080 }

          env:
            # Bắt buộc. `platformclient.Dial` từ chối khởi động khi rỗng — fail closed, có
            # tên (`core/platformclient/directory.go:66`). Thiếu nó thì mọi xã trả 404 và
            # người ta đi tìm DNS cả buổi chiều.
            - name: PLATFORM_GRPC_ADDR
              value: platform:9090
          envFrom:
            - configMapRef: { name: cau-hinh-chung }
            - secretRef:    { name: bi-mat-identity }

          startupProbe:
            httpGet: { path: /healthz, port: rest }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /healthz, port: rest }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: rest }
            periodSeconds: 20
            failureThreshold: 5

          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits:   { memory: 384Mi }

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

          volumeMounts:
            - { name: tmp, mountPath: /tmp }

      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }

      imagePullSecrets:
        - name: harbor-vigov

# Dịch vụ `finance` — kế hoạch vốn, dự án đầu tư, chứng từ giải ngân.
#
# VÌ SAO NÓ CÓ MANIFEST HÔM NAY, trong khi `deploy/README.md` từng viết "ba dịch vụ, không
# phải mười": nó đã hết là khung sinh sẵn. Nó phục vụ ba tuyến REST THẬT —
# `GET /api/v1/capital-plan-categories`, `/investment-projects`, `/investment-projects/{id}`
# (kb/20-contracts/openapi.json) — và chạy di trú lược đồ của chính nó lúc khởi động.
# `reporting` thì chưa: 0 tuyến, nên nó KHÔNG có manifest, và đó là một lựa chọn đã cân nhắc
# chứ không phải chỗ sót — xem `deploy/README.md`.
#
# NÓ KHÔNG PHỤC VỤ gRPC. `service-finance/cmd/server/main.go:119` chỉ mở một listener HTTP.
# Vì thế không có cổng 9090 và không có nhãn `vigov.vn/grpc` — khai một cổng không ai nghe là
# mời người sau tin rằng có đường gọi tới nó.
#
# NÓ GỌI RA hai dịch vụ qua gRPC: `platform` (Host → xã) và `identity` (cookie phiên →
# principal cán bộ, `main.go:92`). Thiếu địa chỉ của một trong hai thì tiến trình TỪ CHỐI
# khởi động — fail closed, có tên — chứ không phục vụ với một nửa chuỗi kiểm.
#
# ⚠ HÔM NAY CHƯA CÓ ĐƯỜNG VÀO TỪ INTERNET, có chủ ý. `deploy/overlays/*/ingress.yaml` vẫn
# đưa toàn bộ `/api/v1` về `identity`, và cách định tuyến khi dịch vụ thứ hai có route là câu
# CHƯA CHỐT của chủ dự án (ba lối ra, khối cảnh báo đầu tệp ingress). Manifest này dựng đúng
# cái pod; nó nhận được yêu cầu vào đúng ngày câu ấy được chốt, không sớm hơn.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance
  labels:
    app.kubernetes.io/name: finance
    app.kubernetes.io/part-of: vigov
spec:
  # MỘT replica, KHÔNG phải hai — và con số này có hạn dùng. Chừng nào Ingress còn chưa đưa
  # yêu cầu nào tới đây, replica thứ hai là một pod không phục vụ ai trên một cụm 3 node
  # (chính lập luận `deploy/README.md` dùng để hoãn tám manifest). Ngày tuyến REST của dịch
  # vụ này có đường vào, nâng lên 2: với 1 replica thì mọi lượt khởi động lại là một khoảng
  # đứt, và `maxUnavailable: 0` bên dưới không cứu được điều đó.
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: finance }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finance
        app.kubernetes.io/part-of: vigov
        # NetworkPolicy `cho-phep-rest-tu-ingress` (deploy/base/mang/netpol.yaml, quy tắc 2)
        # chọn pod BẰNG NHÃN NÀY để mở cổng 8080 từ ingress controller. Chính sách nền là
        # từ-chối-tất-cả, nên thiếu nhãn = pod không nhận được yêu cầu nào, và KHÔNG CÓ GÌ BÁO:
        # pod xanh, probe xanh, rollout xanh, chỉ có người dùng gặp timeout.
        vigov.vn/be-mat: rest
    spec:
      # Không có khối này, scheduler được phép xếp mọi replica lên cùng một node, và rút node
      # đó là mất trọn dịch vụ. Nó cũng là thứ ràng buộc pod dôi ra của `maxSurge: 1` phải
      # rơi sang node khác trong lúc rolling update.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: finance }

      # 45 GIÂY, VÀ CON SỐ NÀY NAY CÓ THẬT MỘT ĐOẠN MÃ ĐỂ CHỜ. Tới 22/09/2026 đây là 30 giây kèm
      # một chú thích nói thẳng rằng tiến trình KHÔNG bắt tín hiệu, nên hạn ấy không bao giờ trôi
      # hết — chú thích ấy đã đúng, và nó tự đặt điều kiện gỡ: *"ngày dịch vụ này có đóng-êm, sửa
      # số ở đây"*. Ngày ấy là hôm nay.
      #
      # `cmd/server/main.go` nay `signal.Notify` rồi `srv.Shutdown` với ngữ cảnh **20 giây**.
      # 45 > 20 là điều kiện để đoạn ấy chạy tới cuối: đảo ngược thì k8s `SIGKILL` trước khi
      # `Shutdown` xong, và toàn bộ phần đóng êm thành thứ trông như đang canh mà không bao giờ
      # chạy hết. Sửa một trong hai số thì phải đọc lại số kia.
      #
      # Ở dịch vụ này nó đáng nhất: chứng từ giải ngân là bản ghi nghiệp vụ không được phép dở dang.
      terminationGracePeriodSeconds: 45

      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532          # distroless:nonroot — khai lại để đọc được từ đây
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }

      containers:
        - name: server
          # Thẻ CỐ Ý không dùng được: áp thẳng base là một nhầm lẫn, và nó phải đổ chứ không
          # được kéo nhầm ảnh. Thẻ thật do job `vigov-deploy` đặt bằng `kubectl set image`
          # — overlay chỉ ghim thẻ cho LẦN CÀI ĐẦU.
          image: harbor.omicrm.services/ci/vigov-service-finance:CHUA-GHIM-THE
          imagePullPolicy: IfNotPresent

          ports:
            - { name: rest, containerPort: 8080 }

          env:
            # BẮT BUỘC PHẢI CÓ DÒNG NÀY, khác `platform` và `identity` — chúng đọc
            # `cfg.ListenAddr` vốn mặc định `:8080`, còn dịch vụ này gọi
            # `cfg.ListenAddrHoac(":8086")` (main.go:117) nên KHÔNG đặt biến là tiến trình nghe
            # ở 8086. Khi ấy hai thứ gãy cùng lúc và cả hai đều im: probe httpGet cổng 8080
            # không ai trả lời, và NetworkPolicy quy tắc 2 chỉ mở 8080/3000 từ ingress.
            - { name: LISTEN_ADDR, value: ":8080" }
            # Bắt buộc. `platformclient.Dial` từ chối khởi động khi rỗng — fail closed, có tên
            # (`core/platformclient/directory.go:66`). Thiếu nó thì mọi xã trả 404.
            - { name: PLATFORM_GRPC_ADDR, value: platform:9090 }
            # Bắt buộc, cùng lý do: đây là đường DUY NHẤT để cookie phiên thành principal cán
            # bộ (`main.go:92`). Dịch vụ này không sở hữu sổ phiên và không được import của
            # identity (luật 2, cấm #1). Giá trị này đòi `identity` phải thật sự phơi cổng
            # 9090 — xem `deploy/base/identity/service.yaml`.
            - { name: IDENTITY_GRPC_ADDR, value: identity:9090 }
          envFrom:
            - configMapRef: { name: cau-hinh-chung }
            # Secret PHẢI có ít nhất: DATABASE_DSN · GRPC_CALLER_KEY · SESSION_SIGNING_KEYS.
            # Ba khoá này là điều kiện KHỞI ĐỘNG, không phải tuỳ chọn: `core/config.Load` gom
            # đủ tên còn thiếu rồi thoát (config.go:321-352). SESSION_SIGNING_KEYS nằm trong
            # danh sách kể cả khi dịch vụ này không tự phát phiên — Load đòi nó ở staging/prod.
            - secretRef: { name: bi-mat-finance }

          # /healthz nằm NGOÀI chuỗi phân giải xã, có chủ ý (`main.go:157`): nó trả lời "tiến
          # trình này còn sống", đúng hay sai không phụ thuộc xã nào đang hỏi — nên probe
          # không cần gửi Host. HỆ QUẢ PHẢI BIẾT: nó vẫn xanh khi CSDL hỏng.
          startupProbe:
            httpGet: { path: /healthz, port: rest }
            periodSeconds: 5
            failureThreshold: 60          # 5 phút — di trú CSDL chạy TRONG tiến trình lúc
                                          # khởi động (`main.go:212`, core/migrate.Chay) và ôm
                                          # `pg_advisory_lock` suốt lượt chạy, nên replica thứ
                                          # hai ĐỢI replica thứ nhất. Probe chặt ở đây là một
                                          # vòng lặp khởi động lại.
          readinessProbe:
            httpGet: { path: /healthz, port: rest }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: rest }
            periodSeconds: 20
            failureThreshold: 5

          resources:
            requests: { cpu: 100m, memory: 96Mi }
            # CHỈ giới hạn bộ nhớ, không giới hạn CPU: nhị phân Go tĩnh, và một CPU limit trên
            # cụm 3 node chỉ tạo throttling đúng lúc tải cao nhất.
            limits:   { memory: 384Mi }

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

          volumeMounts:
            - { name: tmp, mountPath: /tmp }

      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }

      imagePullSecrets:
        - name: harbor-vigov

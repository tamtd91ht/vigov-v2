syntax = "proto3";

package vigov.identity.v1;

import "google/protobuf/timestamp.proto";

// OperatorService is the Vihat OPERATOR realm of service-identity, exposed to service-platform —
// the only HTTP edge of the operator area, on OPERATOR_HOST (ADR 0048 §"Chốt của chủ dự án —
// 28/09/2026" #2 + #4). The use cases behind it: service-identity/internal/app/operator_auth.go and
// operator_enrollment.go. Accounts were created, granted, locked and reset ONLY by the server-side
// CLI `operatorctl` (ADR 0048 §"Chốt bước 1", row "Ai tạo, ai cấp quyền"). Since the owner decisions
// of 13/10/2026 the operator OWNER may also create, grant and reset through the owner-only RPCs below;
// locking, unlocking, MFA reset and setting the owner stay with `operatorctl`.
//
// A SEPARATE SERVICE, NOT METHODS ON IdentityService, FOR THREE REASONS:
//
//   * A different trust domain. IdentityService serves the staff and citizen realms of ONE commune
//     at a time; an operator belongs to no commune (ADR 0048 condition #3). A staff token accepted
//     on an operator path, or the reverse, is ADR 0048 stop condition #6. Separate services mean
//     separate generated clients: a caller holding an OperatorServiceClient cannot reach a staff
//     RPC by a typo, and the other way round.
//   * The commune rule is stated once, here, not scattered. IdentityService's header states "the
//     commune travels in metadata, always"; seven exceptions scattered through it would make that
//     sentence false. Here the exception is the realm's own seven RPCs, stated once, below — and the
//     three RPCs that act ON or read FROM a commune (SetMiniAppSecret, RetireMiniAppSecret,
//     ListMiniAppSecretStatuses) are NOT exempt.
//   * One caller. Only service-platform calls this service. NOTHING IN THE WIRING ENFORCES THAT:
//     it is served on identity's inter-service listener behind the one shared caller key (ADR
//     0025), which every ViGov service holds. What a stray caller could do with it is exactly what
//     the operator HTTP routes allow somebody holding the same credentials — no RPC here answers
//     without a password, a second factor, or a live `op1.` token.
//
// THE COMMUNE, FOR THE SEVEN REALM RPCs: NONE, AND THAT IS THE ANSWER TO A STOP CONDITION, NOT A
// SHORTCUT. OpenOperatorSession through CompleteOperatorEnrollment are on
// core/grpcx.methodsWithoutTenant, BY FULL NAME. Adding a name there is a STOP CONDITION (ADR 0012,
// decision 1, `0012-grpc-boundary-contract.md:96-98`); the owner answered it YES on 2026-10-01 — ADR
// 0048 §"Chốt của chủ dự án — 01/10/2026" #2. They pass ADR 0012's test with a structural no: an
// operator belongs to no commune, so there is no commune to know at call time. What keeps the
// exemption from widening the hole:
//
//   * No request of those seven has a commune field, and no handler of theirs reads tenant.From —
//     there is no commune to read, and inventing one would be a default on the isolation path
//     (rule 1, forbidden #1).
//   * No response of those seven carries business data of any commune. The `ops.*` keys returned by
//     ResolveOperatorSession authorise PLATFORM METADATA routes only (ADR 0003, ADR 0048 condition
//     #2); service-platform has no gRPC client into a business service.
//
// THE COMMUNE, FOR THE TWO MINI APP SECRET RPCs: THE TARGET COMMUNE, IN METADATA "x-tenant-id", LIKE
// EVERY OTHER INTER-SERVICE CALL (rule 2, invariant 8). SetMiniAppSecret and RetireMiniAppSecret
// write a commune's own data (service-identity mini_app_secret, migration 0021, ADR 0066), so they
// are NOT on methodsWithoutTenant and never may be: the commune interceptor on this port
// (buildOperatorGRPCServer, the same chain as 9090) refuses them with INVALID_ARGUMENT when the
// metadata is absent — exactly what that interceptor was kept on this port for. The commune is the
// one the operator's URL names on service-platform's operator route; it is a CLAIM of the caller,
// and identity does not trust it alone: SetMiniAppSecret re-reads the platform binding (App ID →
// commune) before it writes, and RetireMiniAppSecret only ever touches rows already scoped to that
// commune. Neither request has a commune FIELD — the body is caller-declared data (rule 1,
// forbidden #2). Why these two live HERE and not on IdentityService: ADR 0070 §"Bổ sung 02/10/2026"
// #6 — the secret travels platform → identity on the operator port 9093 and nowhere else, and an
// operator principal is resolved only by this service. ListMiniAppSecretStatuses, the read beside
// them, follows the same commune rule for the same reason (it reads the same commune-owned rows) and
// is likewise never on methodsWithoutTenant.
//
// THE COMMUNE, FOR ListActiveStaffCounts: NONE — IT ANSWERS ABOUT EVERY COMMUNE AT ONCE. It cannot
// know a commune at call time (structural no to ADR 0012 decision 1's test), so it is on
// core/grpcx.methodsWithoutTenant BY FULL NAME. Putting it there was a STOP CONDITION (ADR 0012,
// `0012-grpc-boundary-contract.md:96-98`) answered by the owner for THIS RPC on 2026-10-11, on the
// condition stated next — the yes for ListZaloBotCommuneStats (ADR 0074) did not carry over, and this
// one does not carry over to any other RPC. What keeps it narrow: no request field names a commune; the response is COUNTS keyed by commune
// ULID, no staff data; and, unlike the realm RPCs' exemption argument above, it still answers only to
// a live `op1.` token whose operator holds an `ops.*` key, resolved HERE (see the RPC).
//
// THE OWNER-ONLY RPCs (owner decisions 13/10/2026, ADR 0048 amendment of that date). There is exactly
// ONE operator OWNER (operator_account.is_owner, one row at most). Only the owner manages operator
// accounts, creates a commune's administrator account and resets another person's password. Seven
// RPCs, in two groups by THE COMMUNE THEY CARRY:
//
//   * NO COMMUNE — ListOperatorAccounts, CreateOperatorAccount, SetOperatorPermissions,
//     ResetOperatorPassword. They read and write operator_account, which has no tenant_id (ADR 0048
//     §28/09 #1): a structural no to ADR 0012 decision 1's test, the same as the realm RPCs. On
//     core/grpcx.methodsWithoutTenant BY FULL NAME, owner's yes of 13/10/2026 — it does not carry over
//     to any other RPC. No request field names a commune; no response carries a commune's data.
//   * THE TARGET COMMUNE IN METADATA "x-tenant-id" — ListCommuneStaffAccounts,
//     CreateCommuneAdminAccount, ResetStaffPassword. They read and write `nguoi_dung` rows of ONE
//     commune, which the caller KNOWS at call time (the commune of the operator's URL), so they fail
//     ADR 0012's test and are NEVER on methodsWithoutTenant — exactly as SetMiniAppSecret. No request
//     has a commune field (rule 1, forbidden #2); the rows they touch are scoped by the metadata alone.
//
// THE ACTOR IS RESOLVED HERE, FROM `session_token` — NEVER A CODE THE CALLER NAMES. Every one of the
// seven takes the `op1.` cookie verbatim; identity resolves it (refreshing the idle timer — call only
// for a request a person made) and checks `is_owner` on the account IT resolved, in the same request.
// An `actor_code` field was rejected: the caller key (ADR 0025) is shared by EVERY ViGov service, so a
// caller-declared "who" would let any service holding it reset any password in any commune by naming
// the owner's `VH-` code — and the argument that keeps the no-commune RPCs on the exemption list
// ("none answers without a password, a second factor or a live `op1.` token") would become false for
// the most powerful RPCs in the file. Not the owner → PERMISSION_DENIED, nothing read or written.
//
// TEMPORARY PASSWORDS travel in the REQUEST of the three create/reset RPCs that set one and in no
// other message, ever: the owner types it, platform forwards it and keeps nothing, identity hashes it
// (argon2id) and keeps only the hash. No response echoes it. Every set password is TEMPORARY:
// must_change_password = true, so the person replaces it at the next sign-in and from then on the
// owner no longer knows it (the reasoning of service-identity/internal/app/tai_khoan_can_bo.go, #9).
//
// EVERY WRITE of the seven: ONE transaction holding the change, the revocation of the target's
// sessions where the RPC says so, and ONE trail entry (rule 6, invariant 3), actor = the RESOLVED
// owner's `VH-` code (rule 6, invariant 8 — no fallback to operator_id), actor_kind "operator",
// actor_ip = client_ip, `reason` in the delta where the request has one, NEVER a password or a hash.
// Which trail table holds the entry of a commune-scoped write is the implementation's per the ADR
// 0048 amendment; the same transaction is not negotiable.
//
// AUTHENTICATION IS HYBRID AND NOT CACHED (ADR 0048 §01/10 #2). service-platform verifies the `op1.`
// signature locally (it holds OPERATOR_SESSION_SIGNING_KEYS too), then calls ResolveOperatorSession
// on EVERY operator request. Signature-only was rejected: it cannot measure the 5-minute idle limit
// and makes a revocation wait for the 8-hour absolute expiry. Declared in
// kb/30-indexes/transaction-boundaries.json, `xac_thuc_van_hanh_lien_service`.
//
// STATUS CODES SAY WHETHER THE CALL WAS MADE PROPERLY; THE RESPONSE SAYS WHAT WAS DECIDED. Same
// discipline as ResolveStaffPrincipal: a wrong password is an ordinary answer, not an RPC failure.
// One table for every RPC of this service:
//
//   OK                   decided. Read `outcome` (or, for ResolveOperatorSession, `principal`).
//   INVALID_ARGUMENT     a WIRING FAULT in the caller, decided from the request alone, before any
//                        lookup — so it says nothing about any account: an empty `session_token`
//                        on a session-bound RPC; both `totp_code` and `recovery_code` on
//                        OpenOperatorSession; on the two Mini App secret RPCs also: no "x-tenant-id"
//                        metadata (the commune interceptor), an `app_id` that is not 1-32 digits, an
//                        `app_secret` outside its shape, a `reason` empty or over 500 runes. On the
//                        owner-only RPCs also: no "x-tenant-id" on the three commune-scoped ones, an
//                        empty `target_code` / `user_id`, an email or display name outside its shape,
//                        a `permission_keys` entry outside the realm's closed `ops.*` list, a `reason`
//                        empty or over 500 runes. Nothing was counted, nothing was written. The status
//                        MESSAGE never quotes a value.
//   FAILED_PRECONDITION  the operator realm is not configured in identity
//                        (OPERATOR_SESSION_SIGNING_KEYS or OPERATOR_TOTP_ENCRYPTION_KEY absent —
//                        app.ErrOperatorRealmNotConfigured). A deployment fault: the caller answers
//                        503 and alerts. Never "refused", never retried blindly.
//                        ON SetMiniAppSecret ONLY, A SECOND MEANING: the platform does not bind this
//                        App ID, live, to the target commune as its own app. See that RPC for why the
//                        two meanings cannot be confused by a conforming caller.
//                        ON CreateCommuneAdminAccount, THE SAME KIND OF SECOND MEANING: the target
//                        commune is not a live commune on the platform. ON ResetStaffPassword: the
//                        target account is administratively locked. Same argument as above.
//   NOT_FOUND            RetireMiniAppSecret: the App ID has no live settings in the target commune.
//                        SetOperatorPermissions / ResetOperatorPassword: no operator account has
//                        `target_code`. ResetStaffPassword: the target commune has no live sign-in
//                        account with `user_id` (another commune's id is simply "none here"). Answered
//                        only AFTER the owner check, so a non-owner learns nothing about who exists.
//                        Never produced by the seven realm RPCs, nor by any List RPC (nothing is an
//                        empty list).
//   ALREADY_EXISTS       CreateOperatorAccount: an operator account already has this email (compared
//                        case-folded, the operator_account index). CreateCommuneAdminAccount: the target
//                        commune already holds this sign-in email, under the SAME uniqueness rule
//                        identity's staff directory already enforces on `nguoi_dung.email` — not a
//                        second rule written for this RPC. Answered only AFTER the owner check.
//                        Nothing written.
//   UNAUTHENTICATED      NEVER produced by these RPCs. It belongs to the caller-key interceptor
//                        (core/grpcx.UnaryServerCallerAuth, ADR 0025) and means the DEPLOYMENT is
//                        misconfigured. Reusing it for "wrong password" would make a fleet-wide
//                        outage indistinguishable from one operator's typo.
//   RESOURCE_EXHAUSTED   NEVER produced here. The per-IP limit (20 / 15 min / IP, ADR 0048 §01/10 #3)
//                        is service-platform's, in Redis, and it is checked BEFORE this service is
//                        called — so a throttled attempt is never counted toward the 12-hour
//                        account lockout.
//   UNAVAILABLE etc.     the call did not happen, or its transaction rolled back: no session, no
//                        audit entry, no counted failure. IT IS NOT "refused" and NOT "signed out":
//                        the caller answers 503 (fail closed — identity down means the operator area
//                        is down, the cost the owner accepted on 01/10).
//
// THE ONE CREDENTIAL ANSWER. Unknown email, wrong password, wrong or replayed TOTP code, used or
// unknown recovery code, password without a second factor, locked account, disabled account,
// temporary password past its 24 hours, pending TOTP secret past its 10 minutes: ALL are
// OPERATOR_AUTH_OUTCOME_REFUSED, byte for byte, with no reason field and no way to add one without
// editing this paragraph (app.ErrOperatorLoginFailed). An operator account reaches every commune's
// platform metadata, so the directory a second answer would leak is worth more than a commune's.
// The response TIME is equalised too (operator_auth.go, timingEqualiser).
//
// NEVER LOG A MESSAGE OF THIS FILE. The generated String() prints every field in full (`debug_redact`
// is a no-op in protobuf-go v1.36.12, measured 2026-09-20). Requests carry passwords, TOTP codes,
// recovery codes, bearer tokens and a commune's Zalo app secret; responses carry bearer tokens, TOTP
// secrets and recovery codes (rule 8), and requests carry an operator's email (personal data, rule
// 3). The owner-only RPCs add temporary passwords (requests) and the names and sign-in emails of
// operators and of a commune's staff (responses — personal data, rule 3). Log the fields you chose —
// the business code `VH-xxxxx` / `CB-xxxxx`, the outcome — never the message.
//
// Not batched (ADR 0012 decision 2 does not apply): every caller is ONE HTTP request holding ONE
// credential, so a batched form is a shape no caller can fill.
//
// Field numbers are never reused; a removed field becomes `reserved`. New fields are always
// optional with a safe default.
service OperatorService {
  // OpenOperatorSession signs an operator in: password AND exactly one second factor, in ONE call
  // (app.OperatorAuth.Login). There is no "password step" RPC that answers before the second factor:
  // a password-only answer would be a free password oracle (operator_auth.go, the `default:` branch).
  //
  //   ACCEPTED             `session` is set. Failure counter cleared, session row + login_succeeded
  //                        entry written in one transaction.
  //   REFUSED              the one credential answer above. A counted failure is COMMITTED.
  //   ENROLLMENT_REQUIRED  the password was RIGHT and the account has no active second factor yet
  //                        (first sign-in, or after `operatorctl reset-mfa`). No session. The
  //                        caller sends the person to BeginOperatorEnrollment. Only ever answered
  //                        after the password verified, and never for a temporary password past its
  //                        24 hours (that is REFUSED — the path no longer exists).
  //
  // Both factors in one request is INVALID_ARGUMENT (a property of the request, decided before any
  // lookup). Not idempotent: every ACCEPTED call opens a new session.
  rpc OpenOperatorSession(OpenOperatorSessionRequest) returns (OpenOperatorSessionResponse);

  // ResolveOperatorSession turns the `op1.` token into the operator behind it, on EVERY operator
  // request (app.OperatorAuth.ResolveSession), and REFRESHES THE IDLE TIMER (operator_session
  // last_seen_at). So it is not a pure read: a caller must call it only for requests a person made —
  // a background poll would hold a session open for 8 hours with nobody at the screen, which is the
  // 5-minute idle limit (TCVN 14423, ADR 0048 §"Chốt bước 1" security amendment) defeated silently.
  //
  //   OK + principal      live session, account enabled. Keys read live, in this request.
  //   OK + no principal   not usable, for ANY reason: bad signature, other realm (a staff `v1.`
  //                       token), absolute expiry, idle expiry, revoked, account disabled. One
  //                       answer. The caller answers 401 and clears the cookie.
  //   INVALID_ARGUMENT    empty `session_token` — a caller with no cookie must not call at all.
  //
  // The caller's own signature check comes FIRST and does not replace this call: it saves a round
  // trip for garbage, it decides nothing for a well-signed token.
  rpc ResolveOperatorSession(ResolveOperatorSessionRequest) returns (ResolveOperatorSessionResponse);

  // RevokeOperatorSession signs the bearer out: revokes the session NAMED BY THE TOKEN — never a
  // session id from a parameter — and writes logged_out in the same transaction
  // (app.OperatorAuth.Logout).
  //
  //   ACCEPTED          revoked.
  //   SESSION_NOT_LIVE  nothing to revoke (already expired, revoked, account disabled, bad token).
  //
  // Either way the caller clears the cookie and answers success: signing out of a dead session is
  // not an error to the person.
  rpc RevokeOperatorSession(RevokeOperatorSessionRequest) returns (RevokeOperatorSessionResponse);

  // ChangeOperatorPassword: a signed-in operator sets a new password, re-proving the current
  // password AND a TOTP code (a stolen cookie alone must not take the account over). On success
  // EVERY session of the account is revoked, the current one included (app.OperatorAuth.
  // ChangePassword); the caller clears the cookie and sends the person to sign in again.
  //
  //   ACCEPTED               changed; every session revoked.
  //   NEW_PASSWORD_REJECTED  `new_password_refusal` says which rule. Decided from the new value
  //                          alone, before any account read — it says nothing about the account.
  //   REFUSED                current password or TOTP wrong, or the account is locked. COUNTED as a
  //                          SESSION-HOLDER failure: the lockout it may cause revokes every session
  //                          (ADR 0048 §"Chốt bước 1" security amendment, last row).
  //   SESSION_NOT_LIVE       the token names no live session. The caller answers 401.
  rpc ChangeOperatorPassword(ChangeOperatorPasswordRequest) returns (ChangeOperatorPasswordResponse);

  // RegenerateOperatorRecoveryCodes voids every live recovery code and returns a fresh batch of 10,
  // shown ONCE (app.OperatorAuth.RegenerateRecoveryCodes). Needs a current TOTP code.
  //
  //   ACCEPTED          `recovery_codes` is set.
  //   REFUSED           TOTP wrong or account locked. COUNTED as a session-holder failure, as above.
  //   SESSION_NOT_LIVE  the caller answers 401.
  rpc RegenerateOperatorRecoveryCodes(RegenerateOperatorRecoveryCodesRequest) returns (RegenerateOperatorRecoveryCodesResponse);

  // BeginOperatorEnrollment: first step of a first sign-in (or the first after an MFA reset). Checks
  // the TEMPORARY password and stores a fresh pending TOTP secret, valid 10 minutes, audited as
  // totp_enrollment_started (app.OperatorAuth.BeginEnrollment). Calling it again replaces the
  // pending secret — an operator who lost the QR code starts over.
  //
  //   ACCEPTED  `provisioning_uri` / `manual_entry_key` are set.
  //   REFUSED   the one credential answer — including an account that already HAS a factor
  //             (replacing a factor is `operatorctl reset-mfa`, never a password) and a temporary
  //             password past its 24 hours. A wrong password is COUNTED.
  rpc BeginOperatorEnrollment(BeginOperatorEnrollmentRequest) returns (BeginOperatorEnrollmentResponse);

  // CompleteOperatorEnrollment: second step. Temporary password + the operator's own new password +
  // a code from the pending secret. In ONE transaction: activates the factor, sets the password,
  // issues 10 recovery codes, opens a session, writes four audit entries
  // (app.OperatorAuth.CompleteEnrollment).
  //
  //   ACCEPTED               `session` and `recovery_codes` are set.
  //   NEW_PASSWORD_REJECTED  `new_password_refusal` says which rule; decided before any account
  //                          read (SAME_AS_CURRENT here means equal to the temporary password).
  //   REFUSED                the one credential answer — including "BeginOperatorEnrollment was not
  //                          called" and a pending secret past its 10 minutes. A wrong password or
  //                          a wrong code is COUNTED.
  rpc CompleteOperatorEnrollment(CompleteOperatorEnrollmentRequest) returns (CompleteOperatorEnrollmentResponse);

  // ---- Acts ON a commune: the commune's own Mini App sign-in settings (ADR 0066, ADR 0070) ----
  //
  // WHO CALLS AND WHEN. service-platform's operator route on the commune detail screen of
  // platform-admin (ADR 0070 #4, §"Bổ sung 02/10/2026" #6), for a request a person made, AFTER its
  // own ResolveOperatorSession and `ops.mini_app.manage` check on that same request. Platform
  // forwards the secret and keeps nothing: it does not store it, log it, or put it in its own trail.
  //
  // THE OPERATOR IS RESOLVED HERE, FROM THE TOKEN — never a code the caller names. Same shape as
  // ChangeOperatorPassword: `session_token` is the `op1.` cookie verbatim, and identity resolves it
  // itself (app.OperatorAuth.ResolveSession, which also refreshes the idle timer). A `VH-` code in
  // the request would be a caller-declared "who" on an archival trail; the token is the credential
  // the person actually holds. Identity also checks `ops.mini_app.manage` on the principal it
  // resolved — the key ADR 0070 #5 names — so a write into a commune's data never rests on a check
  // made in another process alone. No TOTP re-entry (ADR 0070 #5).
  //
  // THE TRAIL. One entry per call, in the SAME transaction as the version change (rule 6, invariant
  // 3), in service-identity, attributed `actor_kind = "operator"` and `actor = <VH- code>` of the
  // resolved principal (rule 6, invariant 8 — an empty code refuses the write, no fallback to
  // operator_id), `actor_ip = client_ip`, `reason` in the delta. It names the App ID and whether a
  // secret is set, NEVER the value (ADR 0066). Visible in the OPERATOR log, not on the commune staff's
  // audit screen (ADR 0070 §"Bổ sung 02/10/2026" #7) — where it is stored to achieve that is the
  // implementation's (TASK-P2b), the "same transaction" is not negotiable.
  //
  // ANSWERS, beyond the service table:
  //
  //   OK + ACCEPTED          written; the response says what, never the secret.
  //   OK + SESSION_NOT_LIVE  the token names no live session. Caller answers 401. Nothing written.
  //   OK + PERMISSION_DENIED live session, `ops.mini_app.manage` not granted. Caller answers 403.
  //                          Nothing written.
  //
  // NOT IDEMPOTENT, AND SAFE TO RETRY: each ACCEPTED call is a new version row and a new entry. A
  // retry after a lost response writes one more version holding the same secret — two true entries,
  // never a wrong state.

  // SetMiniAppSecret seals `app_secret` and makes it the live Zalo app secret of `app_id` in the
  // target commune: retire the live version, insert the next, one transaction
  // (app.MiniAppSecretAdmin.SetSecret). The `--demo` switch carries over unchanged.
  //
  //   FAILED_PRECONDITION  the platform (ResolveMiniApp, read live, not cached) does not bind this
  //                        App ID, live, to THE TARGET COMMUNE as its own app: unregistered, turned
  //                        off, bound to ANOTHER commune, the shared main app, or its commune inactive.
  //                        ONE answer for all five — so it says nothing about another commune's apps.
  //                        A secret stored where the binding does not point would never be read.
  //                        The caller answers 409 ("bind / turn on the App ID first"). Nothing sealed,
  //                        nothing written. ORDER THAT FOLLOWS: in a change of App ID the platform
  //                        binding is switched FIRST, then this RPC is called for the NEW App ID.
  //                        NOT TO BE CONFUSED with the realm-not-configured meaning in the service
  //                        table: that one is answered by ResolveOperatorSession, which the caller
  //                        has already called on the same request — a caller that skipped it is not
  //                        a conforming caller.
  //   INVALID_ARGUMENT     shape only (see the request fields), decided before any lookup.
  rpc SetMiniAppSecret(SetMiniAppSecretRequest) returns (SetMiniAppSecretResponse);

  // RetireMiniAppSecret ends the live settings of `app_id` in the target commune — its own app signs
  // nobody in under that App ID until they are set again (app.MiniAppSecretAdmin.Retire). The sealed
  // bytes stay in the retired version row (rule 7: no hard delete).
  //
  // DELIBERATELY NO BINDING CHECK: retiring REDUCES what the App ID can do, so it is allowed after
  // the binding moved or was turned off — which is exactly when ADR 0070 #4 needs it ("đổi/gỡ thì
  // khoá của App ID cũ tự thu hồi"). It only touches rows already scoped to the target commune, so it
  // cannot reach another commune's settings.
  //
  //   NOT_FOUND         this App ID has no live settings in the target commune — never set, already
  //                     retired, or another commune's App ID (rows are per commune, so "another
  //                     commune's" is simply "none here"; nothing leaks). For the automatic revoke
  //                     after a change or removal, the caller reads it as "nothing left to revoke":
  //                     done, not an error to the operator. Nothing written.
  //   INVALID_ARGUMENT  shape only, decided before any lookup.
  rpc RetireMiniAppSecret(RetireMiniAppSecretRequest) returns (RetireMiniAppSecretResponse);

  // ListMiniAppSecretStatuses reports, for EVERY App ID with live settings in the target commune,
  // whether a secret is set and "since when, by whom" — the "đặt lúc … bởi …" line of the commune
  // detail screen (owner decision 05/10/2026). NEVER the secret, nor anything derived from it: no
  // value, prefix, length, hash or fingerprint (see MiniAppSecretVersion).
  //
  // WHY A gRPC READ AND NOT A PLATFORM COPY. mini_app_secret is owned by service-identity
  // (kb/30-indexes/data-ownership.json); service-platform may read it only through this contract
  // (rule 2, invariant 3). A "secret set" flag mirrored into platform's `mini_app` row would be a
  // second source for one fact, and it drifts the first time a version is set or retired from
  // `operatorctl`, which never passes through platform.
  //
  // WHY THE WHOLE COMMUNE AND NOT ONE app_id. The screen shows the commune; the caller already knows
  // which App IDs platform binds to it and joins on `app_id` — a bound App ID absent from the list is
  // "no secret set". Listing every live row, not only the bound ones, also surfaces settings LEFT
  // LIVE under an App ID the binding moved away from (an automatic revoke that did not complete,
  // ADR 0070 #4) — exactly what an operator must see in order to retire them. One commune, one
  // credential, one call: the "not batched" paragraph above is about many credentials, which this is
  // not. Rows are per commune, so nothing of another commune is reachable.
  //
  // WHO MAY READ. The same session resolution as Set/Retire (from `session_token`, refreshing the
  // idle timer — call it only for a request a person made). The key check is ADR 0073 #1: ANY
  // granted `ops.*` key may open a commune and read its detail; writing stays `ops.mini_app.manage`.
  // A live session holding ZERO keys is PERMISSION_DENIED — the same line platform's opauth.AnyKey
  // draws, re-checked here because the rows are identity's.
  //
  // A PURE READ: no version row, no trail entry (no personal data is read — rule 6 invariant 7 does
  // not apply; set_by is an operator's business code). Idempotent.
  //
  //   OK + ACCEPTED          `statuses` holds every live version of the target commune; EMPTY is a
  //                          valid answer (nothing ever set, or everything retired).
  //   OK + SESSION_NOT_LIVE  caller answers 401.
  //   OK + PERMISSION_DENIED live session holding no `ops.*` key. Caller answers 403.
  //   INVALID_ARGUMENT       empty `session_token`, or no "x-tenant-id" metadata.
  rpc ListMiniAppSecretStatuses(ListMiniAppSecretStatusesRequest) returns (ListMiniAppSecretStatusesResponse);

  // ---- Reads ACROSS communes: counts for the operator console ----

  // ListActiveStaffCounts reports, per commune, how many ACTIVE STAFF ACCOUNTS it has — the
  // denominator of "Đã ghép nối" (linked / total) on platform-admin's Zalo Bot communes table (ADR
  // 0074 §"Tài nguyên URL", owner 11/10/2026). COUNTS ONLY: no staff code, name, email, unit, role —
  // nothing that identifies or describes a person (ADR 0003: platform holds metadata, never a
  // commune's people).
  //
  // "ACTIVE STAFF ACCOUNT" (owner, 11/10/2026: "not soft-deleted AND not locked"), as identity's rows
  // say it: a `nguoi_dung` row with `deleted_at IS NULL AND co_tai_khoan AND dang_hoat_dong` — the
  // same three conditions store.locChonNguoi uses for "somebody who can act". `co_tai_khoan` is part of
  // "account": a directory-only person has no sign-in, so can never pair with a bot, and counting them
  // would make 100% linked unreachable. A failed-login lockout is NOT "locked" here: it is temporary
  // and the person is still staff.
  //
  // @cross-tenant: one operator screen shows every commune's uptake of the Zalo Bot channel; there is
  // no single commune to scope it to. The identity store query behind it carries the same
  // `// @cross-tenant:` marker (rule 1, forbidden #6).
  //
  // WHO MAY READ. The operator is resolved HERE from `session_token`, as ListMiniAppSecretStatuses
  // does (refreshing the idle timer — call it only for a request a person made), never from a code
  // the caller names: this RPC sits on the exemption list, and that list's argument for OperatorService
  // is "none answers without a password, a second factor or a live `op1.` token" (core/grpcx,
  // methodsWithoutTenant). An `actor_code` field would be the first exception to that sentence, for a
  // read the caller key alone would then unlock. Key: ANY granted `ops.*` key (ADR 0073 #1's read
  // line, as ListMiniAppSecretStatuses); service-platform's own route guard is the narrower check
  // (`ops.zalo_bot.manage` on the Zalo Bot screen).
  //
  // AUDITED (rule 6, invariant 7 — a read across communes). One entry per ACCEPTED call in identity's
  // operator trail (operator_audit_log: actor_kind "operator", actor = the RESOLVED principal's `VH-`
  // code — rule 6 invariant 8, no fallback; actor_ip = client_ip), naming the act and the number of
  // communes answered, never a count per commune. Platform-scope, so it never lands on a commune's
  // staff audit screen. FAIL CLOSED: if the entry cannot be written, the RPC fails (UNAVAILABLE) and
  // returns no counts — an unaudited cross-commune read is the state rule 6 forbids.
  //
  // A COMMUNE WITH ZERO ACTIVE STAFF ACCOUNTS IS ABSENT from the list: identity does not own the
  // commune list (platform does), so it can only report communes it holds rows for. The caller joins on
  // tenant_id and shows an absent commune as 0. Ordered by tenant_id — a stable order with no meaning.
  //
  //   OK + ACCEPTED          `counts` as above; EMPTY is a valid answer.
  //   OK + SESSION_NOT_LIVE  caller answers 401. Nothing read, no entry.
  //   OK + PERMISSION_DENIED live session holding no `ops.*` key. Caller answers 403. No entry.
  //   INVALID_ARGUMENT       empty `session_token`. Never "no x-tenant-id": the RPC is on
  //                          methodsWithoutTenant (see the service).
  //
  // A read: idempotent apart from the trail entry and the idle-timer refresh. Not paginated: one row
  // per commune, two scalars each.
  rpc ListActiveStaffCounts(ListActiveStaffCountsRequest) returns (ListActiveStaffCountsResponse);

  // ---- OWNER ONLY, no commune: operator accounts (owner decisions 13/10/2026) ----
  //
  // On core/grpcx.methodsWithoutTenant by full name. Session resolved here, `is_owner` checked here
  // (see the service comment). Common answers of the four:
  //
  //   OK + ACCEPTED          done; the response carries the account as it now stands.
  //   OK + SESSION_NOT_LIVE  caller answers 401. Nothing read or written.
  //   OK + PERMISSION_DENIED live session, operator is not the owner. Caller answers 403. Nothing
  //                          read or written — the owner check comes before any account lookup.
  //
  // THE OWNER FLAG IS NOT SET BY ANY RPC. No request below has an `is_owner` field: there is exactly
  // one owner, set outside this contract (migration / `operatorctl`), and a field that could grant it
  // would make "exactly one" a promise the caller key could break.
  //
  // ACTING ON ONE'S OWN ACCOUNT (target_code = the resolved owner's code) is NOT decided by this
  // contract: the staff side refuses it (customer decision #14, tai_khoan_can_bo.go); whether the
  // operator side does is the ADR 0048 amendment's to state, and the implementation follows it.

  // ListOperatorAccounts lists EVERY operator account, disabled ones included (the owner manages
  // them), ordered by `code`. A read: no row written apart from the idle-timer refresh. Not
  // paginated: a handful of ViHAT people.
  //
  // NOT AUDITED as a read, by the same reasoning as operatorctl's `list`: it reads no commune's data
  // and no citizen's; the realm's own roster, by the one person who manages it. If the ADR 0048
  // amendment states otherwise, the amendment wins.
  rpc ListOperatorAccounts(ListOperatorAccountsRequest) returns (ListOperatorAccountsResponse);

  // CreateOperatorAccount creates an operator account with a TEMPORARY password and the given
  // `ops.*` keys, in ONE transaction with its trail entries (account created + one per key granted, as
  // operatorctl writes them). The new account has must_change_password = true and NO second factor:
  // its first sign-in goes through Begin/CompleteOperatorEnrollment, and the temporary password stops
  // working after 24 hours unused (migration 0014) exactly as an `operatorctl create` one does.
  // `code` (`VH-…`) is issued from the platform-wide sequence, never reissued (rule 7, invariant 3).
  //
  //   NEW_PASSWORD_REJECTED  `temporary_password` fails the password policy; `new_password_refusal`
  //                          says which rule. Decided before any account read. Nothing written.
  //   ALREADY_EXISTS         see the service table.
  //
  // NOT IDEMPOTENT: a retry after a lost response answers ALREADY_EXISTS — the account exists, the
  // caller re-reads it with ListOperatorAccounts.
  rpc CreateOperatorAccount(CreateOperatorAccountRequest) returns (CreateOperatorAccountResponse);

  // SetOperatorPermissions makes `permission_keys` the COMPLETE set of keys of the target account:
  // keys absent from it are revoked, keys new in it are granted, one transaction, one trail entry per
  // key granted or revoked (the shape operatorctl's grant/revoke already writes). A change that
  // removes any key revokes every session of the target (ADR 0048 §"Chốt bước 1": "đổi quyền → thu
  // hồi mọi phiên"); the implementation may revoke on any change — never on none.
  //
  // FULL SET, NOT A DIFF: the screen shows checkboxes; sending what it shows makes a retry
  // idempotent (the same set twice is no change and writes no entry) and makes a stale screen's
  // answer visible in the response instead of two half-applied diffs.
  //
  //   NOT_FOUND  no account has `target_code` (after the owner check).
  rpc SetOperatorPermissions(SetOperatorPermissionsRequest) returns (SetOperatorPermissionsResponse);

  // ResetOperatorPassword gives the target account a new TEMPORARY password: must_change_password =
  // true, the 24-hour expiry of a temporary password, every session of the target revoked — one
  // transaction, one trail entry. Whether it also clears a failed-sign-in lockout (`locked_until`) is
  // the ADR 0048 amendment's; `operatorctl unlock` stays the path that certainly does. THE SECOND FACTOR IS
  // KEPT: the person signs in with the temporary password AND their own TOTP, then must set their own
  // password. Replacing a lost second factor stays `operatorctl reset-mfa`.
  //
  //   NEW_PASSWORD_REJECTED  as CreateOperatorAccount. Nothing written.
  //   NOT_FOUND              no account has `target_code`.
  //
  // NOT IDEMPOTENT, SAFE TO RETRY: a retry sets the same temporary password again and writes a
  // second entry — two true entries, never a wrong state.
  rpc ResetOperatorPassword(ResetOperatorPasswordRequest) returns (ResetOperatorPasswordResponse);

  // ---- OWNER ONLY, THE TARGET COMMUNE in metadata "x-tenant-id": a commune's staff accounts ----
  //
  // NEVER on methodsWithoutTenant: the commune interceptor refuses them with INVALID_ARGUMENT when the
  // metadata is absent. Rows are scoped to that commune, so nothing of another commune is reachable.
  // Same SESSION_NOT_LIVE / PERMISSION_DENIED answers as the group above.
  //
  // WHY THIS IS NOT "VIHAT TOUCHING A COMMUNE'S BUSINESS DATA" (ADR 0048 stop condition #2, ADR 0003):
  // a sign-in account is the commune's ACCESS to the system, not its records — no petition, document
  // or citizen is read. The owner decided on 13/10/2026 that the owner may unblock a commune's access
  // (create its administrator, reset a forgotten password). The responses still carry staff NAMES and
  // EMAILS — personal data — so the list is the narrowest the screen needs (no phone, no unit, no
  // position) and the read is AUDITED (rule 6, invariant 7) unless the ADR 0048 amendment carves an
  // explicit exception.

  // ListCommuneStaffAccounts lists the target commune's SIGN-IN ACCOUNTS — `nguoi_dung` rows with
  // deleted_at IS NULL AND co_tai_khoan (directory-only rows are not accounts and are not listed;
  // locked ones ARE, so a reset can be aimed at them). Ordered by `email`.
  //
  //   OK + ACCEPTED   `accounts`; EMPTY is a valid answer (a new commune before its first admin).
  rpc ListCommuneStaffAccounts(ListCommuneStaffAccountsRequest) returns (ListCommuneStaffAccountsResponse);

  // CreateCommuneAdminAccount creates ONE staff account in the target commune holding the commune's
  // administrator role (`vai_tro.ma = 'quan-tri-he-thong'`), with a TEMPORARY password
  // (phai_doi_mat_khau = true), a freshly issued staff business code, one transaction with its trail
  // entry. It is how the owner unblocks a commune whose administrator cannot sign in.
  //
  // THE COMMUNE IS RE-READ LIVE FROM THE PLATFORM before writing (as SetMiniAppSecret re-reads its
  // binding): a commune that does not exist or is inactive → FAILED_PRECONDITION, nothing written —
  // an account under a tenant_id the platform does not serve would be an account nobody can reach.
  //
  // NOT DECIDED HERE: a commune with no `quan-tri-he-thong` role yet (it is created by the first
  // `admin` sign-in, gieo_quan_tri.go). Whether this RPC creates the role or refuses is the ADR 0048
  // amendment's; until it says, the RPC is not implemented.
  //
  //   NEW_PASSWORD_REJECTED  as CreateOperatorAccount. Nothing written.
  //   ALREADY_EXISTS         see the service table.
  //   FAILED_PRECONDITION    see above.
  rpc CreateCommuneAdminAccount(CreateCommuneAdminAccountRequest) returns (CreateCommuneAdminAccountResponse);

  // ResetStaffPassword gives one staff account of the target commune a new TEMPORARY password:
  // phai_doi_mat_khau = true, every session of that account revoked — one transaction, one trail
  // entry. The SAME ACT as a commune administrator's reset (TaiKhoanCanBo.DatLai) with the same
  // refusals, performed by the owner with a password the owner typed instead of a minted one.
  //
  //   NEW_PASSWORD_REJECTED  as CreateOperatorAccount. Nothing written.
  //   NOT_FOUND              see the service table — includes a directory-only row (no sign-in
  //                          account: DatLai's ErrChuaCoTaiKhoan).
  //   FAILED_PRECONDITION    the account is administratively locked (dang_hoat_dong = false:
  //                          DatLai's ErrTaiKhoanDangKhoa — the sign-in read filters it, so the
  //                          password would not work). That lock is the commune's decision; this RPC
  //                          does not lift it. Nothing written. Not confusable with realm-not-
  //                          configured, for the reason given on SetMiniAppSecret.
  //
  // NOT IDEMPOTENT, SAFE TO RETRY, as ResetOperatorPassword.
  rpc ResetStaffPassword(ResetStaffPasswordRequest) returns (ResetStaffPasswordResponse);
}

// What an RPC of OperatorService decided. Each RPC's comment lists the subset it answers; a value
// outside that subset is never sent.
//
// UNSPECIFIED (0) IS NEVER SENT by a conforming server, and a caller that receives it — an identity
// older than a field, a server bug — treats it as REFUSED: no session, no change, fail closed.
enum OperatorAuthOutcome {
  OPERATOR_AUTH_OUTCOME_UNSPECIFIED = 0;
  // Done: session opened, password changed, codes issued, session revoked, enrolment started.
  OPERATOR_AUTH_OUTCOME_ACCEPTED = 1;
  // The ONE credential answer (see the service comment). Never refined.
  OPERATOR_AUTH_OUTCOME_REFUSED = 2;
  // OpenOperatorSession only: password right, no active second factor. Grants nothing.
  OPERATOR_AUTH_OUTCOME_ENROLLMENT_REQUIRED = 3;
  // Session-bound RPCs only: the token names no live session.
  OPERATOR_AUTH_OUTCOME_SESSION_NOT_LIVE = 4;
  // ChangeOperatorPassword / CompleteOperatorEnrollment, and the owner-only RPCs that set a temporary
  // password (CreateOperatorAccount, ResetOperatorPassword, CreateCommuneAdminAccount,
  // ResetStaffPassword) — there it refuses `temporary_password`: see `new_password_refusal`.
  OPERATOR_AUTH_OUTCOME_NEW_PASSWORD_REJECTED = 5;
  // SetMiniAppSecret / RetireMiniAppSecret / ListMiniAppSecretStatuses / ListActiveStaffCounts only:
  // a live session whose operator lacks the key the act needs (`ops.mini_app.manage` for the two
  // writes, any `ops.*` key for the two reads). Nothing written. Never sent by the seven realm RPCs — none of them is guarded by
  // a key.
  // ALSO the seven OWNER-ONLY RPCs: a live session whose operator is not the owner (is_owner false).
  // Nothing read or written.
  OPERATOR_AUTH_OUTCOME_PERMISSION_DENIED = 6;
}

// Which password rule refused the new value (service-identity/internal/domain/mat_khau.go —
// the staff policy, reused). Names the RULE, never the value.
enum NewPasswordProblem {
  NEW_PASSWORD_PROBLEM_UNSPECIFIED = 0;
  NEW_PASSWORD_PROBLEM_EMPTY = 1;
  // Not valid UTF-8.
  NEW_PASSWORD_PROBLEM_NOT_UTF8 = 2;
  // Fewer runes than `min_length`.
  NEW_PASSWORD_PROBLEM_TOO_SHORT = 3;
  // More runes than `max_length`.
  NEW_PASSWORD_PROBLEM_TOO_LONG = 4;
  // Equal to the current password (ChangeOperatorPassword) or to the temporary one
  // (CompleteOperatorEnrollment).
  NEW_PASSWORD_PROBLEM_SAME_AS_CURRENT = 5;
}

// Set exactly when outcome is NEW_PASSWORD_REJECTED.
message NewPasswordRefusal {
  NewPasswordProblem problem = 1;
  // The bounds in force (domain.DaiMatKhauToiThieu / DaiMatKhauToiDa), in runes. Sent so the
  // operator console never holds its own copy of "12": two literals are two values that drift
  // (the argument on DaiMatKhauToiThieu).
  uint32 min_length = 2;
  uint32 max_length = 3;
}

// A session just opened. Returned ONCE.
message OperatorSessionGrant {
  // The `op1.` bearer token. A CREDENTIAL (rule 8): the caller sets it as a host-only, HttpOnly,
  // Secure cookie on OPERATOR_HOST (rule 1 forbidden #3, rule 13 invariant 4) and never logs,
  // persists or echoes it. Only the SHA-256 of the session id inside it is stored.
  string session_token = 1;

  // The ABSOLUTE expiry (8 hours). For the cookie's lifetime only. It is NOT when the session stops
  // working: the 5-minute idle limit and revocation can end it sooner, and only
  // ResolveOperatorSession says whether it is live.
  google.protobuf.Timestamp expires_at = 2;

  // The operator's business code, `VH-00001`. Display and log correlation; may be logged.
  string operator_code = 3;
}

message OpenOperatorSessionRequest {
  // The operator account's email as typed. PERSONAL DATA (rule 3): never logged — the server logs a
  // one-way fingerprint of it on refusal. Not normalised by the caller.
  string email = 1;

  // CREDENTIAL. Verbatim, not trimmed: a password is stored exactly as typed (domain/mat_khau.go).
  string password = 2;

  // CREDENTIAL. The 6-digit code from the authenticator app. Exactly one of `totp_code` /
  // `recovery_code` is non-empty; both is INVALID_ARGUMENT, neither is REFUSED (counted).
  string totp_code = 3;

  // CREDENTIAL. A one-time recovery code. Consumed on success.
  string recovery_code = 4;

  // The address the BROWSER connected from, as service-platform observed it on ITS OWN SOCKET —
  // never X-Forwarded-For (any client sets that header).
  //
  // A CLAIM, worth exactly what the caller key is worth (ADR 0025). UNLIKE
  // ResolveStaffPrincipalRequest.client_ip it IS STORED — in operator_audit_log.actor_ip and
  // operator_session.created_ip — because service-platform is the only observer of the address
  // there is: the operator realm has no other edge. It DECIDES NOTHING: the lockout counts per
  // account, the per-IP limit is service-platform's. "" is valid and means "not observed".
  string client_ip = 5;

  // The browser's User-Agent, for operator_session.user_agent. Diagnostics only. The server keeps
  // at most the first 256 runes rather than refusing: a diagnostic field must not fail a sign-in.
  string user_agent = 6;
}

message OpenOperatorSessionResponse {
  // ACCEPTED, REFUSED or ENROLLMENT_REQUIRED.
  OperatorAuthOutcome outcome = 1;
  // Set exactly when outcome is ACCEPTED.
  OperatorSessionGrant session = 2;
}

message ResolveOperatorSessionRequest {
  // The `op1.` token exactly as the cookie held it — verbatim, not parsed, not re-encoded.
  // CREDENTIAL (rule 8): never logged at either end, at any level. Empty is INVALID_ARGUMENT.
  //
  // DELIBERATELY NO client_ip: the use case reads none and writes none, and a field no code reads is
  // a contract that promises something nobody does. Add it (optional, new number) the day a line of
  // code consumes it.
  string session_token = 1;
}

// Wrapped, not a bare OperatorPrincipal: adding a field later must not change the RPC signature.
message ResolveOperatorSessionResponse {
  // ABSENT MEANS NOT SIGNED IN, for one of the reasons the RPC comment lists and deliberately does
  // not distinguish. PRESENT WITH EMPTY permission_keys is different: a live session of an operator
  // who holds no key — the operator is signed in and every guarded operator route answers 403.
  OperatorPrincipal principal = 1;
}

// The operator behind a live session. Scoped to the ONE request it authenticated: never written
// into a token, a cookie, a cache or a disk (rule 5, invariant 4 — a withdrawn key must stop working
// on the next request).
//
// DELIBERATELY ABSENT:
//
//   session id   it is the raw registry key — the store keeps only its SHA-256 — so echoing it is a
//                second copy of a credential in a message somebody will log. The caller already
//                holds it inside the token it verified, and the only job it does (sign-out) is done
//                by RevokeOperatorSession from the token.
//   expiry       decided by the registry and re-read on the next request. A caller holding it is one
//                edit away from deciding validity from it — the revocation hole this RPC closes.
//   tenant_id    an operator has none (ADR 0048 condition #3). Not "", not a placeholder: no field.
//   email        personal data no guard reads (rule 3, invariant 1).
message OperatorPrincipal {
  // The INTERNAL id of operator_account. Authorises; never written into a trail as "who".
  string operator_id = 1;

  // The BUSINESS CODE, `VH-00001` (ADR 0048 §"Chốt bước 1"). What every audit entry records as
  // "who" (rule 6, invariant 8) — in platform_audit_log and in the target commune's audit_log. Never
  // empty on a present principal; a caller that finds it empty refuses the write, no fallback to
  // operator_id.
  string operator_code = 2;

  // Every `ops.<group>.<action>` key granted to this account, read live (operator_permission_grant).
  // The realm's OWN closed list — never a row of the per-commune `quyen` table (ADR 0048 §28/09 #3).
  // Ordered; the order carries no meaning.
  repeated string permission_keys = 3;

  // True when this account is THE operator owner (operator_account.is_owner — exactly one account,
  // owner decisions 13/10/2026), read live like the keys. It lets service-platform show and guard the
  // owner-only screens; it decides nothing on its own — every owner-only RPC re-checks it in identity
  // on the session it resolves. FALSE IS THE SAFE DEFAULT: an identity older than this field sends
  // false, and the caller then treats the operator as not the owner (fail closed).
  bool is_owner = 4;
}

message RevokeOperatorSessionRequest {
  // CREDENTIAL — see ResolveOperatorSessionRequest.session_token. Empty is INVALID_ARGUMENT.
  string session_token = 1;
  // As OpenOperatorSessionRequest.client_ip: stored as the logged_out entry's actor_ip.
  string client_ip = 2;
}

message RevokeOperatorSessionResponse {
  // ACCEPTED or SESSION_NOT_LIVE.
  OperatorAuthOutcome outcome = 1;
}

message ChangeOperatorPasswordRequest {
  // CREDENTIAL. Empty is INVALID_ARGUMENT.
  string session_token = 1;
  // CREDENTIAL. Verbatim.
  string current_password = 2;
  // CREDENTIAL. Verbatim — never trimmed or normalised.
  string new_password = 3;
  // CREDENTIAL. Required: a session alone does not change a password.
  string totp_code = 4;
  // As OpenOperatorSessionRequest.client_ip.
  string client_ip = 5;
}

message ChangeOperatorPasswordResponse {
  // ACCEPTED, NEW_PASSWORD_REJECTED, REFUSED or SESSION_NOT_LIVE.
  OperatorAuthOutcome outcome = 1;
  // Set exactly when outcome is NEW_PASSWORD_REJECTED.
  NewPasswordRefusal new_password_refusal = 2;
}

message RegenerateOperatorRecoveryCodesRequest {
  // CREDENTIAL. Empty is INVALID_ARGUMENT.
  string session_token = 1;
  // CREDENTIAL. Required.
  string totp_code = 2;
  // As OpenOperatorSessionRequest.client_ip.
  string client_ip = 3;
}

message RegenerateOperatorRecoveryCodesResponse {
  // ACCEPTED, REFUSED or SESSION_NOT_LIVE.
  OperatorAuthOutcome outcome = 1;
  // CREDENTIALS, returned HERE AND NOWHERE ELSE — only their SHA-256 is stored. Shown once to the
  // operator; never logged, cached or persisted by the caller. Set exactly when ACCEPTED.
  repeated string recovery_codes = 2;
}

message BeginOperatorEnrollmentRequest {
  // PERSONAL DATA — see OpenOperatorSessionRequest.email.
  string email = 1;
  // CREDENTIAL. The temporary password `operatorctl` printed once.
  string temporary_password = 2;
  // As OpenOperatorSessionRequest.client_ip: stored as the totp_enrollment_started entry's actor_ip.
  string client_ip = 3;
}

message BeginOperatorEnrollmentResponse {
  // ACCEPTED or REFUSED.
  OperatorAuthOutcome outcome = 1;

  // `VH-00001`. Set when ACCEPTED.
  string operator_code = 2;

  // SECRET: the `otpauth://` URI the QR code encodes — it CONTAINS THE TOTP SECRET. Rendered to the
  // operator once; never logged, cached or persisted by the caller. Its label is the operator CODE,
  // never the email (rule 3, forbidden #4). Set when ACCEPTED.
  string provisioning_uri = 3;

  // SECRET: the same TOTP secret in base32, for typing in by hand. Same handling. Set when ACCEPTED.
  string manual_entry_key = 4;
}

message CompleteOperatorEnrollmentRequest {
  // PERSONAL DATA — see OpenOperatorSessionRequest.email.
  string email = 1;
  // CREDENTIAL.
  string temporary_password = 2;
  // CREDENTIAL. The operator's own password from now on. Verbatim.
  string new_password = 3;
  // CREDENTIAL. A code from the PENDING secret BeginOperatorEnrollment issued.
  string totp_code = 4;
  // As OpenOperatorSessionRequest.client_ip.
  string client_ip = 5;
  // As OpenOperatorSessionRequest.user_agent.
  string user_agent = 6;
}

message CompleteOperatorEnrollmentResponse {
  // ACCEPTED, NEW_PASSWORD_REJECTED or REFUSED.
  OperatorAuthOutcome outcome = 1;
  // Set exactly when ACCEPTED.
  OperatorSessionGrant session = 2;
  // CREDENTIALS, returned HERE AND NOWHERE ELSE — see RegenerateOperatorRecoveryCodesResponse.
  // Set exactly when ACCEPTED.
  repeated string recovery_codes = 3;
  // Set exactly when NEW_PASSWORD_REJECTED.
  NewPasswordRefusal new_password_refusal = 4;
}

message SetMiniAppSecretRequest {
  // CREDENTIAL — see ResolveOperatorSessionRequest.session_token. The acting operator is resolved
  // from it; there is no operator field. Empty is INVALID_ARGUMENT.
  string session_token = 1;

  // The Zalo Mini App ID: 1-32 ASCII digits after trimming surrounding space
  // (domain.ValidMiniAppID). A Zalo-issued public identifier, not personal data; may be logged.
  // Anything else is INVALID_ARGUMENT.
  string app_id = 2;

  // SECRET (rule 8) — the commune's Zalo app secret for `app_id`. WRITE-ONLY:
  //   * never echoed — no response of this service carries it, in any form, ever;
  //   * never logged at either end, at any level, nor this whole message (String() prints it);
  //   * never in a status message, an error, a trail entry or a metric label;
  //   * service-platform forwards it and keeps nothing — no store, no cache, no request log body.
  // Identity seals it at once (envelope encryption, AAD bound to commune + App ID, ADR 0066) and
  // keeps only the sealed bytes. Verbatim, not trimmed: 1-256 bytes, printable, no whitespace
  // anywhere (app.validAppSecret); outside that is INVALID_ARGUMENT, decided before any lookup, and
  // the message names the rule, never the value.
  string app_secret = 3;

  // Why the operator acts, as typed in the confirmation dialog (ADR 0070 #5). Required: trimmed,
  // non-empty, at most 500 runes, valid UTF-8 — the same bound as service-platform's
  // domain.ValidateReason, which checks first; identity re-checks because it is the one that writes
  // it into the trail. Outside that is INVALID_ARGUMENT. Not logged (free text an operator typed).
  string reason = 4;

  // As OpenOperatorSessionRequest.client_ip: stored as the trail entry's actor_ip. Decides nothing.
  string client_ip = 5;
}

message SetMiniAppSecretResponse {
  // ACCEPTED, SESSION_NOT_LIVE or PERMISSION_DENIED.
  OperatorAuthOutcome outcome = 1;
  // The version just made live. Set exactly when ACCEPTED. Metadata only — never the secret.
  MiniAppSecretVersion version = 2;
}

message RetireMiniAppSecretRequest {
  // CREDENTIAL — as SetMiniAppSecretRequest.session_token.
  string session_token = 1;
  // As SetMiniAppSecretRequest.app_id.
  string app_id = 2;
  // As SetMiniAppSecretRequest.reason. Required: retiring is a removal and ADR 0070 #2 demands one.
  // For the automatic revoke after a change of App ID, the caller passes the operator's reason for
  // the change — the same act, the same justification.
  string reason = 3;
  // As OpenOperatorSessionRequest.client_ip.
  string client_ip = 4;
}

message RetireMiniAppSecretResponse {
  // ACCEPTED, SESSION_NOT_LIVE or PERMISSION_DENIED.
  OperatorAuthOutcome outcome = 1;
  // The version just retired. Set exactly when ACCEPTED. Metadata only.
  MiniAppSecretRetirement retirement = 2;
}

// One version of an App ID's settings in one commune (service-identity mini_app_secret). What the
// commune detail screen may show about a secret: that it exists, since when, set by whom. NEVER the
// value, a prefix, a length, a hash or a fingerprint of it — each of those narrows a guess.
//
// DELIBERATELY ABSENT: tenant_id (the caller named it in metadata; echoing it is a second source),
// the `--demo` switch (no caller reads it yet; add it, new number, the day one does).
message MiniAppSecretVersion {
  // As SetMiniAppSecretRequest.app_id, normalised (trimmed).
  string app_id = 1;
  // The version row's id (ULID). Correlates with the trail entry; authorises nothing.
  string version = 2;
  google.protobuf.Timestamp set_at = 3;
  // The BUSINESS CODE of the operator who set it, `VH-00001` (rule 6, invariant 8). Never an
  // internal id.
  string set_by = 4;
}

message MiniAppSecretRetirement {
  // As SetMiniAppSecretRequest.app_id, normalised (trimmed).
  string app_id = 1;
  // The id (ULID) of the version that was live and is now retired.
  string retired_version = 2;
  google.protobuf.Timestamp retired_at = 3;
  // The BUSINESS CODE of the operator, `VH-00001`.
  string retired_by = 4;
}

message ListMiniAppSecretStatusesRequest {
  // CREDENTIAL — as SetMiniAppSecretRequest.session_token. The reader is resolved from it.
  //
  // DELIBERATELY NO app_id: the answer is the whole target commune (see the RPC). DELIBERATELY NO
  // client_ip: nothing is written, and a field no code reads is a promise nobody keeps (the
  // argument on ResolveOperatorSessionRequest). Add either, optional and new number, the day code
  // reads it.
  string session_token = 1;
}

message ListMiniAppSecretStatusesResponse {
  // ACCEPTED, SESSION_NOT_LIVE or PERMISSION_DENIED.
  OperatorAuthOutcome outcome = 1;
  // Set only when ACCEPTED: one entry per App ID with a LIVE version in the target commune, ordered
  // by app_id (a stable order; it carries no meaning). At most one entry per App ID (migration 0021,
  // UNIQUE (tenant_id, live_app_id)).
  repeated MiniAppSecretStatus statuses = 2;
}

// The live settings of one App ID in one commune, as the commune detail screen may show them.
//
// WHY A WRAPPER AND NOT A BARE MiniAppSecretVersion: a live version may hold NO secret. Migration
// 0021 allows app_secret_sealed NULL while the version exists for another reason (CHECK
// mini_app_secret_sealed_or_demo), so "a live version exists" and "a secret is set" are two facts,
// and a screen that read the first as the second would tell an operator a commune can sign citizens
// in when it cannot. `secret_set` states the second fact itself.
//
// WHY NOT A FIELD ON MiniAppSecretVersion: that message is also SetMiniAppSecret's answer, where a
// secret is set by construction; a bool there would be a field whose zero value — from an identity
// older than the field — reads as "no secret" on a version that has one.
message MiniAppSecretStatus {
  // The live version: app_id, version id, set_at and set_by (the operator's BUSINESS CODE, rule 6
  // invariant 8). Always present in an entry. set_at / set_by date the VERSION; when secret_set is
  // true they are when and by whom the secret now in force was set.
  MiniAppSecretVersion live_version = 1;
  // True when the live version holds a sealed secret. False means the App ID has live settings but
  // no secret: the screen shows "chưa đặt", never the version's set_at as if a secret were set.
  // A bool and nothing more about the value (see MiniAppSecretVersion).
  bool secret_set = 2;
}

message ListActiveStaffCountsRequest {
  // CREDENTIAL — as SetMiniAppSecretRequest.session_token. The reader is resolved from it; there is
  // no operator field (see the RPC, "WHO MAY READ"). Empty is INVALID_ARGUMENT.
  string session_token = 1;
  // As OpenOperatorSessionRequest.client_ip: stored as the trail entry's actor_ip. Decides nothing.
  string client_ip = 2;
  // DELIBERATELY NO commune field and NO commune filter: the answer is every commune, and a commune
  // named in the body is caller-declared data (rule 1, forbidden #2).
}

message ListActiveStaffCountsResponse {
  // ACCEPTED, SESSION_NOT_LIVE or PERMISSION_DENIED.
  OperatorAuthOutcome outcome = 1;
  // Set only when ACCEPTED: one entry per commune with AT LEAST ONE active staff account, ordered by
  // tenant_id. A commune absent here has zero (see the RPC).
  repeated CommuneActiveStaffCount counts = 2;
}

// One commune's count of active staff accounts. A count and the commune it is about — nothing about
// any person.
message CommuneActiveStaffCount {
  // The commune (ULID). An ANSWER about stored rows, never an input. Platform joins it with its own
  // commune list.
  string tenant_id = 1;
  // `nguoi_dung` rows of this commune with deleted_at IS NULL AND co_tai_khoan AND dang_hoat_dong.
  // Always >= 1 in an entry.
  uint32 active_staff_count = 2;
}

// ---- Owner-only RPCs: operator accounts ----

// One operator account as the owner's management screen shows it. NEVER a password hash, a TOTP
// secret, a recovery code or a session — none of them is needed to manage an account, so none is
// selected.
//
// DELIBERATELY ABSENT: operator_id (the internal id authorises; the screen and every request name the
// account by `code`, the business code the trail records — rule 6, invariant 8).
message OperatorAccount {
  // The business code, `VH-00001`. Names the account in every request below. May be logged.
  string code = 1;
  // The sign-in email. PERSONAL DATA (rule 3): never logged.
  string email = 2;
  // operator_account.display_name. PERSONAL DATA (rule 3): never logged.
  string display_name = 3;
  // Every `ops.*` key granted, read live (operator_permission_grant). Ordered; no meaning in the order.
  repeated string permission_keys = 4;
  // THE owner (exactly one account). Read-only through this contract — no RPC sets it.
  bool is_owner = 5;
  // Administratively disabled (operator_account.disabled_at set). Disabled accounts are listed.
  bool disabled = 6;
  // A temporary password is in force (set at creation or by a reset): the person must set their own.
  bool must_change_password = 7;
  // The failed-sign-in lockout's end. ABSENT means not locked. Present but in the past also means not
  // locked: the lock is DERIVED from this instant vs now (migration 0012), never a flag.
  google.protobuf.Timestamp locked_until = 8;
  google.protobuf.Timestamp created_at = 9;
}

message ListOperatorAccountsRequest {
  // CREDENTIAL — as SetMiniAppSecretRequest.session_token. The owner is resolved from it; there is no
  // actor field (see the service comment). Empty is INVALID_ARGUMENT.
  string session_token = 1;
}

message ListOperatorAccountsResponse {
  // ACCEPTED, SESSION_NOT_LIVE or PERMISSION_DENIED.
  OperatorAuthOutcome outcome = 1;
  // Set only when ACCEPTED: every operator account, ordered by `code`. Never empty when ACCEPTED (the
  // owner reading it is one of them).
  repeated OperatorAccount accounts = 2;
}

message CreateOperatorAccountRequest {
  // CREDENTIAL — the owner's `op1.` token. Empty is INVALID_ARGUMENT.
  string session_token = 1;
  // The new account's sign-in email. PERSONAL DATA (rule 3): never logged. Trimmed by identity;
  // outside the email shape operatorctl accepts is INVALID_ARGUMENT.
  string email = 2;
  // PERSONAL DATA (rule 3). Trimmed, non-empty (operator_account_display_name_not_blank).
  string display_name = 3;
  // SECRET (rule 8) — WRITE-ONLY. Verbatim, never trimmed. Never logged at either end, at any level,
  // nor this whole message (String() prints it); never echoed in any response, status message, trail
  // entry or metric. Identity keeps only its argon2id hash. Checked against the password policy
  // (NEW_PASSWORD_REJECTED).
  string temporary_password = 4;
  // The keys to grant, `ops.<group>.<action>`, each on the realm's closed list (else INVALID_ARGUMENT).
  // May be empty: an account holding no key signs in and every guarded route answers 403. Duplicates
  // are one key.
  repeated string permission_keys = 5;
  // As OpenOperatorSessionRequest.client_ip: stored as the trail entries' actor_ip. Decides nothing.
  string client_ip = 6;
}

message CreateOperatorAccountResponse {
  // ACCEPTED, SESSION_NOT_LIVE, PERMISSION_DENIED or NEW_PASSWORD_REJECTED.
  OperatorAuthOutcome outcome = 1;
  // Set exactly when ACCEPTED: the account as created (its new `code` included). Never the password.
  OperatorAccount account = 2;
  // Set exactly when NEW_PASSWORD_REJECTED.
  NewPasswordRefusal new_password_refusal = 3;
}

message SetOperatorPermissionsRequest {
  // CREDENTIAL — the owner's `op1.` token. Empty is INVALID_ARGUMENT.
  string session_token = 1;
  // The account to change, `VH-00001`. Empty is INVALID_ARGUMENT; unknown is NOT_FOUND.
  string target_code = 2;
  // The COMPLETE desired set (see the RPC). Each on the realm's closed list (else INVALID_ARGUMENT).
  // EMPTY IS MEANINGFUL: it revokes every key. Duplicates are one key.
  repeated string permission_keys = 3;
  // Why, as typed in the confirmation dialog. Required: trimmed, non-empty, at most 500 runes, valid
  // UTF-8 (as SetMiniAppSecretRequest.reason). Not logged.
  string reason = 4;
  // As OpenOperatorSessionRequest.client_ip.
  string client_ip = 5;
}

message SetOperatorPermissionsResponse {
  // ACCEPTED, SESSION_NOT_LIVE or PERMISSION_DENIED.
  OperatorAuthOutcome outcome = 1;
  // Set exactly when ACCEPTED: the account as it now stands, its keys read back after the write.
  OperatorAccount account = 2;
}

message ResetOperatorPasswordRequest {
  // CREDENTIAL — the owner's `op1.` token. Empty is INVALID_ARGUMENT.
  string session_token = 1;
  // The account to reset, `VH-00001`. Empty is INVALID_ARGUMENT; unknown is NOT_FOUND.
  string target_code = 2;
  // SECRET (rule 8) — WRITE-ONLY, as CreateOperatorAccountRequest.temporary_password.
  string temporary_password = 3;
  // As SetOperatorPermissionsRequest.reason. Required.
  string reason = 4;
  // As OpenOperatorSessionRequest.client_ip.
  string client_ip = 5;
}

message ResetOperatorPasswordResponse {
  // ACCEPTED, SESSION_NOT_LIVE, PERMISSION_DENIED or NEW_PASSWORD_REJECTED.
  OperatorAuthOutcome outcome = 1;
  // Set exactly when ACCEPTED: the account after the reset (must_change_password true). Never the
  // password.
  OperatorAccount account = 2;
  // Set exactly when NEW_PASSWORD_REJECTED.
  NewPasswordRefusal new_password_refusal = 3;
}

// ---- Owner-only RPCs: a commune's staff accounts (commune in metadata "x-tenant-id") ----

// One sign-in account of the target commune, as the owner's screen shows it. The NARROWEST shape that
// lets the owner find the person and act: no phone, no unit, no position, no last sign-in.
//
// DELIBERATELY ABSENT: tenant_id (the caller named it in metadata; echoing it is a second source).
message CommuneStaffAccount {
  // nguoi_dung.id (ULID). Names the account in ResetStaffPassword. Authorises nothing; never written
  // into a trail as "who".
  string user_id = 1;
  // The staff business code (nguoi_dung.ma, `CB-…`) — what the commune's audit screen shows. May be
  // logged.
  string staff_code = 2;
  // The SIGN-IN NAME: nguoi_dung.email, the column sign-in matches (store.CanBoStore.TheoEmail) — a
  // work address, or the literal `admin` of a commune's seeded administrator. PERSONAL DATA (rule 3):
  // never logged.
  string email = 3;
  // nguoi_dung.ho_ten. PERSONAL DATA (rule 3): never logged.
  string full_name = 4;
  // The account's role, `vai_tro.ma` and its display name. ONE role, not a list: a staff row holds
  // one `vai_tro_id` (migration 0001). Both empty when the account holds no role.
  string role_code = 5;
  string role_name = 6;
  // role_code == "quan-tri-he-thong" — the commune's administrator role. Stated by identity so the
  // screen never holds its own copy of that literal.
  bool is_admin = 7;
  // Administratively locked: nguoi_dung.dang_hoat_dong = false (ResetStaffPassword refuses these).
  bool disabled = 8;
  // A temporary password is in force: nguoi_dung.phai_doi_mat_khau.
  bool must_change_password = 9;
  // The automatic failed-sign-in lock's end (nguoi_dung.sign_in_locked_until, migration 0020). ABSENT
  // means not locked; present but past also means not locked — the lock is derived, never a flag.
  google.protobuf.Timestamp sign_in_locked_until = 10;
}

message ListCommuneStaffAccountsRequest {
  // CREDENTIAL — the owner's `op1.` token. Empty is INVALID_ARGUMENT.
  string session_token = 1;
  // As OpenOperatorSessionRequest.client_ip: stored as the read's trail entry's actor_ip.
  string client_ip = 2;
  // DELIBERATELY NO commune field: the commune is the "x-tenant-id" metadata (rule 1, forbidden #2).
}

message ListCommuneStaffAccountsResponse {
  // ACCEPTED, SESSION_NOT_LIVE or PERMISSION_DENIED.
  OperatorAuthOutcome outcome = 1;
  // Set only when ACCEPTED, ordered by `email`. EMPTY is a valid answer.
  repeated CommuneStaffAccount accounts = 2;
}

message CreateCommuneAdminAccountRequest {
  // CREDENTIAL — the owner's `op1.` token. Empty is INVALID_ARGUMENT.
  string session_token = 1;
  // The SIGN-IN NAME of the new account — goes into nguoi_dung.email, the column sign-in matches (see
  // CommuneStaffAccount.email). PERSONAL DATA (rule 3): never logged. Trimmed by identity; outside the
  // shape the staff directory accepts is INVALID_ARGUMENT.
  string email = 2;
  // nguoi_dung.ho_ten. PERSONAL DATA (rule 3). Trimmed, non-empty.
  string full_name = 3;
  // SECRET (rule 8) — WRITE-ONLY, as CreateOperatorAccountRequest.temporary_password.
  string temporary_password = 4;
  // As OpenOperatorSessionRequest.client_ip.
  string client_ip = 5;
}

message CreateCommuneAdminAccountResponse {
  // ACCEPTED, SESSION_NOT_LIVE, PERMISSION_DENIED or NEW_PASSWORD_REJECTED.
  OperatorAuthOutcome outcome = 1;
  // Set exactly when ACCEPTED: the account as created (is_admin true, must_change_password true).
  CommuneStaffAccount account = 2;
  // Set exactly when NEW_PASSWORD_REJECTED.
  NewPasswordRefusal new_password_refusal = 3;
}

message ResetStaffPasswordRequest {
  // CREDENTIAL — the owner's `op1.` token. Empty is INVALID_ARGUMENT.
  string session_token = 1;
  // CommuneStaffAccount.user_id of the target commune. Empty is INVALID_ARGUMENT; not a live sign-in
  // account of THIS commune is NOT_FOUND.
  string user_id = 2;
  // SECRET (rule 8) — WRITE-ONLY, as CreateOperatorAccountRequest.temporary_password.
  string temporary_password = 3;
  // As SetOperatorPermissionsRequest.reason. Required.
  string reason = 4;
  // As OpenOperatorSessionRequest.client_ip.
  string client_ip = 5;
}

message ResetStaffPasswordResponse {
  // ACCEPTED, SESSION_NOT_LIVE, PERMISSION_DENIED or NEW_PASSWORD_REJECTED.
  OperatorAuthOutcome outcome = 1;
  // Set exactly when ACCEPTED: the account after the reset (must_change_password true). Never the
  // password.
  CommuneStaffAccount account = 2;
  // Set exactly when NEW_PASSWORD_REJECTED.
  NewPasswordRefusal new_password_refusal = 3;
}

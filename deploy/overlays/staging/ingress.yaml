# Xem chú giải đầy đủ ở `deploy/overlays/prod/ingress.yaml` — quyết định định tuyến
# `/api/v1` CHƯA ĐƯỢC CHỐT và áp dụng cho cả hai môi trường.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vigov
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["*.staging.vigov.vn"]
      secretName: vigov-staging-tls
  rules:
    - host: "*.staging.vigov.vn"
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: identity
                port: { name: rest }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-admin
                port: { name: http }

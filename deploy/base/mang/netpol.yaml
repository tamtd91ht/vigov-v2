# BIÊN MẠNG. Đây là biên DUY NHẤT bảo vệ cổng 9090.
#
# `core/platformclient/directory.go:73` quay số bằng `insecure.NewCredentials()`: gRPC giữa
# các dịch vụ KHÔNG có TLS và KHÔNG đi qua lớp kiểm quyền của bề mặt REST. `EXPOSE 9090`
# trong Dockerfile chỉ là tài liệu. Nếu tệp này không được áp, mọi thứ vẫn chạy và trông
# bình thường — chỉ là danh bạ xã của toàn hệ thống mở cho bất kỳ pod nào trong cụm.

# 1. Từ chối tất cả, cả vào lẫn ra. Mọi cho phép bên dưới là NGOẠI LỆ có tên.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# 2. REST 8080: chỉ từ ingress controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rest-from-ingress
spec:
  podSelector:
    matchLabels: { vigov.vn/surface: rest }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports:
        - { port: 8080, protocol: TCP }
        - { port: 3000, protocol: TCP }
---
# 3. gRPC 9090: CHỈ từ pod trong cùng namespace. Không từ ingress, không từ namespace khác.
#
# `from` rỗng thì mặc định là "mọi pod trong namespace của chính policy này" — đó chính là
# điều mong muốn, và nó được viết ra tường minh ở đây để không ai đọc nhầm thành "mọi nơi".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grpc-internal
spec:
  podSelector:
    matchLabels: { vigov.vn/grpc: "true" }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { port: 9090, protocol: TCP }
---
# 4. Đường RA: DNS, gRPC nội bộ, và hạ tầng dữ liệu NGOÀI cụm.
#
# ⚠ TẠM MỞ `0.0.0.0/0` TỪ 24/09/2026 — NỢ, không phải thiết kế. Người dùng chọn gỡ ràng buộc
# địa chỉ để deploy prod trước khi biết dải mạng của PostgreSQL / Redis, "bổ sung sau".
# Theo dõi ở sổ `_chung/netpol-duong-ra-tam-mo`.
#
# Vẫn GIỮ giới hạn CỔNG: pod ra được mọi địa chỉ nhưng chỉ trên 5432 / 6379 / 9092. Xoá hẳn
# luật này thì KHÔNG được — quy tắc 1 từ chối mọi đường ra, nên pod mất CSDL và chết ở bước
# di trú. Cái giá của lúc tạm mở: một pod bị chiếm quyền gửi được dữ liệu tới BẤT KỲ máy nào
# mở một trong ba cổng ấy, thay vì chỉ tới mạng nội bộ. Một dịch vụ hồ sơ hành chính không có
# lý do gì để ra Internet, nên đích đúng là dải mạng thật của CSDL — thay `0.0.0.0/0` bằng dải
# ấy ngay khi biết, rồi render lại (deploy/README.md mục 11.3).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector: {}
      ports:
        - { port: 9090, protocol: TCP }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0       # ← NỢ: thay bằng dải mạng thật của PostgreSQL / Redis / Kafka
      ports:
        - { port: 5432, protocol: TCP }
        - { port: 6379, protocol: TCP }
        - { port: 9092, protocol: TCP }
---
# 5. REST 8080 của dịch vụ Go: nhận thêm từ pod web-admin.
#
# Từ 25/09/2026 web-admin là CỔNG của `/api/v1/*` (k8s chỉ cấp Secret + ConfigMap, định
# tuyến nằm trong ứng dụng — `web-admin/src/app/api/v1/[...duong]/route.ts`). Quy tắc 2 chỉ
# mở 8080 từ namespace ingress-nginx, nên thiếu luật này thì mọi lời gọi API qua web-admin
# là 502 dù mọi pod đều xanh.
#
# Chọn pod web-admin bằng NHÃN TÊN, không bằng `vigov.vn/surface: rest` — nhãn ấy cũng gắn
# trên chính các pod Go, và mở theo nó là cho mọi dịch vụ gọi REST của nhau, một đường vòng
# qua hợp đồng gRPC (luật 2).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rest-from-web-admin
spec:
  podSelector:
    matchLabels: { vigov.vn/surface: rest }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: web-admin }
      ports:
        - { port: 8080, protocol: TCP }
---
# 7. Đường RA của RIÊNG petitions: kho tệp MinIO và máy quét clamd (ADR 0052, 📎 đính kèm nhật
# ký nhiệm vụ — b37ec2d). Người dùng yêu cầu mở 29/09/2026.
#
# CHỈ pod petitions — dịch vụ duy nhất đang lưu tệp. Mở ở quy tắc 4 (`podSelector: {}`) là cho
# mọi dịch vụ tới kho tệp, trong khi IAM của từng dịch vụ chỉ có `…/<service>/*`; biên mạng
# không nên rộng hơn biên quyền.
#
# ⚠ ĐÍCH TẠM MỞ, cùng loại nợ với quy tắc 4 (`_chung/netpol-duong-ra-tam-mo`): chưa biết MinIO
# và clamd chạy trong cụm hay ngoài cụm, nên cho cả hai — mọi namespace (clamd là Service k8s)
# và mọi địa chỉ — nhưng GIỮ giới hạn CỔNG. Thay bằng namespace / dải mạng thật khi biết.
#
# CỔNG: 9000 là cổng API mặc định của MinIO; 3310 là cổng mặc định của clamd. Nếu
# OBJECT_STORAGE_ENDPOINT hay MALWARE_SCANNER_ADDRESS dùng cổng khác, sửa ở đây — sai cổng thì
# mọi lần tải lên trả 503 "chưa kiểm được" dù pod xanh.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-petitions-egress-storage
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: petitions }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 0.0.0.0/0       # ← NỢ: thay bằng dải mạng thật của MinIO / clamd
      ports:
        - { port: 9000, protocol: TCP }
        - { port: 3310, protocol: TCP }
---
# 6. Đường RA của RIÊNG web-admin: tới REST 8080 của các pod trong namespace.
#
# Tách khỏi quy tắc 4 vì quy tắc 4 áp cho MỌI pod (`podSelector: {}`) — mở 8080 ở đó là cho
# cả dịch vụ Go gọi REST của nhau.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-admin-egress-rest
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: web-admin }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { vigov.vn/surface: rest }
      ports:
        - { port: 8080, protocol: TCP }

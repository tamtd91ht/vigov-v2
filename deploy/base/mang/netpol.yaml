# BIÊN MẠNG. Đây là biên DUY NHẤT bảo vệ cổng 9090.
#
# `core/platformclient/directory.go:73` quay số bằng `insecure.NewCredentials()`: gRPC giữa
# các dịch vụ KHÔNG có TLS và KHÔNG đi qua lớp kiểm quyền của bề mặt REST. `EXPOSE 9090`
# trong Dockerfile chỉ là tài liệu. Nếu tệp này không được áp, mọi thứ vẫn chạy và trông
# bình thường — chỉ là danh bạ xã của toàn hệ thống mở cho bất kỳ pod nào trong cụm.

# 1. Từ chối tất cả, cả vào lẫn ra. Mọi cho phép bên dưới là NGOẠI LỆ có tên.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# 2. REST 8080: chỉ từ ingress controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rest-from-ingress
spec:
  podSelector:
    matchLabels: { vigov.vn/surface: rest }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports:
        - { port: 8080, protocol: TCP }
        - { port: 3000, protocol: TCP }
---
# 3. gRPC 9090: CHỈ từ pod trong cùng namespace. Không từ ingress, không từ namespace khác.
#
# `from` rỗng thì mặc định là "mọi pod trong namespace của chính policy này" — đó chính là
# điều mong muốn, và nó được viết ra tường minh ở đây để không ai đọc nhầm thành "mọi nơi".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grpc-internal
spec:
  podSelector:
    matchLabels: { vigov.vn/grpc: "true" }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { port: 9090, protocol: TCP }
---
# 4. Đường RA: DNS, gRPC nội bộ, và hạ tầng dữ liệu NGOÀI cụm.
#
# ⚠ TẠM MỞ `0.0.0.0/0` TỪ 24/09/2026 — NỢ, không phải thiết kế. Người dùng chọn gỡ ràng buộc
# địa chỉ để deploy prod trước khi biết dải mạng của PostgreSQL / Redis, "bổ sung sau".
# Theo dõi ở sổ `_chung/netpol-duong-ra-tam-mo`.
#
# Vẫn GIỮ giới hạn CỔNG: pod ra được mọi địa chỉ nhưng chỉ trên 5432 / 6379 / 9092. Xoá hẳn
# luật này thì KHÔNG được — quy tắc 1 từ chối mọi đường ra, nên pod mất CSDL và chết ở bước
# di trú. Cái giá của lúc tạm mở: một pod bị chiếm quyền gửi được dữ liệu tới BẤT KỲ máy nào
# mở một trong ba cổng ấy, thay vì chỉ tới mạng nội bộ. Một dịch vụ hồ sơ hành chính không có
# lý do gì để ra Internet, nên đích đúng là dải mạng thật của CSDL — thay `0.0.0.0/0` bằng dải
# ấy ngay khi biết, rồi render lại (deploy/README.md mục 11.3).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector: {}
      ports:
        - { port: 9090, protocol: TCP }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0       # ← NỢ: thay bằng dải mạng thật của PostgreSQL / Redis / Kafka
      ports:
        - { port: 5432, protocol: TCP }
        - { port: 6379, protocol: TCP }
        - { port: 9092, protocol: TCP }
---
# 5. REST 8080 của dịch vụ Go: nhận thêm từ pod web-admin.
#
# Từ 25/09/2026 web-admin là CỔNG của `/api/v1/*` (k8s chỉ cấp Secret + ConfigMap, định
# tuyến nằm trong ứng dụng — `web-admin/src/app/api/v1/[...duong]/route.ts`). Quy tắc 2 chỉ
# mở 8080 từ namespace ingress-nginx, nên thiếu luật này thì mọi lời gọi API qua web-admin
# là 502 dù mọi pod đều xanh.
#
# Chọn pod web-admin bằng NHÃN TÊN, không bằng `vigov.vn/surface: rest` — nhãn ấy cũng gắn
# trên chính các pod Go, và mở theo nó là cho mọi dịch vụ gọi REST của nhau, một đường vòng
# qua hợp đồng gRPC (luật 2).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rest-from-web-admin
spec:
  podSelector:
    matchLabels: { vigov.vn/surface: rest }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: web-admin }
      ports:
        - { port: 8080, protocol: TCP }
---
# 7. Đường RA của RIÊNG petitions: kho tệp MinIO và máy quét clamd (ADR 0052, 📎 đính kèm nhật
# ký nhiệm vụ — b37ec2d). Người dùng yêu cầu mở 29/09/2026.
#
# CHỈ pod petitions — dịch vụ duy nhất đang lưu tệp. Mở ở quy tắc 4 (`podSelector: {}`) là cho
# mọi dịch vụ tới kho tệp, trong khi IAM của từng dịch vụ chỉ có `…/<service>/*`; biên mạng
# không nên rộng hơn biên quyền.
#
# ⚠ ĐÍCH TẠM MỞ, cùng loại nợ với quy tắc 4 (`_chung/netpol-duong-ra-tam-mo`): chưa biết MinIO
# và clamd chạy trong cụm hay ngoài cụm, nên cho cả hai — mọi namespace (clamd là Service k8s)
# và mọi địa chỉ — nhưng GIỮ giới hạn CỔNG. Thay bằng namespace / dải mạng thật khi biết.
#
# CỔNG: 9000 là cổng API mặc định của MinIO; 3310 là cổng mặc định của clamd. Nếu
# OBJECT_STORAGE_ENDPOINT hay MALWARE_SCANNER_ADDRESS dùng cổng khác, sửa ở đây — sai cổng thì
# mọi lần tải lên trả 503 "chưa kiểm được" dù pod xanh.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-petitions-egress-storage
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: petitions }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 0.0.0.0/0       # ← NỢ: thay bằng dải mạng thật của MinIO / clamd
      ports:
        - { port: 9000, protocol: TCP }
        - { port: 3310, protocol: TCP }
---
# 8. Cầu phiên công dân 9091 của identity: CHỈ từ pod `vihat-miniapp` (ADR 0045).
#
# Tách khỏi quy tắc 3 có chủ đích: 9090 tin mọi pod trong namespace, còn cầu này đổi một mã
# Zalo lấy phiên công dân của một xã. Cầu đi KHÔNG TLS vì hai bên cùng cụm, cùng namespace
# (người dùng xác nhận 30/09/2026); tách cụm thì phải có TLS trước — điều kiện dừng #5 của 0045.
# Ngoài biên mạng còn khoá `x-vigov-bridge-key` trên mỗi lời gọi — cả hai, không phải một.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-citizen-bridge-from-miniapp
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: identity }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: vihat-miniapp }
      ports:
        - { port: 9091, protocol: TCP }
---
# 9. `vihat-miniapp` (kho riêng, cùng namespace): quy tắc 1 từ chối nó cả vào lẫn ra, và nó
# không mang nhãn `vigov.vn/surface: rest`, nên thiếu luật này thì pod xanh mà Mini App không
# đăng nhập được — không lời gọi nào tới nó, và nó không gọi được Zalo lẫn cầu.
#
# VÀO: 8080 chỉ từ ingress controller. RA: cầu 9091 của identity, và 443 tới Zalo
# (`graph.zalo.me` đọc mã tài khoản, `business.openapi.zalo.me` đổi số/vị trí/ZNS).
# ⚠ 443 mở tới `0.0.0.0/0` vì Zalo không công bố dải địa chỉ; CHỈ pod này, CHỈ cổng 443 — cùng
# loại nợ với quy tắc 4 (`_chung/netpol-duong-ra-tam-mo`). CSDL 5432 và DNS đã có ở quy tắc 4.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-miniapp
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: vihat-miniapp }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports:
        - { port: 8080, protocol: TCP }
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: identity }
      ports:
        - { port: 9091, protocol: TCP }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0       # ← NỢ: Zalo không công bố dải; giữ giới hạn cổng 443
      ports:
        - { port: 443, protocol: TCP }
---
# 10. Đường RA của RIÊNG identity: 443 tới Zalo (ADR 0066). App riêng của xã đăng nhập thẳng vào
# identity (`POST /api/v1/citizen-sessions`), nên identity tự đổi accessToken/phoneToken với Zalo
# Graph API (`graph.zalo.me` — hằng `zalo.DefaultBaseURL` trong mã, không phải biến môi trường).
# Thiếu luật này thì pod xanh mà mọi lượt đăng nhập thật của app riêng trả 502; `--demo` vẫn chạy vì
# không gọi Zalo — đúng kiểu hỏng trông như chạy được.
#
# ⚠ 443 mở tới `0.0.0.0/0` vì Zalo không công bố dải địa chỉ; CHỈ pod identity, CHỈ cổng 443 — cùng
# loại nợ với quy tắc 4 và 9 (`_chung/netpol-duong-ra-tam-mo`). Một pod identity bị chiếm quyền gửi
# được tới bất kỳ máy nào mở 443, thay vì chỉ tới Zalo. Thay bằng egress gateway / FQDN policy khi cụm có.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-identity-egress-zalo
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: identity }
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0       # ← NỢ: Zalo không công bố dải; giữ giới hạn cổng 443
      ports:
        - { port: 443, protocol: TCP }
---
# 6. Đường RA của RIÊNG web-admin: tới REST 8080 của các pod trong namespace.
#
# Tách khỏi quy tắc 4 vì quy tắc 4 áp cho MỌI pod (`podSelector: {}`) — mở 8080 ở đó là cho
# cả dịch vụ Go gọi REST của nhau.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-admin-egress-rest
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: web-admin }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { vigov.vn/surface: rest }
      ports:
        - { port: 8080, protocol: TCP }
# 11. platform → identity gRPC 9090: kênh OperatorService của khu vận hành (ADR 0048 §01/10 #2).
#
# Kênh này mang MẬT KHẨU, mã TOTP, mã khôi phục và token `op1.` của người vận hành, KHÔNG TLS —
# người dùng chốt 01/10/2026: chung nợ với các kênh gRPC nội cụm hiện có, và là ĐIỀU KIỆN CHẶN
# GO-LIVE: luật này phải được áp lên cụm thật TRƯỚC KHI đặt OPERATOR_HOST
# (`core/operatorclient/dial.go`, dấu `@security-exception`).
#
# ⚠ NÓI THẲNG: hôm nay luật này CHƯA THÊM QUYỀN NÀO. Quy tắc 3 (`allow-grpc-internal`) đã cho mọi
# pod trong namespace vào 9090, và quy tắc 4 đã cho mọi pod ra 9090. NetworkPolicy chỉ CỘNG quyền,
# không bớt được — nên luật hẹp này chỉ thành biên thật vào ngày quy tắc 3 được hẹp lại theo từng
# cặp gọi. Nó được viết ra để cặp platform → identity đã có tên sẵn khi việc ấy làm, và để không ai
# đọc quy tắc 3 rồi tưởng kênh mật khẩu này đã được khoanh riêng.
#
# HẸP CÓ CHỦ Ý: chỉ pod platform, chỉ tới pod identity, chỉ cổng 9090. Không 8080, không 9091
# (cầu phiên công dân — quy tắc 8).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform-to-identity-grpc
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: identity }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: platform }
      ports:
        - { port: 9090, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform-egress-identity-grpc
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: platform }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: identity }
      ports:
        - { port: 9090, protocol: TCP }
---

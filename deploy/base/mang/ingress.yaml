# TỆP NÀY ĐƯỢC SINH RA bởi tools/ingress. KHÔNG SỬA TAY — sửa tay là mất, im lặng, ở
# lần sinh sau (luật 9, bất biến 8). Sinh lại: `go run ./tools/ingress` (hoặc `make kb`).
#
# NGUỒN CHUẨN: kb/20-contracts/openapi.json — chính nó sinh từ khai báo route trong
# */internal/ (ADR 0014). Dịch vụ nào có tuyến REST thì có một host API; thêm tuyến KHÔNG
# phải sửa tệp này: khai route trong Go, chạy `make kb`. Quên sinh lại thì
# `go test ./tools/ingress` ĐỎ.
#
#     281 tuyến của 7 dịch vụ — petitions 84 · identity 67 · comms 51 · finance 40 · documents 29 · platform 8 · reporting 2
#
# MÔ HÌNH TÊN MIỀN — chủ dự án chốt 26/09/2026:
#   <xã>.vigov.vn          → web-admin, chỉ một luật `/`. Web tự chuyển tiếp /api/v1/* tới
#                            dịch vụ chủ theo web-admin/src/lib/api/dinh-tuyen.gen.ts (ADR 0043)
#   <dịch vụ>.api.vigov.vn → dịch vụ ấy, một luật `/`
# Bảng tiền tố → dịch vụ vì thế KHÔNG còn là các luật `paths` ở đây; nó chỉ còn là chú
# giải trên từng host dịch vụ, và là bảng TS kia — cùng một lần phân giải hợp đồng.
#
# HOST và TLS của từng môi trường do overlay vá vào (deploy/overlays/<mt>/ingress-moi-truong.yaml,
# CŨNG SINH RA bởi bộ sinh này). Base mang host của prod.
#
# 1 host web + 7 host dịch vụ.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vigov
  annotations:
    # Bắt buộc HTTPS. Số điện thoại và nội dung phản ánh của công dân đi qua đây
    # (Nghị định 13/2023/NĐ-CP).
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  ingressClassName: nginx
  # `tls:` do overlay THÊM VÀO — tên secret khác nhau từng môi trường.
  #
  # THỨ TỰ `rules` CÓ Ý NGHĨA: overlay vá host theo CHỈ SỐ (`/spec/rules/<i>/host`). Chỉ số 0 là
  # host web; 1..n là host dịch vụ, xếp theo tên. Bản vá overlay `test` host cũ trước khi
  # `replace`, nên overlay lệch chỉ số là `kustomize build` ĐỔ chứ không vá nhầm host.
  rules:
    # HOST WEB — MỘT quy tắc ký tự đại diện cho MỌI xã. `Host` thật đi nguyên vẹn tới pod
    # (ingress-nginx giữ nguyên Host mặc định) và `httpx.TenantMiddleware` phân giải nó thành
    # xã ở rìa ngoài cùng. Host không khớp xã nào ⇒ 404, không bao giờ một xã mặc định
    # (luật 1, bất biến 3). Thêm một xã = thêm DNS + một hàng trong sổ xã của `platform`.
    #
    # Nhãn đầu `admin` · `admin-stg` · `api` · `api-stg` · `stg` · `www` khớp ký tự đại diện này
    # nhưng là nhãn DÀNH RIÊNG: `platform` từ chối gán chúng cho một xã, nên chúng nhận 404.
    - host: "*.vigov.vn"
      http:
        paths:
          # BẮT HẾT — web quản trị (Next.js). KHÔNG sinh từ hợp đồng. `/api/v1/*` cũng tới đây và
          # web chuyển tiếp; tiền tố lạ nhận 404 JSON, không tới dịch vụ nào (ADR 0043).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-admin
                port: { name: http }
    #
    # comms — 20 tài nguyên: /api/v1/announcements · /api/v1/comms-audit-entries
    #   /api/v1/commune-external-contacts · /api/v1/commune-news · /api/v1/content-categories
    #   /api/v1/content-items · /api/v1/external-contacts · /api/v1/mail-settings
    #   /api/v1/map-asset-points · /api/v1/map-asset-summary · /api/v1/map-asset-types
    #   /api/v1/map-assets · /api/v1/map-field-schemas · /api/v1/map-frame · /api/v1/notifications
    #   /api/v1/portal-sync · /api/v1/zalo-bot-updates · /api/v1/zalo-bots
    #   /api/v1/zalo-channel-settings · /api/v1/zalo-links
    - host: "comms.api.vigov.vn"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: comms
                port: { name: rest }
    #
    # documents — 9 tài nguyên: /api/v1/citizen-letter-counts · /api/v1/citizen-letter-report
    #   /api/v1/citizen-letters · /api/v1/document-types · /api/v1/documents-audit-entries
    #   /api/v1/incoming-document-overdue-queue · /api/v1/incoming-document-summary
    #   /api/v1/incoming-documents · /api/v1/outgoing-documents
    - host: "documents.api.vigov.vn"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: documents
                port: { name: rest }
    #
    # finance — 14 tài nguyên: /api/v1/budget-entries · /api/v1/budget-indicators
    #   /api/v1/budget-lines · /api/v1/budget-period-closes · /api/v1/budget-sheets
    #   /api/v1/capital-plan-categories · /api/v1/disbursements · /api/v1/finance-audit-entries
    #   /api/v1/finance-system-messages · /api/v1/funding-sources · /api/v1/implementing-units
    #   /api/v1/investment-project-summary · /api/v1/investment-projects · /api/v1/project-issues
    - host: "finance.api.vigov.vn"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finance
                port: { name: rest }
    #
    # identity — 23 tài nguyên: /api/v1/automation-jobs · /api/v1/citizen-letter-deadline-rules
    #   /api/v1/citizen-sessions · /api/v1/commune-profiles · /api/v1/commune-staff
    #   /api/v1/communes · /api/v1/identity-audit-entries · /api/v1/my-residential-units
    #   /api/v1/org-units · /api/v1/public-holidays · /api/v1/residential-unit-types
    #   /api/v1/residential-units · /api/v1/role-permissions · /api/v1/roles · /api/v1/sessions
    #   /api/v1/sla · /api/v1/staff · /api/v1/staff-count-queries · /api/v1/staff-counts
    #   /api/v1/staff-directory · /api/v1/swap-working-days · /api/v1/task-blocs
    #   /api/v1/working-hours
    - host: "identity.api.vigov.vn"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: identity
                port: { name: rest }
    #
    # petitions — 26 tài nguyên: /api/v1/citizen-letter-tasks · /api/v1/citizen-report-breakdown
    #   /api/v1/citizen-report-counts · /api/v1/citizen-report-fields
    #   /api/v1/citizen-report-intake-fields · /api/v1/citizen-report-points
    #   /api/v1/citizen-report-summary · /api/v1/citizen-reports · /api/v1/meetings
    #   /api/v1/my-citizen-report-fields · /api/v1/my-citizen-reports
    #   /api/v1/overdue-citizen-reports · /api/v1/overdue-tasks · /api/v1/petitions-audit-entries
    #   /api/v1/petitions-system-messages · /api/v1/public-citizen-report-fields
    #   /api/v1/public-citizen-reports · /api/v1/task-counts · /api/v1/task-extension-counts
    #   /api/v1/task-extensions · /api/v1/task-priorities · /api/v1/task-statuses
    #   /api/v1/task-summary · /api/v1/task-types · /api/v1/task-unit-summary · /api/v1/tasks
    - host: "petitions.api.vigov.vn"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: petitions
                port: { name: rest }
    #
    # platform — CHỈ 1 đường dẫn công khai, khớp ĐÚNG (Exact), không `/`: cổng REST của
    # dịch vụ này còn phục vụ miền vận hành (ADR 0048), nên chỉ tuyến được chủ dự án mở mới
    # ra internet — danh sách ở pathScopedPublicRoutes (tools/ingress/sinh.go).
    - host: "platform.api.vigov.vn"
      http:
        paths:
          - path: /api/v1/mini-app-ids
            pathType: Exact
            backend:
              service:
                name: platform
                port: { name: rest }
    #
    # reporting — 1 tài nguyên: /api/v1/reporting-system-messages
    - host: "reporting.api.vigov.vn"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reporting
                port: { name: rest }
